    shuffle: { len: 16, k: 'x.......x.x.....', s: '....x.......x...', h: 'x.xx.xx.xx.xx.x.' },
    waltz: { len: 12, k: 'x...........', s: '....x...x...', h: '..x...x...x.' },
    none: { len: 16, k: '', s: '', h: '' }
  };
  const TRACKS = [
    { name: 'Neon Lounge', mood: 'Smooth late-night groove', bpm: 92, root: 50, mode: 'dorian', prog: [1, 4, 1, 5], groove: 'break', swing: .18, lead: 'triangle', pad: 'sine', bass: 'walk', dens: .45, seed: 11 },
    { name: 'Brass & Velvet', mood: 'Bright and bouncy', bpm: 108, root: 53, mode: 'major', prog: [1, 6, 2, 5], groove: 'four', swing: 0, lead: 'square', pad: 'triangle', bass: 'root', dens: .55, seed: 23 },
    { name: 'Cube Waltz', mood: 'Turning in three-four', bpm: 132, root: 55, mode: 'major', prog: [1, 4, 5, 1], groove: 'waltz', swing: 0, lead: 'triangle', pad: 'sine', bass: 'root', dens: .5, seed: 37 },
    { name: 'Slide Shuffle', mood: 'Swingy and playful', bpm: 112, root: 57, mode: 'mixo', prog: [1, 7, 4, 1], groove: 'shuffle', swing: .33, lead: 'square', pad: 'triangle', bass: 'octave', dens: .5, seed: 41 },
    { name: 'Midnight Jigsaw', mood: 'Slow and dreamy', bpm: 76, root: 48, mode: 'minor', prog: [1, 6, 3, 7], groove: 'half', swing: .1, lead: 'sine', pad: 'sawtooth', bass: 'root', dens: .35, seed: 53 },
    { name: 'Arcade Rush', mood: 'Fast chiptune energy', bpm: 150, root: 52, mode: 'minor', prog: [1, 6, 7, 5], groove: 'four', swing: 0, lead: 'square', pad: 'square', bass: 'arp', dens: .7, seed: 67 },
    { name: 'Zen Garden', mood: 'Calm, no drums', bpm: 64, root: 51, mode: 'major', penta: true, prog: [1, 4, 6, 5], groove: 'none', swing: 0, lead: 'sine', pad: 'sine', bass: 'drone', dens: .28, seed: 71 },
    { name: 'Maze Runner', mood: 'Mysterious and driving', bpm: 124, root: 45, mode: 'harm', prog: [1, 4, 5, 1], groove: 'break', swing: 0, lead: 'sawtooth', pad: 'triangle', bass: 'arp', dens: .5, seed: 83 },
    { name: 'Stack Fever', mood: 'Tense and quick', bpm: 140, root: 47, mode: 'minor', prog: [1, 7, 6, 5], groove: 'four', swing: 0, lead: 'square', pad: 'triangle', bass: 'octave', dens: .62, seed: 97 },
    { name: 'Last Light', mood: 'Hopeful wind-down', bpm: 84, root: 48, mode: 'lydian', prog: [1, 2, 1, 5], groove: 'half', swing: .12, lead: 'triangle', pad: 'sine', bass: 'root', dens: .4, seed: 101 }
  ];
  let ac = null, master = null, bus = null, echo = null, noiseBuf = null, timer = null, idx = 0, step = 0, nextT = 0, song = null, playing = false, listeners = [];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function init() {
    if (ac) return; ac = new (window.AudioContext || window.webkitAudioContext)();
    master = ac.createGain(); const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 4;
    master.connect(comp).connect(ac.destination); bus = ac.createGain(); bus.connect(master);
    echo = ac.createDelay(1); const fb = ac.createGain(), wet = ac.createGain(); fb.gain.value = .32; wet.gain.value = .22; echo.connect(fb).connect(echo); echo.connect(wet).connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setVol(S.musicVol);
  }
  function setVol(v) { if (master) master.gain.setTargetAtTime(v * .55, ac.currentTime, .05); }
  function compose(tr) { // seeded melody: phrase A, A′, B, A over eight bars
    const R = rng(tr.seed), g = GROOVE[tr.groove], L = g.len, sc = tr.penta ? [0, 2, 4, 7, 9] : SC[tr.mode];
    const phrase = () => { const out = []; let p = 7 + Math.floor(R() * 3); for (let i = 0; i < L * 2; i++) { const strong = i % (L / 4) === 0; if (R() < (strong ? tr.dens + .3 : tr.dens * .7)) { p += Math.round((R() - .5) * 4); p = clamp(p, 3, 13); out.push({ p, len: R() < .3 ? 2 : 1, strong }); } else out.push(null); } return out; };
    const A = phrase(), B = phrase(), A2 = A.map((n, i) => i > L * 1.5 && n ? { ...n, p: n.p + (R() < .5 ? 2 : -2) } : n);
    return { L, sc, mel: [...A, ...A2, ...B, ...A] };
  }
  function tone(type, f, t, dur, vol, dest = bus, att = .01, cutoff = 0) {
    const o = ac.createOscillator(), gn = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + att); gn.gain.setTargetAtTime(0, t + dur * .7, dur * .25 + .02);
    let n = o; if (cutoff) { const fl = ac.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = cutoff; o.connect(fl); n = fl; }
    n.connect(gn).connect(dest); o.start(t); o.stop(t + dur + .5);
  }
  function noise(t, dur, vol, hp, bp) { const s = ac.createBufferSource(); s.buffer = noiseBuf; const f = ac.createBiquadFilter(); f.type = bp ? 'bandpass' : 'highpass'; f.frequency.value = hp; const gn = ac.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.001, t + dur); s.connect(f).connect(gn).connect(bus); s.start(t); s.stop(t + dur + .05); }
  function kick(t) { const o = ac.createOscillator(), gn = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .12); gn.gain.setValueAtTime(.9, t); gn.gain.exponentialRampToValueAtTime(.001, t + .32); o.connect(gn).connect(bus); o.start(t); o.stop(t + .35); }
  const deg = (sc, root, d, oct = 0) => { const n = sc.length, i = ((d % n) + n) % n; return root + sc[i] + 12 * (Math.floor(d / n) + oct); };
  function play_step(t) {
    const tr = TRACKS[idx], { L, sc, mel } = song, g = GROOVE[tr.groove], csc = SC[tr.mode];
    const bar = Math.floor(step / L), s = step % L, chordDeg = tr.prog[bar % tr.prog.length] - 1, beat = L / 4;
    const chord = [0, 2, 4].map(k => deg(csc, tr.root, chordDeg + k));
    // drums
    if (g.k[s] === 'x') kick(t);
    if (g.s[s] === 'x') { noise(t, .16, .35, 1800, true); tone('triangle', 190, t, .06, .12); }
    if (g.h[s] === 'x') noise(t, .04, .12, 7500);
    if (s === L - 2 && bar % 8 === 7 && tr.groove !== 'none') noise(t, .1, .25, 2500, true);
    // pad on each bar
    if (s === 0) chord.forEach((m, i) => tone(tr.pad, mtof(m + 12), t, (60 / tr.bpm) * (L / 4) * .98, .05, bus, .25, 1800));
    // bass
    const bstep = 60 / tr.bpm / 4, broot = chord[0] - 12;
    if (tr.bass === 'root' && s % (beat * 2) === 0) tone('triangle', mtof(broot), t, bstep * beat * 1.8, .32, bus, .01, 600);
    if (tr.bass === 'walk' && s % beat === 0) tone('triangle', mtof([broot, chord[1] - 12, chord[2] - 12, broot + 10][(s / beat) % 4]), t, bstep * beat * .9, .3, bus, .01, 700);
    if (tr.bass === 'octave' && s % 2 === 0) tone('square', mtof(broot + (s % 4 ? 12 : 0)), t, bstep * 1.6, .12, bus, .005, 500);
    if (tr.bass === 'arp' && s % 2 === 0) tone('sawtooth', mtof([broot, chord[1] - 12, chord[2] - 12, broot + 12][(s / 2) % 4]), t, bstep * 1.5, .12, bus, .005, 900);
    if (tr.bass === 'drone' && s === 0 && bar % 2 === 0) tone('sine', mtof(tr.root - 12), t, bstep * L * 2, .22, bus, .6);
    // melody
    const mi = ((bar % 8) * L + s) % mel.length, note = mel[mi];
    if (note) { let m = deg(song.sc, tr.root + 12, note.p - 7); if (note.strong) { const c = chord.map(x => x + 12 * Math.round((m - x) / 12)); m = c.reduce((a, b) => Math.abs(b - m) < Math.abs(a - m) ? b : a); } const lead = ac.createGain(); lead.connect(bus); lead.connect(echo); tone(tr.lead, mtof(m), t, bstep * (note.len + .6), tr.lead === 'square' || tr.lead === 'sawtooth' ? .08 : .16, lead, .01, tr.lead === 'sawtooth' ? 2400 : 0); }
  }
  function tick() {
    const tr = TRACKS[idx], sd = 60 / tr.bpm / 4;
    while (nextT < ac.currentTime + .15) { const sw = (step % 2) ? tr.swing * sd : 0; play_step(nextT + sw); nextT += sd; step++; }
  }
  function play(i = idx) {
    init(); if (ac.state === 'suspended') ac.resume();
    idx = ((i % TRACKS.length) + TRACKS.length) % TRACKS.length; song = compose(TRACKS[idx]); step = 0; nextT = ac.currentTime + .08;
    echo.delayTime.value = (60 / TRACKS[idx].bpm) * .75;
    clearInterval(timer); timer = setInterval(tick, 25); playing = true; S.music = true; S.musicTrack = idx; save(); emit();
  }
  function stop() { clearInterval(timer); timer = null; playing = false; S.music = false; save(); if (bus) { bus.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => bus.gain.setValueAtTime(1, ac.currentTime), 300); } emit(); }
  const emit = () => listeners.forEach(f => f());
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else if (playing) ac.resume(); });
  return { TRACKS, play, stop, toggle() { playing ? stop() : play(idx); }, next() { play(idx + 1); }, prev() { play(idx - 1); }, setVol, get playing() { return playing; }, get idx() { return idx; }, on(f) { listeners.push(f); }, set idx(v) { idx = v; } };
})();
Music.idx = S.musicTrack || 0;
function paintEq() { const e = $('#hEq'); if (!e) return; e.classList.toggle('on', Music.playing); $('#hMusic').classList.toggle('on', Music.playing); $('#hMusic').title = Music.playing ? 'Now playing: ' + Music.TRACKS[Music.idx].name : 'Jukebox'; }
Music.on(paintEq);
function showJukebox() {
  const render = () => {
    const m = $('#jbBody'); if (!m) return;
    m.innerHTML = `<div class="jbnow"><div><div class="eyebrow">${Music.playing ? 'Now playing' : 'Paused'}</div><b style="font-size:1.1rem">${esc(Music.TRACKS[Music.idx].name)}</b><div class="muted">${esc(Music.TRACKS[Music.idx].mood)} · ${Music.TRACKS[Music.idx].bpm} bpm</div></div>
      <div class="row"><button class="btn" data-j="prev" aria-label="Previous">|◀</button><button class="btn primary" data-j="toggle" aria-label="${Music.playing ? 'Pause' : 'Play'}">${Music.playing ? 'II' : '▶'}</button><button class="btn" data-j="next" aria-label="Next">▶|</button></div></div>
      <div class="row" style="margin:10px 0"><label class="eyebrow" for="jbVol">Volume</label><input id="jbVol" type="range" min="0" max="1" step="0.05" value="${S.musicVol}" style="flex:1"></div>
      <div class="jblist">${Music.TRACKS.map((t, i) => `<button class="jbt ${i === Music.idx ? 'on' : ''}" data-t="${i}"><span class="num">${String(i + 1).padStart(2, '0')}</span><span class="grow"><b>${esc(t.name)}</b><br><span class="muted">${esc(t.mood)}</span></span><span>${i === Music.idx && Music.playing ? '♪' : '▶'}</span></button>`).join('')}</div>
      <p class="muted" style="margin-top:10px;font-size:.84rem">All ten tracks are original and composed live in your browser, so they work offline. Music keeps playing as you move between tables.</p>`;
  };
  modal('Jukebox', '<div id="jbBody"></div>', mb => {
    render();
    mb.addEventListener('click', e => { const j = e.target.closest('[data-j]'); if (j) { Music[j.dataset.j](); render(); } const t = e.target.closest('[data-t]'); if (t) { +t.dataset.t === Music.idx && Music.playing ? Music.stop() : Music.play(+t.dataset.t); render(); } });
    mb.addEventListener('input', e => { if (e.target.id === 'jbVol') { S.musicVol = +e.target.value; save(); Music.setVol(S.musicVol); } });
  });
}
$('#hMusic').onclick = showJukebox;
// browsers only allow sound after a tap, so resume the music on the first one
document.addEventListener('pointerdown', function first() { document.removeEventListener('pointerdown', first, true); if (S.music && !Music.playing) Music.play(S.musicTrack || 0); }, true);
</script>
<script>
/* =====================================================================
   The lesson book
   ===================================================================== */
const A = s => `<span class="alg">${s.replace(/'/g, '′')}</span>`;
const practiceCube = (stage, size) => () => { if (curId === 'cube' && GAMES.cube.practice) GAMES.cube.practice(stage, size); else openGame('cube', { practice: stage, size }); };
page('L-001', 'all', 'How the teacher works', 'teacher live ask off hint mode professor pip help', `<p>Professor Pip sits beside every table. Pick how much help you want with the switch at the top of his card (also in Settings):</p><ul><li><b>Live</b> — he watches every move, highlights the next one on the puzzle, and replans instantly if you go your own way.</li><li><b>Ask</b> — he explains the current stage but only shows a move when you tap <b>💡 Hint</b>.</li><li><b>Off</b> — you're on your own.</li></ul><p><b>▶ Show me</b> plays one move for you; <b>⏭ Do this step</b> plays the rest of the current step. Solving without hints earns bonus stars.</p>`);
page('L-002', 'all', 'Stars and the shop', 'stars shop buy earn currency felt colours scheme bonus', `<p>Every solve earns stars — harder puzzles earn more, and solving without any hints adds a 50% bonus. Spend them in the 🛍 shop on cube colour schemes, table felts and slide-puzzle tiles. Nothing costs real money.</p>`);
page('L-003', 'all', 'Touch controls', 'touch tap swipe drag pinch zoom rotate phone tablet gesture', `<p><b>Cube:</b> swipe a sticker to turn its row; drag the felt to look around; two fingers twist the view.<br><b>Slide puzzle:</b> tap a tile in line with the gap, or swipe.<br><b>Jigsaw:</b> drag pieces, tap to rotate (when on), pinch to zoom, drag the felt to pan.<br><b>Hanoi and Ball Sort:</b> tap to pick up, tap to drop.</p>`);

page('C-000', 'cube', 'Cube notation', 'notation letters R U F L D B prime clockwise counter-clockwise move names M E S slice', `<p>Each letter is a face: <b>U</b>p, <b>D</b>own, <b>F</b>ront, <b>B</b>ack, <b>R</b>ight, <b>L</b>eft. A letter alone means turn that face a quarter <b>clockwise as you look straight at it</b>. A prime (${A("R'")}) means counter-clockwise; a 2 (${A('R2')}) means a half turn.</p><p>In the Parlour the faces are named by their centre colour: yellow top, white bottom, green front, blue back, orange right, red left. Centres never move, so a face is always its centre's colour.</p><p><b>M, E, S</b> are the middle slices (M follows L, E follows D, S follows F).</p>`);
page('C-001', 'cube', 'Step 1: White cross', 'cross white edges daisy bottom plus first step stage 1', `<p>Make a white <b>plus</b> on the white face, with each edge's other colour matching the centre beside it (green next to green, and so on).</p><p>Find a white edge, turn the side it's on so it lines up over its matching centre, then turn that face twice to bring it down. If the white sticker is facing sideways, the teacher shows a short 3–4 move fix.</p><p>This step is intuitive — no algorithm. Watch how the teacher does it and you'll pick up the patterns.</p>`).practice = { label: 'Practise the cross', fn: practiceCube(0, 3) };
page('C-002', 'cube', 'Step 2: White corners', 'corners white first layer R U R prime U prime sexy move trick insert corner stage 2', `<p>Turn the top until a white corner sits right above its home (between its three colours). Hold that spot at front-right and repeat ${A("R U R' U'")} until the corner drops in with white on the bottom. It takes 1, 3 or 5 goes.</p><p>If a corner is already in the bottom layer but wrong, do ${A("R U R' U'")} once to pop it out to the top.</p>`).practice = { label: 'Practise white corners', fn: practiceCube(1, 3) };
page('C-003', 'cube', 'Step 3: Middle layer', 'middle layer second layer edges insert right left algorithm stage 3', `<p>Find a top-layer edge <b>without yellow</b>. Turn the top until its front colour matches the centre below it. If it needs to go right: ${A("U R U' R' U' F' U F")}. If left: ${A("U' L' U L U F U' F'")}.</p><p>If an edge is stuck in the middle layer the wrong way round, insert any top edge into its slot to pop it out.</p>`).practice = { label: 'Practise the middle layer', fn: practiceCube(2, 3) };
page('C-004', 'cube', 'Step 4: Yellow cross', 'yellow cross dot line L shape F R U R prime U prime F prime stage 4 top', `<p>Look at the yellow top. You'll see a dot, an L, a line, or a cross. Do ${A("F R U R' U' F'")}:</p><ul><li><b>Dot:</b> do it once to get an L.</li><li><b>L:</b> hold it in the back-left (like 9 o'clock to 12 o'clock), then do it.</li><li><b>Line:</b> hold it horizontal, then do it.</li></ul>`).practice = { label: 'Practise the yellow cross', fn: practiceCube(3, 3) };
page('C-005', 'cube', 'Step 5: Yellow face (Sune)', 'yellow face sune corners orient top R U R prime U R U2 R prime fish stage 5', `<p>Now make the whole top yellow with <b>Sune</b>: ${A("R U R' U R U2 R'")}.</p><p>If exactly one corner is yellow on top (a "fish"), hold it at front-left and do Sune. Otherwise, hold a yellow sticker facing left on the front-left corner and do Sune. Repeat until the top is all yellow.</p>`).practice = { label: 'Practise the yellow face', fn: practiceCube(4, 3) };
page('C-006', 'cube', 'Step 6: Yellow corners (A-perm)', 'corners position headlights A perm permute stage 6', `<p>Look for <b>headlights</b>: two corners on one side with the same colour. Hold them at the back and do the A-perm: ${A("R' F R' B2 R F' R' B2 R2")}. If there are no headlights anywhere, do it once from any side and they appear.</p>`).practice = { label: 'Practise yellow corners', fn: practiceCube(5, 3) };
page('C-007', 'cube', 'Step 7: Last edges (U-perm)', 'last edges U perm finish final step 7 solved bar', `<p>Find a side that's fully solved (a bar) and hold it at the back. Then do the U-perm: ${A("R U' R U R U R U' R' U' R2")}. If the edges go the wrong way, do it again. No solved side? Do it once from anywhere.</p><p>Turn the top to line everything up — solved!</p>`).practice = { label: 'Practise the last edges', fn: practiceCube(6, 3) };
page('C-008', 'cube', 'The 2×2 cube', '2x2 pocket cube corners only three steps', `<p>A 2×2 is a 3×3 with only the corners. Use the same moves: build the white corners with ${A("R U R' U'")}, make the top yellow with Sune ${A("R U R' U R U2 R'")}, then cycle the top corners home with the A-perm. Three steps and you're done.</p>`).practice = { label: 'Practise a 2×2', fn: practiceCube(0, 2) };

page('S-001', 'slide', 'The row-and-column method', 'slide method row column strategy reduce 15 puzzle how to solve', `<p>Never try to solve everything at once. Finish the <b>top row</b>, then the <b>left column</b>. You never touch those again, so what's left is a smaller puzzle. Repeat until a 3×3 is left, then solve that.</p><p>To move one tile, walk the gap around in front of it, then slide the tile into the gap. Repeat — the tile "rolls" toward its home.</p>`);
page('S-002', 'slide', 'The last tile of a row', 'last tile row corner trick tricky two tiles', `<p>The last tile of a row is the hard one: there's no room to bring it in from the side. Put it <b>directly below</b> its spot, move the tile before it down one, slide the last tile up, then bring the other back. The teacher shows the exact loop — follow it a few times and it clicks.</p>`);
page('S-003', 'slide', 'Picture mode', 'picture photo image slide upload', `<p>Switch Tiles to <b>Picture</b> and the tiles show a picture instead of numbers. Tap <b>📷 Use my photo</b> to use one of yours — it's cropped square. Small numbers stay in the corner so the teacher can still point at tiles.</p>`);

page('J-001', 'jigsaw', 'Starting a jigsaw', 'jigsaw edges corners frame start strategy border', `<p>Do what puzzlers do: find the <b>four corners</b>, then all the <b>edge pieces</b> (one flat side). Tap 🧩 <b>Edges</b> and they're sorted into the empty frame, side by side, corners first. Build the frame, then fill it in by colour.</p>`);
page('J-002', 'jigsaw', 'Using your own photo', 'photo upload picture image camera own 50 100 500 pieces count', `<p>Tap <b>📷 Use my photo</b> and pick any picture (on a phone you can take one there and then). Choose <b>50</b>, <b>100</b> or <b>500</b> pieces. The picture is cut into real interlocking pieces — every one is different. Your photo stays on your device.</p>`);
page('J-003', 'jigsaw', 'Snapping, rotating and zooming', 'snap rotate rotation zoom pinch pan ghost peek', `<p>Pieces that belong together snap when you drop them close, and move as one. A piece dropped near its spot locks into the frame. Turn on <b>Rotation</b> for a harder puzzle — then tap a piece to turn it. Pinch or scroll to zoom. <b>Ghost image</b> shows a faint guide in the frame; <b>👁 Peek</b> shows the full picture.</p>`);

page('O-001', 'lights', 'Chase the lights', 'lights out chase method rows press below', `<p>Work down the board: for every lit square in a row, press the square <b>directly below</b> it. That clears the row. When you reach the bottom, only the bottom row has lights.</p><p>Then press a few squares on the <b>top row</b> (the pattern depends on what's left) and chase down again. The teacher's dots show the exact presses. Order never matters, and pressing a square twice (in classic mode) cancels out.</p>`);
page('H-001', 'hanoi', 'Hanoi by recursion', 'hanoi recursion tower disks shortest 2 n minus 1 strategy', `<p>To move a tower of <i>n</i> disks: move the top <i>n − 1</i> to the spare peg, move the biggest disk, then move the <i>n − 1</i> back on top. Each smaller tower is the same problem again.</p><p>Shortcut for doing it by hand: the smallest disk moves every other turn, always in the same direction round the pegs (right for an odd number of disks, left for even). On the other turns there's only one legal move.</p>`);
page('F-001', 'flood', 'Flood strategy', 'flood colour strategy centre grow', `<p>Push toward the <b>centre</b> first — from there the board is closest. After that, take whichever colour grows you most. Look out for a colour you can <b>erase completely</b>: that's always a good move, because you'll never need it again.</p>`);
page('B-001', 'balls', 'Ball Sort strategy', 'ball sort tubes strategy empty spare plan', `<p>Empty tubes are your most valuable resource. Fill one only when it starts a colour you can finish. Move whole runs of the same colour together, and work on the colour that's closest to the top of the most tubes.</p>`);

page('M-001', 'maze', 'The right-hand rule', 'maze right hand rule wall follower lost strategy', `<p>Put your right hand on the wall and never let go: at every junction take the right-most opening. In a maze whose start and exit are on the outside edge, this always gets you out — it may not be the shortest way, but it never gets lost.</p><p>The teacher's gold dots show the <b>shortest</b> way, worked out by searching every corridor at once (breadth-first search).</p>`);
page('M-002', 'maze', 'Maze levels and fog', 'maze levels stroll easy medium hard expert fog dead end loops junction hexagon save spot jump back', `<p><b>Stroll</b> and <b>Easy</b> mazes have one long winding path. <b>Medium</b> and <b>Hard</b> branch much more and have a few loops, so there's more than one way through. <b>Expert</b> is big and foggy: you only see what you've been near.</p><p>Spot a <b>dead end</b> early — if a corridor only leads one way, it's not the path. Every junction is a hexagon ⬢. Once you've passed through one it fills in and becomes a <b>save spot</b>: tap it any time to zip straight back there and try another way.</p>`);
page('A-001', 'arcade', 'Specials from match shapes', 'arcade match shapes special blaster bomb prism four five L T', `<p>The shape of your match decides what you get:</p><ul><li><b>3 in a line</b> — just clears.</li><li><b>4 in a line</b> — a <b>Blaster</b> (striped gem). Clearing it wipes a full row or column.</li><li><b>L or T shape</b> (two lines crossing) — a <b>Bomb</b>. Clears the 3×3 around it.</li><li><b>5 in a line</b> — a <b>Prism</b>. Swap it with any gem to clear every gem of that colour.</li></ul>`);
page('A-002', 'arcade', 'Numbers, combos and mega swaps', 'arcade number gems multiplier combo cascade storm mega swap', `<p><b>Number gems</b> (×2, ×3, ×5) multiply the points of the match they're in. Put <b>two or more</b> numbers in one match and a <b>Number Storm</b> zaps extra gems.</p><p>When falling gems make new matches by themselves, that's a <b>combo</b> — each step scores more. Match low on the board to set them off.</p><p><b>Swap two specials together:</b> Blaster + Blaster = cross, Bomb + Bomb = mega bomb, Blaster + Bomb = giant cross, Prism + special = every gem of that colour becomes that special, Prism + Prism = the whole board.</p>`);
page('K-001', 'stack', 'Stacking basics', 'stack blocks lines clear flat holes hold tetris basics', `<p>Keep your stack <b>flat and low</b>. Avoid <b>holes</b> (gaps covered by blocks) — they stop rows from clearing. Leave one column open at the edge, and drop a long I-block in to clear <b>four lines at once</b> for big points.</p><p><b>Hold</b> saves a block for later — great for keeping an I-block ready. The faint outline shows where your block will land.</p>`);
page('K-002', 'stack', 'Beating the AI', 'stack vs ai junk garbage rows send combo battle zen solo modes', `<p>In <b>Vs AI</b>, clearing 2 lines sends 1 junk row, 3 lines sends 2, and 4 lines sends 4. Back-to-back clears (combos) and clearing the whole board send even more. Junk waiting to hit you shows as a red bar; clearing lines first cancels it out.</p><p><b>Solo</b> speeds up every 10 lines. <b>Zen</b> never ends — reach the top and the stack simply melts away.</p>`);
page('L-004', 'all', 'The shop, kits and dyes', 'shop kits dye colours felt buy reset turn off on custom', `<p>Every game has its own tab in the 🛍 shop and remembers its own look.</p><ul><li><b>Colour kits</b> are premade combos. Buy once; turn on or off whenever you like.</li><li><b>Table felts</b> are bought once and can go on any table; each table keeps its own.</li><li>A <b>dye</b> lets you pick your own colours for one game. Only the colours you change are dyed. They're remembered until you reset them, and switching them off and on is free — but changing them again takes another dye.</li></ul>`);
page('L-005', 'all', 'The jukebox', 'music jukebox tracks songs volume play pause', `<p>Tap ♪ at the top for the jukebox: ten original tracks, from the smooth <b>Neon Lounge</b> to the drum-free <b>Zen Garden</b>. Pick one, skip, or set the volume. The music is composed live in your browser, so it works offline, and it keeps playing as you move between tables.</p>`);
