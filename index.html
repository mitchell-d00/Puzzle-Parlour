<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puzzle Parlour</title>
<meta name="description" content="A puzzle lounge in a single HTML file: Rubik-style cubes, slide puzzles, jigsaws from your own photos, Lights Out, Tower of Hanoi, Flood and Ball Sort, with a live teacher that shows you how to solve each one. Works offline.">
<meta name="theme-color" content="#14111c">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: a lounge front (header with stars, then a floor of puzzle tables and a shop counter), or one puzzle: the table is the page with a teacher rail beside it (a bottom sheet on phones).
   Palette: midnight lounge ink, brass trim and a neon sign; puzzle pieces keep their own colours in both themes. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
  --bg:#f1ede6; --panel:#fffdf8; --ink:#1d1a24; --muted:#615b6a; --line:#dcd4c8; --well:#e8e2d8;
  --accent:#d1366b; --accent-ink:#fff; --brass:#9a6a12; --brass-soft:#f0d79a; --good:#1f7a45; --bad:#b4322c; --info:#2457c5;
  --neon:#d1366b; --neon2:#1b8fb0; --glow:transparent;
  --shadow:0 1px 0 rgba(30,24,34,.05),0 14px 34px -18px rgba(30,24,34,.45);
  --sign:"Bungee Shade","Bungee",Impact,sans-serif; --display:"Bungee",Impact,"Arial Black",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --felt:#0f5a4a; --felt-ink:rgba(255,255,255,.9); --rail:#3a2418;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14111c; --panel:#1d1928; --ink:#f3eff8; --muted:#a9a1b5; --line:#2f2a3d; --well:#0e0c14;
    --accent:#ff5c93; --accent-ink:#1a0a10; --brass:#f2c14e; --brass-soft:#5e4a1c; --good:#5fd08f; --bad:#ff7a6b; --info:#7aa7ff;
    --neon:#ff5c93; --neon2:#4fd6ff; --glow:rgba(255,92,147,.55);
    --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 36px -18px rgba(0,0,0,.9); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14111c; --panel:#1d1928; --ink:#f3eff8; --muted:#a9a1b5; --line:#2f2a3d; --well:#0e0c14;
  --accent:#ff5c93; --accent-ink:#1a0a10; --brass:#f2c14e; --brass-soft:#5e4a1c; --good:#5fd08f; --bad:#ff7a6b; --info:#7aa7ff;
  --neon:#ff5c93; --neon2:#4fd6ff; --glow:rgba(255,92,147,.55);
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 36px -18px rgba(0,0,0,.9); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:15.5px;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;min-height:100%;overscroll-behavior:none}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;font-weight:400;letter-spacing:.02em;text-wrap:balance}
p{margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem .8rem;font-weight:700;line-height:1.15;min-height:40px;touch-action:manipulation}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--bg)}
.btn.sm{padding:.3rem .6rem;font-size:.86rem;min-height:34px}
.btn.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn .ico{font-size:1.05em;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:.42rem .7rem;font-weight:700;min-height:36px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* header */
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:8px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand svg{width:34px;height:34px;flex:none}
.brand .bt{font-family:var(--display);font-size:1.15rem;letter-spacing:.04em;color:var(--neon);text-shadow:0 0 12px var(--glow)}
.stars{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:.25rem .7rem}
.stars b{color:var(--brass)}
.hdr-btns{display:flex;gap:6px;margin-left:auto}
@media (max-width:560px){.hdr-btns .lbl{display:none}.brand .bt{font-size:1rem}}
@media (max-width:430px){.brand .bt{display:none}.hdr-btns{gap:4px}}

main{max-width:1240px;margin:0 auto;padding:14px 16px 40px}

/* lounge */
.marquee{position:relative;border-radius:18px;padding:26px 22px 22px;background:radial-gradient(120% 140% at 50% 0%,#2b2140 0%,#14111c 70%);color:#fff;overflow:hidden;box-shadow:var(--shadow)}
.marquee::before{content:"";position:absolute;inset:8px;border-radius:12px;border:2px dotted rgba(242,193,78,.65);pointer-events:none;animation:bulbs 1.6s steps(2) infinite}
@keyframes bulbs{50%{border-color:rgba(242,193,78,.25)}}
.marquee h1{font-family:var(--sign);font-size:clamp(2rem,7vw,3.6rem);color:#ff7aa8;text-shadow:0 0 6px #ff5c93,0 0 22px rgba(255,92,147,.7);line-height:1}
.marquee .sub{font-family:var(--display);color:#7fe3ff;text-shadow:0 0 10px rgba(79,214,255,.7);letter-spacing:.08em;margin-top:6px;font-size:clamp(.8rem,2.6vw,1rem)}
.marquee p{max-width:60ch;margin-top:12px;color:#ddd5ea}
.marquee .row{margin-top:14px}
.marquee .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff}
.marquee .btn.primary{background:#ff5c93;border-color:#ff5c93;color:#1a0a10}
.floor-h{display:flex;align-items:baseline;gap:10px;margin:22px 2px 10px}
.floor-h h2{font-size:1.05rem}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.ptable{position:relative;text-align:left;border:0;padding:0;border-radius:16px;background:var(--rail);box-shadow:var(--shadow);overflow:hidden;color:#fff;transition:transform .15s}
.ptable:hover{transform:translateY(-2px)}
.ptable .felt{margin:7px;border-radius:11px;background:radial-gradient(130% 120% at 50% 0%,color-mix(in srgb,var(--felt) 80%,#fff 8%) 0%,var(--felt) 55%,color-mix(in srgb,var(--felt) 70%,#000) 100%);padding:12px 12px 14px;min-height:190px;display:flex;flex-direction:column}
.ptable .art{height:96px;display:grid;place-items:center}
.ptable .art svg{height:92px;width:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.ptable h3{font-size:1rem;margin-top:6px}
.ptable .d{font-size:.86rem;color:rgba(255,255,255,.82);margin-top:3px}
.ptable .tag{position:absolute;top:12px;right:12px;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);border-radius:99px;padding:.15rem .5rem}
.ptable .best{margin-top:auto;padding-top:8px;font-size:.78rem;color:rgba(255,255,255,.75);font-family:var(--mono)}
.counter{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px}
@media (max-width:760px){.counter{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.card h3{font-size:.95rem;margin-bottom:6px}

/* game screen */
.game{display:grid;grid-template-columns:1fr 330px;gap:14px;align-items:start}
.game.noteacher{grid-template-columns:1fr}
.game.noteacher .teacher{display:none}
.gbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.gbar h2{font-size:1.1rem;margin-right:6px}
.gstats{display:flex;gap:12px;font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.gstats b{color:var(--ink)}
.stage{position:relative;border-radius:16px;background:var(--rail);padding:7px;box-shadow:var(--shadow)}
.stage .felt{position:relative;border-radius:11px;background:radial-gradient(130% 120% at 50% 0%,color-mix(in srgb,var(--felt) 82%,#fff 8%) 0%,var(--felt) 55%,color-mix(in srgb,var(--felt) 68%,#000) 100%);min-height:min(68vh,640px);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.opts label{font-size:.85rem;color:var(--muted);font-weight:700}
select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.35rem .5rem;min-height:36px}

/* teacher rail */
.teacher{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 80px)}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px}
.thead{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;flex:none}
.thead .nm{font-family:var(--display);font-size:.95rem}
.thead .st{font-size:.78rem;color:var(--muted)}
.tstage{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brass)}
.tmsg{font-size:.95rem}
.tmsg .alg{font-family:var(--mono);background:var(--well);border-radius:6px;padding:.05rem .35rem;white-space:nowrap}
.tnext{display:flex;align-items:center;gap:10px;background:var(--well);border-radius:10px;padding:8px 10px}
.tnext .mv{font-family:var(--mono);font-weight:600;font-size:1.25rem;min-width:2.4em;text-align:center;color:var(--accent)}
.tnext .how{font-size:.85rem}
.tlog{overflow:auto;max-height:220px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.tlog div{padding:6px 8px;border-radius:8px;background:var(--well)}
.tlog div.you{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.prog{height:6px;border-radius:99px;background:var(--well);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--brass));width:0;transition:width .3s}
.tsteps{display:flex;gap:4px;flex-wrap:wrap}
.tsteps span{font-size:.7rem;padding:.12rem .45rem;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tsteps span.done{background:var(--good);border-color:var(--good);color:#fff}
.tsteps span.cur{border-color:var(--accent);color:var(--accent);font-weight:700}
@media (max-width:900px){
  .game{grid-template-columns:1fr}
  .teacher{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:25;max-height:62vh;overflow:auto;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px));gap:0}
  .teacher .tcard{border-radius:16px 16px 0 0;box-shadow:0 -10px 30px -12px rgba(0,0,0,.5);padding:10px 12px;gap:6px}
  .teacher:not(.open) .tmsg,.teacher:not(.open) .tsteps,.teacher:not(.open) .prog{display:none}
  .teacher .tlogcard{display:none}
  .thead .st{display:none}
  .avatar{width:32px;height:32px}
  .thead .seg button{padding:.3rem .55rem;min-height:30px;font-size:.85rem}
  .tnext{padding:6px 8px}
  #tActs .btn{min-height:34px}
  main.ingame{padding-bottom:250px}
  .stage .felt{height:max(320px,calc(100dvh - 340px));min-height:0}
}
@media (max-width:560px){.gbar .lbl{display:none}.gbar h2{font-size:.95rem}.gbar{gap:6px}.gstats{font-size:.8rem;gap:8px}}
.tgrab{display:none}
@media (max-width:900px){.tgrab{display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:-4px auto 2px;border:0;padding:0}}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,8,14,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(640px,100%);max-height:88vh;overflow:auto;padding:18px}
.modal .box h2{font-size:1.15rem;margin-bottom:10px}
.modal .x{float:right}
.set{display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;margin:12px 0}
.set .l b{display:block}
.set .l span{font-size:.84rem;color:var(--muted)}
.sw{position:relative;width:52px;height:30px;border-radius:99px;background:var(--well);border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw.on::after{left:25px;background:#fff}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.item .sw8{height:46px;border-radius:8px;display:flex;overflow:hidden}
.item .sw8 i{flex:1}
.item .p{font-family:var(--mono);font-size:.85rem;color:var(--brass);font-weight:600}
.dslot{width:64px;height:64px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:flex-end;justify-content:center;padding:4px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}.dslot span{font-size:.7rem;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:0 4px}.dslot.on{outline:3px solid var(--accent);outline-offset:2px}.dpre{width:28px;height:28px;border-radius:8px;border:2px solid var(--line)}input[type=color]{width:52px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:2px}.shoptabs .btn{min-height:34px}
.jbnow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px;border-radius:12px;background:radial-gradient(120% 140% at 0 0,#2b2140,#14111c);color:#fff}.jbnow .muted{color:#cfc6dd}.jbnow .eyebrow{color:#7fe3ff}
.jblist{display:grid;gap:6px}.jbt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px}.jbt.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.jbt .num{color:var(--muted)}
#hEq.on{display:inline-block;animation:eqb .5s ease-in-out infinite alternate;color:var(--accent)}@keyframes eqb{to{transform:translateY(-2px) scale(1.15)}}
.lesson h3{font-size:1rem;margin:12px 0 4px}
.lesson p,.lesson li{margin:4px 0}
.lesson .alg{font-family:var(--mono);background:var(--well);border-radius:6px;padding:.05rem .35rem}
.askrow{display:flex;gap:8px;margin-top:8px}
.askrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem}
.pin{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.ans{margin-top:10px;padding:10px;border-radius:10px;background:var(--well)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-weight:700;box-shadow:var(--shadow);pointer-events:none;max-width:90vw;text-align:center}
.win{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);z-index:15;color:#fff;text-align:center;padding:18px}
.win .btn:not(.primary){color:var(--ink)}
.win .wb{background:rgba(20,17,28,.92);border:1px solid rgba(242,193,78,.6);border-radius:16px;padding:18px 22px;max-width:360px}
.win h3{font-family:var(--sign);font-size:2rem;color:#ff7aa8;text-shadow:0 0 14px rgba(255,92,147,.8)}
.tour{position:fixed;z-index:70;inset:0;pointer-events:none}
.tour .tb{position:absolute;pointer-events:auto;left:50%;bottom:24px;transform:translateX(-50%);width:min(420px,calc(100% - 32px));background:var(--panel);border:2px solid var(--accent);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.tour .ring{position:absolute;border:3px solid var(--accent);border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.45);transition:all .25s}

/* ---- cube ---- */
.cubewrap{position:absolute;inset:0;perspective:1400px;display:grid;place-items:center}
.cube3d{position:relative;width:0;height:0;transform-style:preserve-3d}
.cf{position:absolute;background:#111;border-radius:6%;transform-style:preserve-3d;backface-visibility:visible}
.cf .stk{position:absolute;inset:6%;border-radius:14%;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.25)}
.cf.hl .stk{outline:3px solid #fff;outline-offset:-3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.25)}}
.cf .ar{font-size:calc(var(--s) * .42);color:#fff;text-shadow:0 0 3px #000,0 0 8px #000;line-height:1;font-weight:700;pointer-events:none}
.cf .tg{position:absolute;inset:-6%;border:3px solid #fff;border-radius:10%;box-shadow:0 0 12px #fff;pointer-events:none}
.cubehud{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;z-index:5}
.cubehud .btn{background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.25);min-height:36px;padding:.3rem .55rem}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.pad button{font-family:var(--mono);font-weight:600;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel)}
.hint-banner{position:absolute;top:10px;left:10px;right:10px;z-index:5;display:flex;justify-content:center;pointer-events:none}
.hint-banner span{background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:.3rem .8rem;font-size:.86rem}

/* ---- slider ---- */
.sboard{position:absolute;touch-action:none}
.tile{position:absolute;border-radius:10%;display:grid;place-items:center;font-family:var(--display);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.25),0 4px 8px rgba(0,0,0,.3);transition:transform .12s ease-out;background-size:cover}
.tile .n{text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tile.ok{outline:2px solid rgba(255,255,255,.55);outline-offset:-4px}
.tile.hint{animation:pulse .8s infinite;outline:4px solid #fff;outline-offset:-4px;z-index:2}
.tile .ha{position:absolute;right:7%;top:3%;font-size:.6em;color:#fff;text-shadow:0 0 6px #000}
.lockcell{position:absolute;border-radius:10%;background:rgba(255,255,255,.06)}

/* generic board games */
.gcanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.colorbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.colorbar button{width:46px;height:46px;border-radius:12px;border:3px solid rgba(255,255,255,.75);box-shadow:0 3px 8px rgba(0,0,0,.35)}
.colorbar button.hint{animation:pulse .8s infinite;outline:4px solid #fff;outline-offset:2px}
.underbar{position:absolute;left:0;right:0;bottom:10px;z-index:5;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 8px}
.underbar .btn{background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.25)}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:12px;text-align:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs button{width:72px;height:54px;border-radius:8px;border:2px solid var(--line);background-size:cover;background-position:center;padding:0}
.thumbs button.on{border-color:var(--accent)}
/* ---- the show ---- */
.show{position:absolute;inset:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;color:#fff;--cw:64px;--back:#b3202a;--trim:#fff}
.show .ssteps{display:flex;flex-wrap:wrap;gap:6px}.show .ssteps:empty{display:none}.show .ssteps span{font-size:.75rem;padding:.2rem .55rem;border-radius:99px;background:rgba(0,0,0,.3);color:rgba(255,255,255,.65)}.show .ssteps span b{color:#f2c14e;margin-right:3px}.show .ssteps span.cur{background:#f2c14e;color:#14111c;font-weight:700}.show .ssteps span.cur b{color:#14111c}.show .ssteps span.done{color:#fff}
.show .gone{opacity:.12;transform:scale(.92)}
.show .patter{background:rgba(0,0,0,.35);border:1px solid rgba(242,193,78,.45);border-radius:12px;padding:10px 12px;font-size:1.08rem;line-height:1.45}
.show .ctable{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:180px}
.show .ctrl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding-bottom:4px}
.show .ctrl .btn:not(.primary){background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.3)}
.crow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pc{width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.1);position:relative;flex:none;box-shadow:0 2px 5px rgba(0,0,0,.35);user-select:none}
.pc.face{background:#fffdf8;color:#1d1a24;border:1px solid #d8d2c4}
.pc.face.red{color:#c41e3a}
.pc .cr{position:absolute;left:7%;top:4%;font:700 calc(var(--cw)*.24)/1 Georgia,serif;text-align:center}
.pc .cbig{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.5);padding-top:12%}
.pc.num-only{background:#f1ede6;color:#1d1a24}.pc.num-only .cbig{font:700 calc(var(--cw)*.5) Georgia,serif;padding:0}
.pc.down{background:repeating-linear-gradient(45deg,var(--back) 0 6px,color-mix(in srgb,var(--back) 75%,#000) 6px 12px);border:3px solid var(--trim)}
.pc.blank{background:transparent;box-shadow:none}
.pc.hl{outline:4px solid #f2c14e;outline-offset:2px;animation:pulse .9s infinite}
.pc.pickable{cursor:pointer}.pc.pickable:hover{transform:translateY(-4px)}
.pc.pairA{box-shadow:0 0 0 3px #4fd6ff}.pc.pairB{box-shadow:0 0 0 3px #f2c14e}
.cpiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.cpile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;border-radius:12px;border:2px dashed transparent}
.cpile.pickable{cursor:pointer;border-color:rgba(255,255,255,.35)}.cpile.pickable:hover,.cpile.hl{border-color:#f2c14e;background:rgba(242,193,78,.12)}
.cpile .plabel{font-size:.8rem;font-weight:700;opacity:.85}.cpile .pcount{font-size:.75rem;opacity:.75}
.pstack{display:flex;flex-direction:column}.pstack .pc+.pc{margin-top:calc(var(--cw)*-1.05)}
.pstack.squared .pc+.pc{margin-top:calc(var(--cw)*-1.36)}
.cnote{margin-top:8px;opacity:.85;text-align:center}
.creveal{display:flex;flex-direction:column;align-items:center;gap:10px;--cw:110px}.creveal .pc{--cw:110px;width:110px;animation:flipin .5s ease-out}
@keyframes flipin{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
.sealed{font:400 3rem var(--sign);color:#ff7aa8;text-shadow:0 0 14px rgba(255,92,147,.8);background:rgba(0,0,0,.35);border:2px solid #f2c14e;border-radius:14px;padding:10px 26px}
.sum{font:600 2rem var(--mono);text-align:right;background:rgba(0,0,0,.3);border-radius:12px;padding:10px 20px}.sum .eq{border-top:3px solid #fff;margin-top:4px;color:#f2c14e}
.numpick{display:flex;align-items:center;gap:8px}.numpick b{font-size:1.6rem;min-width:2ch;text-align:center}
.clock{position:relative;width:min(92vw,420px);aspect-ratio:1;--cw:44px}.clock .ch{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.8rem}.clock .ch .pc{width:44px}
.clock .cmid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:rgba(0,0,0,.35);border-radius:10px;padding:8px}
.mgrid{display:flex;flex-direction:column;gap:6px}.mrow{display:flex;gap:6px;align-items:center}.mrow .eyebrow{color:#fff;width:46px}
.show.programme .acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.act{display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px}
.act.done{border-color:rgba(242,193,78,.6)}.act .anum{font:400 1.4rem var(--sign);color:#f2c14e;min-width:2ch}.act .muted{color:rgba(255,255,255,.75);font-size:.85rem}.act .aprin{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#7fe3ff;margin-top:2px}
.act .abtn{display:flex;flex-direction:column;gap:4px}.act .abtn .btn:not(.primary){background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.3)}
.show.explain .estep{flex:1;background:rgba(0,0,0,.3);border-radius:14px;padding:18px;font-size:1.15rem;line-height:1.55;display:flex;flex-direction:column;gap:12px;justify-content:center}
.estep .enum{font:400 .9rem var(--display);color:#f2c14e}.edots{display:flex;gap:6px}.edots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.25)}.edots i.on{background:#f2c14e}
/* ---- 20 questions ---- */
.tq{position:absolute;inset:0;overflow:auto;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff;--bub:#fffdf8;--bubink:#1d1a24}
.tqbub{background:var(--bub);color:var(--bubink);border-radius:20px;padding:16px 20px;max-width:640px;width:100%;font-size:1.1rem;line-height:1.45;box-shadow:0 8px 20px rgba(0,0,0,.3);position:relative}
.tqbub.big{font-size:1.45rem;text-align:center;padding:22px}
.tqbub::after{content:"";position:absolute;left:40px;bottom:-12px;border:12px solid transparent;border-top-color:var(--bub);border-bottom:0}
.tqbig{font-size:2.4rem;vertical-align:middle}
.tqsmall{display:block;font-size:.85rem;opacity:.75;margin-top:6px}
.tqcount{font:400 .95rem var(--display);color:#f2c14e;letter-spacing:.05em}
.tqbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.tqbtns .btn{min-width:110px;min-height:48px;font-size:1.05rem}
.tqbtns .btn:not(.primary){background:rgba(0,0,0,.35);color:#fff;border-color:rgba(255,255,255,.3)}
.tqemo{font-size:1.5rem;text-align:center;max-width:640px;line-height:1.5;letter-spacing:.1em}
.tqthink{text-align:center;opacity:.9}.tqthink .tqsmall{color:#fff}
.tqform{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px}.tqform input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;font-size:1rem}
.tqasked{display:flex;flex-wrap:wrap;gap:6px;max-width:760px;justify-content:center}.tqa{font-size:.82rem;padding:.25rem .6rem;border-radius:99px;background:rgba(0,0,0,.35)}.tqa.y b{color:#5fd08f}.tqa.n b{color:#ff7a6b}.tqa.d b{color:#f2c14e}
.tqqs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:860px}
.tqq{background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:.45rem .7rem;font-size:.88rem;text-align:left}
.tqq:hover{border-color:#f2c14e}.tqq.hint{border-color:#f2c14e;background:rgba(242,193,78,.25);animation:pulse .9s infinite}
.tqbtns.five .btn{min-width:0;flex:1 1 30%;max-width:170px}
.tqtop{display:flex;flex-direction:column;gap:4px;width:min(520px,100%);margin-top:6px}.tqtop div{display:grid;grid-template-columns:1fr 2fr 3ch;gap:8px;align-items:center;font-size:.85rem;text-align:left}.tqtop i{height:8px;border-radius:9px;background:linear-gradient(90deg,#f2c14e,#ff5c93);display:block}.tqtop b{font-family:var(--mono);font-size:.8rem}
.tqsearch{width:min(560px,100%);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:.55rem .8rem;font-size:1rem}
.tqpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;width:100%;max-width:900px}
.tqpick button{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:6px;font-size:.78rem}
.tqpick button span{font-size:1.6rem}.tqpick button.dim{opacity:.35}.tqpick button.gone{opacity:.12;text-decoration:line-through}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

const $ = (s, r = document) => r.querySelector(s);

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let AC = null;
function beep(type = 'tick') {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    const spec = { tick: [520, .04, 'triangle', .05], turn: [300, .07, 'square', .025], snap: [880, .06, 'sine', .07], bad: [160, .12, 'sawtooth', .04], win: [660, .5, 'triangle', .08], pick: [740, .05, 'sine', .05] }[type] || [440, .05, 'sine', .05];
    o.type = spec[2]; o.frequency.setValueAtTime(spec[0], t);
    if (type === 'win') { o.frequency.setValueAtTime(523, t); o.frequency.setValueAtTime(659, t + .12); o.frequency.setValueAtTime(784, t + .24); o.frequency.setValueAtTime(1046, t + .36); }
    g.gain.setValueAtTime(spec[3], t); g.gain.exponentialRampToValueAtTime(.0001, t + spec[1]);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + spec[1] + .02);
  } catch (e) { }
}
const buzz = ms => { if (S.haptics && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) { } };
function toast(msg, ms = 1800) { const t = el('div', { class: 'toast', role: 'status' }, esc(msg)); document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function speak(text) {
  if (!S.speak || !('speechSynthesis' in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g, '').replace(/'/g, ' prime ')); u.rate = 1.02; speechSynthesis.speak(u); } catch (e) { }
}

/* =====================================================================
   The lesson book — a closed ledger of pages that answers only from them
   (the same rule as MPLPB: one page owns the question → that page;
   two pages tie → ask which; none → "not in the book").
   ===================================================================== */
const PAGES = [];
function page(id, game, title, kw, body) { const p = { id, game, title, kw, body }; PAGES.push(p); return p; }
const STOP = new Set('a an the is are do does i you to of in on for and or how what why when which can my me it this that with be at by as get make your from will should would'.split(' '));
const toks = s => (s.toLowerCase().match(/[a-z0-9']+/g) || []).map(w => w.replace(/'s$/, '').replace(/(ing|es|s)$/, '')).filter(w => w.length > 1 && !STOP.has(w));
function askBook(q, scope) {
  const qt = toks(q); if (!qt.length) return { kind: 'none' };
  const scored = PAGES.map(p => {
    const T = toks(p.title), K = toks(p.kw), B = toks(p.body.replace(/<[^>]+>/g, ' '));
    let s = 0; for (const w of new Set(qt)) { if (K.includes(w)) s += 3; if (T.includes(w)) s += 3; if (B.includes(w)) s += 1; }
    if (scope && p.game === scope) s *= 1.15;
    return { p, s };
  }).filter(x => x.s >= 3).sort((a, b) => b.s - a.s);
  if (!scored.length) return { kind: 'none' };
  if (scored[1] && scored[1].s >= scored[0].s * 0.92) return { kind: 'tie', pages: scored.slice(0, 3).filter(x => x.s >= scored[0].s * 0.92).map(x => x.p) };
  return { kind: 'one', page: scored[0].p };
}
function showAsk(scope, preset) {
  modal('Ask the lesson book', `<p class="muted">Professor Pip answers only from the pages in the lesson book, and tells you which page the answer came from. If no page covers it, he says so.</p>
   <div class="askrow"><input id="askQ" placeholder="e.g. how do I make the yellow cross?" autocomplete="off"><button class="btn primary" id="askGo">Ask</button></div><div id="askA"></div>
   <div class="eyebrow" style="margin-top:14px">Browse pages</div><div class="row" id="askList" style="margin-top:6px"></div>`, mb => {
    const go = () => {
      const q = $('#askQ', mb).value.trim(); if (!q) return; const r = askBook(q, scope); const a = $('#askA', mb);
      if (r.kind === 'one') a.innerHTML = renderPage(r.page);
      else if (r.kind === 'tie') { a.innerHTML = `<div class="ans">Two pages both cover that, so I won't guess. Which one did you mean?<div class="row" style="margin-top:8px">${r.pages.map(p => `<button class="btn sm" data-p="${p.id}">${esc(p.title)}</button>`).join('')}</div></div>`; }
      else a.innerHTML = `<div class="ans">That isn't in the lesson book, so I can't answer it. Try different words, or browse the pages below.</div>`;
      if (r.kind === 'one') speak(r.page.title);
    };
    $('#askGo', mb).onclick = go; $('#askQ', mb).onkeydown = e => { if (e.key === 'Enter') go(); };
    mb.addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) $('#askA', mb).innerHTML = renderPage(PAGES.find(p => p.id === b.dataset.p)); });
    $('#askList', mb).innerHTML = PAGES.filter(p => !scope || p.game === scope || p.game === 'all').map(p => `<button class="btn sm" data-p="${p.id}">${esc(p.title)}</button>`).join('');
    if (preset) { $('#askQ', mb).value = preset; go(); } else setTimeout(() => $('#askQ', mb).focus(), 50);
  });
}
const renderPage = p => `<div class="ans lesson"><div class="pin">page ${p.id} · ${esc(GAMES[p.game]?.name || 'Lounge')}</div><h3>${esc(p.title)}</h3>${p.body}</div>`;
function showLessons(game) {
  const pages = PAGES.filter(p => p.game === game);
  modal((GAMES[game]?.name || '') + ' lessons', `<div class="row" id="lsTabs"></div><div id="lsBody"></div>`, mb => {
    const tabs = $('#lsTabs', mb), body = $('#lsBody', mb);
    const show = i => { $$('button', tabs).forEach((b, j) => b.classList.toggle('on', i === j)); body.innerHTML = renderPage(pages[i]); const act = pages[i].practice; if (act) { const b = el('button', { class: 'btn primary', style: 'margin-top:10px' }, act.label); b.onclick = () => { closeModal(); act.fn(); }; body.appendChild(b); } };

/* shared helper: pointer tap/drag recogniser */
function ptr(target, { down, move, up, tap, multi } = {}) {
  const pts = new Map(); let start = null, moved = false;
  target.addEventListener('pointerdown', e => {
    if (e.target.closest('button,input,select,a,.win,.noptr')) return;
    target.setPointerCapture?.(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { start = { x: e.clientX, y: e.clientY, t: performance.now(), target: e.target }; moved = false; down && down(e, start); }
    else multi && multi('start', pts, e);
  });
  target.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return; const prev = pts.get(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size > 1) { multi && multi('move', pts, e, prev); moved = true; return; }
    const dx = e.clientX - start.x, dy = e.clientY - start.y; if (Math.hypot(dx, dy) > 8) moved = true;
    move && move(e, { dx, dy, start, prev, moved });
  });
  const end = e => {
    if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
    if (pts.size >= 1) { multi && multi('end', pts, e); moved = true; return; }
    if (!moved && tap) tap({ clientX: e.clientX, clientY: e.clientY, target: start.target }, start); else up && up(e, { start, moved });
  };
  target.addEventListener('pointerup', end); target.addEventListener('pointercancel', end);
}

<script>
/* =====================================================================
   Cube model + teaching solver (pure JS, no DOM)
   A 3×3 sticker model: 54 slots, each a (cubie position p, normal n).
   The 2×2 is the same model with only corners shown, so the same solver
   teaches both. Centres never move: slice turns are stored as the two
   outer layers plus a turn of the camera.
   ===================================================================== */
const CubeModel = (() => {
  const SL = [], IDX = new Map(), key = (p, n) => p.join() + '|' + n.join();
  for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
    const p = [x, y, z];
    for (let k = 0; k < 3; k++) if (p[k] !== 0) { const n = [0, 0, 0]; n[k] = p[k]; IDX.set(key(p, n), SL.length); SL.push({ p, n }); }
  }
  const FV = { U: [0, 1, 0], D: [0, -1, 0], F: [0, 0, 1], B: [0, 0, -1], R: [1, 0, 0], L: [-1, 0, 0] };
  const faceOf = n => n[1] === 1 ? 'U' : n[1] === -1 ? 'D' : n[2] === 1 ? 'F' : n[2] === -1 ? 'B' : n[0] === 1 ? 'R' : 'L';
  const HOME = SL.map(s => faceOf(s.n));
  const rotV = (v, k, q) => { q = ((q % 4) + 4) % 4; let [x, y, z] = v; for (let i = 0; i < q; i++) { if (k === 0) [y, z] = [-z, y]; else if (k === 1) [x, z] = [z, -x]; else [x, y] = [-y, x]; } return [x, y, z]; };
  const PC = new Map();
  function perm(k, L, q) {

      tap() { drag = null; },
      up() { drag = null; },
      multi(phase, pts, e, prev) {
        if (phase !== 'move' || pts.size < 2) return; const [a, b] = [...pts.values()];
        const ang = Math.atan2(b.y - a.y, b.x - a.x);

    const keyH = e => { if (e.target.closest?.('input')) return; const k = e.key.toUpperCase(); if ('UDFBRLMES'.includes(k) && k.length === 1) { if (size === 2 && 'MES'.includes(k)) return; const m = CubeModel.parse(k + (e.shiftKey ? "'" : ''))[0]; doMove({ k: m.k, L: m.L, q: m.q }, true); } if (e.key === ' ') { e.preventDefault(); showMe(); } };

    // ----- game flow -----

      state = CubeModel.applyAlg(CubeModel.HOME.slice(), CubeModel.scramble(size));
      scrambled = true; recolor(); render(); stats(); replan();
      // a little spin to show it's scrambled
      const v0 = V.slice(), tt = performance.now(); const sp = n => { const u = Math.min(1, (n - tt) / 500); V = M3.mul(M3.rot(1, (1 - u) * 1.2), V0); render(); if (u < 1) requestAnimationFrame(sp); }; requestAnimationFrame(sp);

    }

    function stopTimer() { clearInterval(timerI); t0 = null; }
    function stats() { $('#gStats').innerHTML = `<span>Moves <b>${moves}</b></span><span>Time <b>${t0 ? fmtTime(performance.now() - t0) : '0:00'}</b></span>`; }
    function win() {
      const time = t0 ? performance.now() - t0 : null; stopTimer(); scrambled = false; autoplay = false; queue = [];
      const r = award('cube', size + 'x' + size, { time, moves, stars: size === 3 ? 8 : 4, hints: hintsUsed });
      T.set({ stage: 'Solved', steps: size === 3 ? CubeModel.STAGES3 : CubeModel.STAGES2, cur: 99, prog: 1, msg: 'Solved! ' + (hintsUsed ? 'Next time try it with the teacher on Ask, and only peek when stuck.' : 'And without hints. You know the method now.'), next: null });
      winOverlay(host, { lines: [`${size}×${size} in ${moves} moves${time ? ', ' + fmtTime(time) : ''}`, r.newBest && time ? 'New best time!' : ''], earned: r.earned, again: newGame });
    }

    // ----- teacher -----
    function replan() { plan = []; planStage = -1; if (S.teacher !== 'off' || autoplay) ensurePlan(coach); else coach(); }
    let waiters = [];
    function ensurePlan(cb) {
      if (plan.length || CubeModel.solved(state, size)) { cb && cb(); return; }
      if (cb) waiters.push(cb); if (planning) return;
      planning = true; T.set({ msg: 'Let me look at your cube…' });
      setTimeout(() => {
        try { const p = CubeModel.plan(state, size); plan = p.flatMap(it => it.moves.map((m, i) => ({ m, it, first: i === 0 }))); } catch (e) { plan = []; }

      if (e.k === m.k && e.L === m.L && e.q === m.q) {
        const it = plan.shift().it;
        if (user === true && S.teacher === 'live' && (!plan.length || plan[0].it !== it)) T.note('✔ ' + it.label + ' done.', '');
        if (plan.length && plan[0].it.stage !== it.stage) { T.note('🎉 Stage complete: ' + (size === 3 ? CubeModel.STAGES3 : CubeModel.STAGES2)[it.stage] + '.'); beep('snap'); }
      } else {
        plan = []; if (user === true && S.teacher === 'live') T.note('You went a different way. No problem — I’ve worked out a new plan from here.', 'you');
      }

    }
    function moveHow(m) {
      if (m.L === 0) return 'Turn the middle slice.';
      const f = CubeModel.faceOf(m.k === 0 ? [m.L, 0, 0] : m.k === 1 ? [0, m.L, 0] : [0, 0, m.L]);
      const cw = CubeModel.name(m).indexOf("'") < 0;
      return `Turn the <b>${CubeModel.CN[f]}</b>-centre face (${FACE_WORD[f]}) ${cw ? 'clockwise ↻' : 'counter-clockwise ↺'} as you look straight at it. The glowing stickers show which layer.`;
    }
    function clearArrows() { for (const f of faces) { f.el.classList.remove('hl'); if (f.stk) f.stk.innerHTML = ''; } banner.innerHTML = ''; }
    function arrows(m) {
      clearArrows(); const sgn = m.q > 0 ? 1 : -1;

        if (!f.ext || f.p[m.k] !== m.L) continue; f.el.classList.add('hl');
        const pos = f.p.map((v, i) => v * f.ds + f.n[i] * 0.5 * (size === 2 ? 1 : 1)); const ax = [0, 0, 0]; ax[m.k] = 1;

        else f.stk.innerHTML = `<span class="ar" style="transform:rotate(${Math.atan2(b, a)}rad)">➜</span>`;
      }
    }
    function coach(why) {
      if (why === 'mode') { $('#gameGrid').classList.toggle('noteacher', S.teacher === 'off' && S.autoHide); if (S.teacher !== 'off' && !plan.length) return ensurePlan(coach); }
      clearArrows();
      const stages = size === 3 ? CubeModel.STAGES3 : CubeModel.STAGES2;
      const acts = [{ label: '▶ Show me', fn: showMe, primary: true }, { label: '⏭ Do this step', fn: doStep }, { label: '📖 Lessons', fn: () => showLessons('cube') }];
      if (CubeModel.solved(state, size)) { T.set({ stage: scrambled ? '' : 'Solved cube', steps: stages, cur: scrambled ? 0 : 99, prog: scrambled ? 0 : 1, msg: 'The cube is solved. Tap <b>Scramble</b> to mix it up, then I’ll teach you how to bring it back.', next: null, acts: [{ label: '🎲 Scramble', fn: newGame, primary: true }, { label: '📖 Lessons', fn: () => showLessons('cube') }] }); return; }
      if (S.teacher === 'off') { T.set({ stage: '', msg: 'The teacher is resting. Switch to Ask or Live any time.', next: null, acts: [] }); return; }
      if (planning) return;
      if (!plan.length) return ensurePlan(coach);
      const { m, it } = plan[0];
      const stageItems = plan.filter(x => x.it.stage === it.stage).length;
      const total = plan.length;
      const reveal = S.teacher === 'live' || showHint;
      const restOfItem = plan.filter(x => x.it === it).map(x => x.m);
      T.set({
        stage: 'Stage ' + (it.stage + 1) + ' of ' + stages.length + ' · ' + stages[it.stage], steps: stages, cur: it.stage,
        prog: it.stage / stages.length + (1 / stages.length) * (1 - Math.min(1, stageItems / 30)),
        msg: `<b>${esc(it.label)}.</b> ${it.why}${/ /.test(it.alg) ? ` Using the <b>${esc(it.mlabel)}</b>: <span class="alg">${it.alg.replace(/'/g, '′')}</span>` : ''}` + (reveal ? '' : '<br><span class="muted">Tap 💡 Hint to see the next turn.</span>'),
        next: reveal ? { mv: CubeModel.name(m).replace("'", '′'), how: moveHow(m) + (restOfItem.length > 1 ? `<br><span class="muted">${restOfItem.length} turns left in this step · ${total} to solve</span>` : `<br><span class="muted">${total} turns to solve</span>`) } : null,
        acts
      });
      if (reveal) { arrows(m); banner.innerHTML = `<span>${esc(stages[it.stage])}: ${CubeModel.name(m).replace("'", '′')}</span>`; }
    }
    function hint() { hintsUsed++; if (S.teacher === 'off') { S.teacher = 'hints'; save(); T.paintMode(); $('#gameGrid').classList.remove('noteacher'); } showHint = true; ensurePlan(coach); }
    function showMe() { if (anim || queue.length) return; hintsUsed++; ensurePlan(() => { if (plan.length) { showHint = false; doMove(plan[0].m, 'auto'); } }); }
    function doStep() { if (anim || queue.length) return; hintsUsed++; ensurePlan(() => { if (!plan.length) return; const it = plan[0].it; plan.filter(x => x.it === it).forEach(x => queue.push({ m: x.m, user: 'auto' })); if (!anim) next(); }); }

    GAMES.cube.practice = (stage, sz) => {
      if (sz && sz !== size) { size = sz; store.set('cube.size', size); build(); }
      newGame(); const p = CubeModel.plan(state, size); for (const it of p) { if (it.stage >= stage) break; for (const m of it.moves) state = CubeModel.apply(state, m); }
      recolor(); render(); plan = []; replan(); T.note('Practice: everything before “' + (size === 3 ? CubeModel.STAGES3 : CubeModel.STAGES2)[stage] + '” is done for you.');
    };

    build(); setTimeout(() => { build(); if (o.practice != null) GAMES.cube.practice(o.practice, o.size); else newGame(); }, 30);
    return {
      undo, hint, newGame, coach,
      restyle() { recolor(); },
      resize() { const sv = state; build(); state = sv; recolor(); render(); },
      destroy() { document.removeEventListener('keydown', keyH); stopTimer(); padEl.remove(); queue = []; }
    };
  }
});

<script>
/* =====================================================================
   Slide puzzle (8, 15, 24) — row-and-column method teacher
   ===================================================================== */
const Slide = (() => {
  // binary heap
  class Heap { constructor() { this.a = []; } push(x) { const a = this.a; a.push(x); let i = a.length - 1; while (i) { const p = (i - 1) >> 1; if (a[p].f <= a[i].f) break; [a[p], a[i]] = [a[i], a[p]]; i = p; } } pop() { const a = this.a, t = a[0], l = a.pop(); if (a.length) { a[0] = l; let i = 0; for (; ;) { const L = 2 * i + 1, R = L + 1; let m = i; if (L < a.length && a[L].f < a[m].f) m = L; if (R < a.length && a[R].f < a[m].f) m = R; if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m; } } return t; } get size() { return this.a.length; } }
  // Move a set of tiles to their target cells (other tiles are interchangeable), never touching locked cells.
  // returns list of cells the blank moves into, or null
  function place(board, N, locked, targets, w = 1, cap = 250000) {
    const pos0 = [board.indexOf(0), ...targets.map(t => board.indexOf(t.v))];
    const tg = targets.map(t => t.cell);
    const h = p => { let s = 0; for (let i = 1; i < p.length; i++) { const a = p[i], b = tg[i - 1]; s += Math.abs(a % N - b % N) + Math.abs((a / N | 0) - (b / N | 0)); } return s; };
    const H = new Heap(), seen = new Map(); const k0 = pos0.join(); seen.set(k0, null);
    H.push({ p: pos0, g: 0, f: h(pos0) * w, k: k0 });
    let n = 0;
    while (H.size) {
      const cur = H.pop(); if (h(cur.p) === 0) { const out = []; let k = cur.k; while (seen.get(k)) { const [pk, mv] = seen.get(k); out.unshift(mv); k = pk; } return out; }
      if (++n > cap) return null;
      const b = cur.p[0], bx = b % N, by = b / N | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const x = bx + dx, y = by + dy; if (x < 0 || y < 0 || x >= N || y >= N) continue; const c = y * N + x; if (locked.has(c)) continue;
        const np = cur.p.slice(); np[0] = c; const ti = cur.p.indexOf(c, 1); if (ti > 0) np[ti] = b;
        const k = np.join(); if (seen.has(k)) continue; seen.set(k, [cur.k, c]);
        H.push({ p: np, g: cur.g + 1, f: cur.g + 1 + h(np) * w, k });
      }
    }
    return null;
  }
  // the teaching order: top row, left column, repeat until a 3x3 is left
  function segments(N) {
    const segs = []; let r = 0, c = 0;
    while (N - r > 3) {
      const row = []; for (let x = c; x < N; x++) row.push(r * N + x);
      segs.push({ name: 'Row ' + (r + 1), cells: row, lockAfter: row });
      const col = []; for (let y = r + 1; y < N; y++) col.push(y * N + c);
      segs.push({ name: 'Column ' + (c + 1), cells: col, lockAfter: col }); r++; c++;
    }
    const rest = []; for (let y = r; y < N; y++) for (let x = c; x < N; x++) if (y * N + x !== N * N - 1) rest.push(y * N + x);
    segs.push({ name: 'Last 3×3', cells: rest, last: true });
    return segs;
  }
  // next teaching chunk for the current board
  function nextChunk(board, N) {
    const segs = segments(N), locked = new Set();
    for (let si = 0; si < segs.length; si++) {
      const sg = segs[si]; const ok = sg.cells.every(c => board[c] === c + 1);
      if (ok && !sg.last) { sg.cells.forEach(c => locked.add(c)); continue; }
      if (ok && sg.last && board[N * N - 1] === 0) return null;
      if (sg.last) {
        const targets = sg.cells.map(c => ({ v: c + 1, cell: c }));
        const mv = place(board, N, locked, targets, 1, 200000) || place(board, N, locked, targets, 2, 400000);
        return { seg: si, segs, tile: null, moves: mv || [], label: 'Finish the last 3×3' };
      }
      // place tiles one at a time, keeping the ones already done in this segment
      const done = [];
      for (const c of sg.cells) {
        if (board[c] === c + 1 && done.length === sg.cells.indexOf(c)) { done.push(c); continue; }
        const targets = [...done, c].map(x => ({ v: x + 1, cell: x }));
        const mv = place(board, N, locked, targets, 1, 150000) || place(board, N, locked, targets, 2.5, 400000);
        return { seg: si, segs, tile: c + 1, moves: mv || [], label: 'Put tile ' + (c + 1) + ' in place' };
      }
    }
    return null;
  }
  return { place, segments, nextChunk };
})();

function makeArt(w, h, seed = 1) { // a built-in multicolour picture, no upload needed
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  let s = seed * 9301 + 49297; const R = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const pals = [['#14111c', '#ff5c93', '#f2c14e', '#4fd6ff', '#5fd08f', '#a77bff'], ['#0d2b45', '#203c56', '#544e68', '#8d697a', '#d08159', '#ffaa5e', '#ffd4a3'], ['#1a1c2c', '#5d275d', '#b13e53', '#ef7d57', '#ffcd75', '#a7f070', '#38b764', '#257179']][seed % 3];
  const bg = g.createLinearGradient(0, 0, w, h); bg.addColorStop(0, pals[0]); bg.addColorStop(1, pals[1]); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  if (seed % 3 === 0) { for (let i = 0; i < 26; i++) { g.fillStyle = pals[1 + (i % (pals.length - 1))]; g.globalAlpha = .85; const x = R() * w, y = R() * h, r = 20 + R() * w * .16; g.beginPath(); if (i % 3 === 0) g.arc(x, y, r, 0, 7); else if (i % 3 === 1) g.rect(x - r / 2, y - r / 2, r, r); else { g.moveTo(x, y - r); g.lineTo(x + r, y + r); g.lineTo(x - r, y + r); } g.fill(); } }
  else if (seed % 3 === 1) { for (let i = 0; i < 7; i++) { g.fillStyle = pals[i % pals.length]; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 20) g.lineTo(x, h * (.25 + i * .1) + Math.sin(x / (60 + i * 20) + i) * h * .07); g.lineTo(w, h); g.fill(); } g.fillStyle = '#ffd4a3'; g.beginPath(); g.arc(w * .7, h * .22, h * .1, 0, 7); g.fill(); }
  else { const n = 9; for (let y = 0; y < n; y++) for (let x = 0; x < n * w / h; x++) { g.fillStyle = pals[(x * 3 + y * 5 + (R() * 3 | 0)) % pals.length]; g.beginPath(); const sz = h / n; g.arc(x * sz + sz / 2, y * sz + sz / 2, sz * (.25 + R() * .25), 0, 7); g.fill(); g.strokeStyle = pals[(x + y) % pals.length]; g.lineWidth = 3; g.strokeRect(x * sz + 4, y * sz + 4, sz - 8, sz - 8); } }
  g.globalAlpha = 1; return c.toDataURL('image/jpeg', .9);
}
function pickImage(cb) { const f = $('#fileIn'); f.value = ''; f.onchange = () => { const file = f.files[0]; if (!file) return; const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(file); }; f.click(); }

registerGame({
  id: 'slide', name: 'Slide Puzzle', tag: 'Classic', desc: 'The 8, 15 and 24 puzzles, with numbers or your own photo. Learn the row-and-column method.',
  art: () => `<svg viewBox="0 0 100 100"><rect x="8" y="8" width="84" height="84" rx="8" fill="#2a1e14"/>${[...Array(15)].map((_, i) => { const x = 12 + (i % 4) * 19.5, y = 12 + (i / 4 | 0) * 19.5; const c = tilePal(); return `<rect x="${x}" y="${y}" width="18" height="18" rx="3" fill="${c[(i / 4 | 0) % c.length]}"/><text x="${x + 9}" y="${y + 13}" font-family="Bungee,Impact" font-size="10" text-anchor="middle" fill="#fff">${i + 1}</text>`; }).join('')}</svg>`,
  how: `<p><b>Tap</b> any tile in the same row or column as the gap to slide it (and everything between) into the gap. You can also <b>swipe</b> anywhere on the board to push a tile into the gap.</p><p><b>The method:</b> finish the top row, then the left column. What's left is a smaller puzzle — repeat until a 3×3 remains, then finish it. The teacher locks the parts you've finished and shows which tile to move next.</p><p>Tiles are coloured by the row they belong in, so you can see at a glance where they go.</p>`,
  create(host, opts, o) {

    const B = el('div', { class: 'sboard' }); host.appendChild(B);

    under.onclick = e => { const a = e.target.closest('[data-a]')?.dataset.a; if (a === 'show') showMe(); if (a === 'chunk') doChunk(); };
    opts.innerHTML = `<label>Size</label><div class="seg" id="sN"><button data-n="3">8 (3×3)</button><button data-n="4">15 (4×4)</button><button data-n="5">24 (5×5)</button></div><label>Tiles</label><div class="seg" id="sM"><button data-m="numbers">Numbers</button><button data-m="picture">Picture</button></div><button class="btn sm" id="sUp">📷 Use my photo</button><button class="btn sm" id="sArt">🎨 Next picture</button>`;
    const paint = () => { $$('#sN button', opts).forEach(b => b.classList.toggle('on', +b.dataset.n === N)); $$('#sM button', opts).forEach(b => b.classList.toggle('on', b.dataset.m === mode)); };
    $('#sN', opts).onclick = e => { const b = e.target.closest('button'); if (b) { N = +b.dataset.n; store.set('slide.n', N); newGame(); } };
    $('#sM', opts).onclick = e => { const b = e.target.closest('button'); if (b) { mode = b.dataset.m; store.set('slide.mode', mode); if (mode === 'picture' && !img) img = makeArt(600, 600, artSeed); layout(); } };
    $('#sUp', opts).onclick = () => pickImage(src => { cropSquare(src, d => { img = d; mode = 'picture'; paint(); layout(); }); });
    $('#sArt', opts).onclick = () => { artSeed++; img = makeArt(600, 600, artSeed); mode = 'picture'; paint(); layout(); };
    function cropSquare(src, cb) { const im = new Image(); im.onload = () => { const s = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = 600; c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 600, 600); cb(c.toDataURL('image/jpeg', .9)); }; im.src = src; }

      paint(); const r = host.getBoundingClientRect(); const size = Math.min(r.width - 24, r.height - 80); ts = size / N;
      B.style.width = B.style.height = size + 'px'; B.style.left = (r.width - size) / 2 + 'px'; B.style.top = Math.max(10, (r.height - 60 - size) / 2) + 'px';
      B.innerHTML = ''; tiles = [];
      const pal = tilePal();
      const lockedNow = lockedCells();
      for (const c of lockedNow) { const d = el('div', { class: 'lockcell' }); d.style.width = d.style.height = ts + 'px'; d.style.left = (c % N) * ts + 'px'; d.style.top = (c / N | 0) * ts + 'px'; B.appendChild(d); }
      for (let v = 1; v < N * N; v++) {
        const t = el('div', { class: 'tile', 'data-v': v }); const g = Math.max(2, ts * .04);
        t.style.width = t.style.height = (ts - g * 2) + 'px'; t.style.left = t.style.top = g + 'px'; t.style.fontSize = ts * .36 + 'px';
        const tr = (v - 1) / N | 0, tc = (v - 1) % N;
        if (mode === 'picture' && img) { t.style.backgroundImage = `url(${img})`; t.style.backgroundSize = `${N * ts}px ${N * ts}px`; t.style.backgroundPosition = `${-tc * ts - g}px ${-tr * ts - g}px`; t.innerHTML = `<span class="n" style="font-size:.45em;position:absolute;left:8%;top:4%;opacity:.85">${v}</span>`; }
        else { t.style.background = pal[tr % pal.length]; t.innerHTML = `<span class="n">${v}</span>`; t.style.color = inkFor(pal[tr % pal.length]); }
        B.appendChild(t); tiles[v] = t;
      }

    cells(p = this.p) { return ROT[p.t][p.r].map(([x, y]) => [p.x + x, p.y + y]); }
    fits(p) { return this.cells(p).every(([x, y]) => x >= 0 && x < W && y < H && (y < 0 || !this.g[y][x])); }

})();

    TrickMath.SPELL.forEach((w, v) => { for (let k = 0; k < w.length; k++) q.push(q.shift()); slot[q.shift()] = v + 1; });
    return slot;
  },
  // 9. bottom-card sum: start a pile with a face-up card and count on to 13
  thirteenPiles(deck) { const piles = []; let i = 0; while (i < deck.length) { const v = deck[i].r, need = 14 - v; if (i + need > deck.length) break; piles.push(deck.slice(i, i + need)); i += need; } return { piles, leftover: deck.slice(i) }; },
  // 10. 1089
  rev3: n => +String(n).padStart(3, '0').split('').reverse().join(''),
  // 11. digit sum / casting out nines
  missingDigit(rest) { const s = rest.reduce((a, b) => a + b, 0) % 9; return s === 0 ? 9 : 9 - s; },
  // 12. clock: card k (1-based) of 12 goes to hour 13-k
  clockHour: k => 13 - k,
  // 15. Si Stebbins: each card is 3 higher than the last, suits in CHSD order
  stebbins() { const d = []; let r = 1, s = 0; for (let i = 0; i < 52; i++) { d.push(Cards.card(r, s)); r = (r + 3 - 1) % 13 + 1; s = (s + 1) % 4; } return d; },
  stebNext(c) { return Cards.card((c.r + 3 - 1) % 13 + 1, (c.s + 1) % 4); },
  // 16. Mutus nomen dedit cocis
  MUTUS: ['MUTUS', 'NOMEN', 'DEDIT', 'COCIS'],
  mutusLetters() { const seen = []; for (const ch of TrickMath.MUTUS.join('')) if (!seen.includes(ch)) seen.push(ch); return seen; }, // M U T S N O E D I C
  mutusLayout(pairs) { const grid = TrickMath.MUTUS.map(w => w.split('').map(() => null)); const L = TrickMath.mutusLetters(); pairs.forEach((pr, k) => { const ch = L[k]; let n = 0; TrickMath.MUTUS.forEach((w, r) => w.split('').forEach((x, c) => { if (x === ch) grid[r][c] = pr[n++]; })); }); return grid; },
  mutusFind(rows) { // rows: sorted array of 1 or 2 row indexes → the letter whose two places are in those rows
    const L = TrickMath.mutusLetters(); for (let k = 0; k < L.length; k++) { const where = []; TrickMath.MUTUS.forEach((w, r) => w.split('').forEach(x => { if (x === L[k]) where.push(r); })); const set = [...new Set(where)].sort().join(); if (set === rows.slice().sort().join()) return k; } return -1;
  },
  // 17. red/black pairs
  redBlack(deck) { const R = [], B = [], D = []; for (let i = 0; i + 1 < deck.length; i += 2) { const a = deck[i], b = deck[i + 1]; (Cards.red(a) && Cards.red(b) ? R : !Cards.red(a) && !Cards.red(b) ? B : D).push(a, b); } return { R, B, D }; },
  // 18. Chinese remainder theorem (mod 3, 4, 5 → 1..60)
  crt(a, b, c) { for (let n = 1; n <= 60; n++) if (n % 3 === a && n % 4 === b && n % 5 === c) return n; return -1; },
  // 19. perfect shuffles
  faroOut(d) { const h = d.length / 2, out = []; for (let i = 0; i < h; i++) out.push(d[i], d[h + i]); return out; },
  faroIn(d) { const h = d.length / 2, out = []; for (let i = 0; i < h; i++) out.push(d[h + i], d[i]); return out; },
  elmsley(n) { const k = n - 1; if (k === 0) return []; return k.toString(2).split('').map(b => b === '1' ? 'in' : 'out'); }, // top card to position n
  // twins: card i and card n-1-i are "mates" (same value, same colour); perfect shuffles keep it that way
  mate: c => Cards.card(c.r, [2, 3, 0, 1][c.s]), // clubs<->spades, hearts<->diamonds
  stayStack(n = 20) { const half = shuffle(Cards.deck().filter(c => c.s < 2)).slice(0, n / 2); return [...half, ...half.slice().reverse().map(TrickMath.mate)]; },
  // 13 cards of a suit add up to 91
  suitTotal: 91,
  // 16-card grid: transpose rows into columns
  transpose(g) { return g[0].map((_, c) => g.map(r => r[c])); },
  // 20. Hummer's CATO
  cut(d, k) { return d.slice(k).concat(d.slice(0, k)); },
  turnTwo(d) { const [a, b, ...r] = d; return [{ ...b, up: !b.up }, { ...a, up: !a.up }, ...r]; }
};

<script>
/* =====================================================================
   The Show — a studio of 20 mathematical card tricks.
   Each act can be performed on you, then explained step by step.
   ===================================================================== */
const CANCEL = { cancel: true };
function cardHTML(c, o = {}) {
  if (!c) return `<div class="pc blank"></div>`;
  if (c.blank) return `<div class="pc face num-only"><span class="cbig">${c.blank}</span></div>`;
  const down = o.down || c.up === false, red = Cards.red(c);
  return `<div class="pc ${down ? 'down' : 'face'} ${red ? 'red' : ''} ${o.hl ? 'hl' : ''} ${o.pick ? 'pickable' : ''}" ${o.i != null ? `data-i="${o.i}"` : ''} data-id="${Cards.id(c)}">${down ? '' : `<span class="cr">${Cards.RANKS[c.r - 1]}<br>${Cards.SUITS[c.s]}</span><span class="cbig">${Cards.SUITS[c.s]}</span>`}</div>`;
}
function ShowStage(root) {
  root.innerHTML = `<div class="ssteps"></div><div class="patter" aria-live="polite"></div><div class="ctable"></div><div class="ctrl"></div>`;
  const P = $('.patter', root), Tb = $('.ctable', root), C = $('.ctrl', root), SS = $('.ssteps', root); let stepList = [];
  let tok = 0;
  const api = {
    start() { return ++tok; },
    stop() { tok++; },
    guard(t) { if (t !== tok) throw CANCEL; },
    say(html) { P.innerHTML = html; },
    setSteps(list) { stepList = list || []; api.step(0); },
    step(i) { SS.innerHTML = stepList.map((x, j) => `<span class="${j < i ? 'done' : j === i ? 'cur' : ''}"><b>${j + 1}</b> ${esc(x)}</span>`).join(''); api.onstep && api.onstep(i); },
    clear() { Tb.innerHTML = ''; C.innerHTML = ''; },
    room() { const r = root.getBoundingClientRect(); return { w: r.width - 24, h: Math.max(160, r.height - P.getBoundingClientRect().height - 110) }; },
    size(n, cols) { const { w, h } = api.room(); const per = Math.min(cols || n, n), rows = Math.ceil(n / per); const cw = clamp(Math.floor(Math.min((w - per * 6) / per, (h - rows * 6) / rows / 1.4)), 18, 92); root.style.setProperty('--cw', cw + 'px'); },
    sizePiles(np, maxLen, squared) { const { w, h } = api.room(); const vis = squared ? .04 : .35; const cw = clamp(Math.floor(Math.min((w - np * 28) / np, (h - 44) / (1.4 + Math.max(0, maxLen - 1) * vis))), 22, 92); root.style.setProperty('--cw', cw + 'px'); },
    show(cards, o = {}) { // a spread or grid of cards; o.pick → resolves with index tapped
      api.size(cards.length, o.cols); Tb.innerHTML = `<div class="crow ${o.fan ? 'fan' : ''}" style="${o.cols ? `max-width:calc(var(--cw) * ${o.cols} + ${o.cols * 6}px)` : ''}">${cards.map((c, i) => cardHTML(c, { i, down: o.down, hl: o.hl && o.hl.has(i), pick: o.pick })).join('')}</div>${o.note ? `<p class="cnote">${o.note}</p>` : ''}`;
      if (!o.pick) return Promise.resolve();
      return new Promise(res => Tb.onclick = e => { const el = e.target.closest('[data-i]'); if (el) { Tb.onclick = null; $$('.pickable', Tb).forEach(x => x.classList.remove('pickable')); beep('pick'); res(+el.dataset.i); } });
    },
    piles(piles, o = {}) { // columns of cards; o.pick → resolves with pile index tapped
      const maxLen = Math.max(1, ...piles.map(p => p.length)); api.sizePiles(piles.length, maxLen, o.squared);
      Tb.innerHTML = `<div class="cpiles">${piles.map((p, i) => `<div class="cpile ${o.pick ? 'pickable' : ''} ${o.hl === i ? 'hl' : ''}" data-p="${i}"><div class="plabel">${o.labels ? o.labels[i] : 'Pile ' + (i + 1)}</div><div class="pstack ${o.squared ? 'squared' : ''}">${p.map((c, j) => cardHTML(c, { down: o.down, hl: o.hlCard && o.hlCard(c) })).join('')}</div>${o.counts ? `<div class="pcount">${p.length} cards</div>` : ''}</div>`).join('')}</div>`;
      if (!o.pick) return Promise.resolve();
      return new Promise(res => Tb.onclick = e => { const el = e.target.closest('[data-p]'); if (el) { Tb.onclick = null; $$('.pickable', Tb).forEach(x => x.classList.remove('pickable')); el.classList.add('hl'); beep('pick'); res(+el.dataset.p); } });
    },
    html(h) { Tb.innerHTML = h; },
    ask(btns) { C.innerHTML = btns.map((b, i) => `<button class="btn ${b.primary ? 'primary' : ''}" data-b="${i}">${b.label}</button>`).join(''); return new Promise(res => C.onclick = e => { const el = e.target.closest('[data-b]'); if (el) { C.onclick = null; C.innerHTML = ''; res(btns[+el.dataset.b].value); } }); },
    next(label = 'Next') { return api.ask([{ label, value: 1, primary: true }]); },
    num(label, min, max, def) {
      let v = def ?? min; C.innerHTML = `<div class="numpick"><span class="eyebrow">${label}</span><button class="btn" data-n="-1">−</button><b class="num" id="npv">${v}</b><button class="btn" data-n="1">+</button><button class="btn primary" data-n="ok">OK</button></div>`;
      return new Promise(res => C.onclick = e => { const el = e.target.closest('[data-n]'); if (!el) return; if (el.dataset.n === 'ok') { C.onclick = null; C.innerHTML = ''; res(v); return; } v = clamp(v + +el.dataset.n, min, max); $('#npv', C).textContent = v; });
    },
    wait(ms) { return new Promise(r => setTimeout(r, ms * SPEED())); },
    reveal(c, text) { api.size(1); Tb.innerHTML = `<div class="creveal">${cardHTML(c)}<p>${text || ''}</p></div>`; Tb.dataset.reveal = c ? Cards.id(c) : ''; beep('win'); buzz([20, 30, 20]); }
  };
  return api;
}

/* ---------- the 20 acts ---------- */
const PILES3 = ['Left', 'Middle', 'Right'];
const TRICKS = [
  { id: 'twentyone', title: 'The 21-Card Trick', principle: 'Three piles', blurb: 'Think of any card. Tell me which pile it’s in, three times, and I find it.', steps: ['Think of a card', 'Pick a pile ×3', 'Reveal'],
    async perform(u, t) {
      u.step(0); let d = Cards.draw(21); u.say('Here are 21 cards. <b>Think of any one</b> — don’t tap it, just remember it.'); await u.show(d, { cols: 7 }); await u.next('I’ve got one'); u.guard(t);
      for (let r = 0; r < 3; r++) { u.step(1); const p = TrickMath.deal3(d); u.say(`Round ${r + 1} of 3. <b>Tap the pile your card is in.</b>`); const ch = await u.piles(p, { pick: true, labels: PILES3 }); u.guard(t); d = TrickMath.gather(p, ch, 1); u.say('I stack the piles with <b>your pile in the middle</b>…'); await u.wait(600); u.guard(t); }
      u.step(2); u.say('I count to the 11th card…'); await u.wait(700); u.guard(t); u.reveal(d[10], 'Is this your card?');
    },
    explain: ['Each time you choose a pile, I put that pile <b>in the middle</b> of the stack.', 'That pushes your card toward the middle of the 21 cards. After three times, it is <b>exactly in the middle</b> — card number 11.', '<b>Do it yourself:</b> deal 21 cards into 3 piles, face up, one card to each pile in turn. Ask which pile, put it in the middle, deal again. After 3 rounds, count to the 11th card.'] },
  { id: 'twentyseven', title: 'Your Lucky Number (27 cards)', principle: 'Three piles, three places', blurb: 'Pick a number from 1 to 27 and a card. Your card ends up at your number.', steps: ['Pick a number', 'Think of a card', 'Pick a pile ×3', 'Count to your number'],
    async perform(u, t) {
      u.step(0); let d = Cards.draw(27); u.say('Choose a <b>lucky number</b> from 1 to 27.'); const n = await u.num('Your number', 1, 27, 9); u.guard(t);
      const dg = TrickMath.digits3(n); u.step(1); u.say('Now <b>think of any card</b> here.'); await u.show(d, { cols: 9 }); await u.next('Got it'); u.guard(t);
      for (let r = 0; r < 3; r++) { u.step(2); const p = TrickMath.deal3(d); u.say(`Round ${r + 1} of 3. <b>Tap the pile your card is in.</b>`); const ch = await u.piles(p, { pick: true, labels: PILES3 }); u.guard(t); d = TrickMath.gather(p, ch, dg[r]); u.say(`Your pile goes on the <b>${['top', 'middle', 'bottom'][dg[r]]}</b>.`); await u.wait(700); u.guard(t); }
      u.step(3); u.say(`Counting to card number <b>${n}</b>…`); await u.show(d.slice(0, n), { down: true, cols: 9 }); await u.wait(800); u.guard(t); u.reveal(d[n - 1], `Card number ${n}. Yours?`);
    },
    explain: ['It works like the 21-card trick, but instead of always putting your pile in the middle, I choose <b>top, middle or bottom</b> each time.', 'Those three choices work like a code for your number: each one moves your card by 9s, then 3s, then 1s.', 'After three rounds there are exactly (your number − 1) cards above it.', '<b>Do it yourself:</b> take your number minus 1 and write it with 9s, 3s and 1s. Example 12 − 1 = 11 = 1×9 + 0×3 + 2×1. Read it backwards for the rounds: 2 (bottom), 0 (top), 1 (middle).'] },
  { id: 'rowcol', title: 'Row and Column', principle: 'A grid', blurb: 'Think of a card in a 4×4 grid. Two answers and I have it.', steps: ['Think of a card', 'Which row?', 'I re-deal', 'Which row now?', 'Reveal'],
    async perform(u, t) {
      const d = Cards.draw(16), g = [0, 1, 2, 3].map(r => d.slice(r * 4, r * 4 + 4));
      u.step(0); u.size(20, 5); u.say('Sixteen cards in four rows. <b>Think of one.</b>'); await u.html(gridHTML(g)); await u.next('Got one'); u.guard(t);
      u.step(1); u.say('<b>Which row is your card in?</b>'); const r = await u.ask([0, 1, 2, 3].map(i => ({ label: 'Row ' + (i + 1), value: i }))); u.guard(t);
      u.step(2); u.say('I pick the cards up and lay them out again — <b>each row becomes a column</b>.'); const g2 = TrickMath.transpose(g); await u.html(gridHTML(g2)); await u.wait(900); u.guard(t);
      u.step(3); u.say('<b>Which row is your card in now?</b>'); const r2 = await u.ask([0, 1, 2, 3].map(i => ({ label: 'Row ' + (i + 1), value: i }))); u.guard(t);
      u.step(4); u.reveal(g[r][r2], 'Your card!');
    },
    explain: ['Your first answer tells me your card is one of the <b>4 cards in that row</b>.', 'When I lay the cards out again, each old row becomes a column — so those 4 cards end up in <b>4 different rows</b>.', 'Your second answer points to exactly one of them. Row + row = one card.', '<b>Do it yourself:</b> deal 16 cards in 4 rows. Ask the row, pick up row by row, deal again in columns. Ask the row again — the card is where the two meet.'] },
  { id: 'yesno', title: 'Yes or No', principle: 'Halving', blurb: 'Think of one of 16 cards. Four yes-or-no answers and I name it.', steps: ['Think of a card', 'Answer 4 questions', 'Reveal'],
    async perform(u, t) {
      const cs = Cards.draw(16); u.step(0); u.say('<b>Think of one of these 16 cards.</b>'); await u.show(cs, { cols: 8 }); await u.next('Got one'); u.guard(t);
      let v = 0; for (let b = 0; b < 4; b++) { u.step(1); const board = cs.filter((_, i) => i >> b & 1); u.say(`Question ${b + 1} of 4: <b>is your card here?</b>`); await u.show(board, { cols: 8 }); const y = await u.ask([{ label: 'Yes', value: 1, primary: true }, { label: 'No', value: 0 }]); u.guard(t); if (y) v |= 1 << b; }
      u.step(2); u.reveal(cs[v], `Your card: the <b>${Cards.long(cs[v])}</b>.`);
    },
    explain: ['I give each card a secret number from 0 to 15.', 'Each question shows half the cards. A “yes” adds that question’s points to the total: 1, then 2, then 4, then 8.', 'The total of your “yes” points is your card’s number — no two cards get the same total.', 'This is how computers count: each yes/no is one <b>bit</b>, and 4 bits can tell 16 things apart.'] },
  { id: 'detective', title: 'The Card Detective', principle: 'Halving', blurb: 'Think of ANY card in the deck. I find it in six questions — and you watch the cards disappear.', steps: ['Think of any card', 'Six questions', 'Reveal'],
    async perform(u, t) {
      const deck = Cards.deck(); let left = deck.slice(); const draw = () => u.html(`<div class="crow" style="max-width:calc(var(--cw)*13 + 78px)">${deck.map(c => `<div class="${left.includes(c) ? '' : 'gone'}">${cardHTML(c)}</div>`).join('')}</div><p class="cnote">${left.length} card${left.length > 1 ? 's' : ''} still possible</p>`);
      u.step(0); u.size(52, 13); u.say('<b>Think of any card in the whole deck.</b>'); draw(); await u.next('Got one'); u.guard(t);
      const ask = async (q, test) => { u.step(1); u.say(q); const y = await u.ask([{ label: 'Yes', value: 1, primary: true }, { label: 'No', value: 0 }]); u.guard(t); left = left.filter(c => !!test(c) === !!y); draw(); await u.wait(400); u.guard(t); };
      await ask('Is your card <b>red</b>? (hearts or diamonds)', c => Cards.red(c));
      const s1 = left[0].s; await ask(`Is it a <b>${['club', 'heart', 'spade', 'diamond'][s1]}</b>?`, c => c.s === s1);
      while (left.length > 1) { const vals = [...new Set(left.map(c => c.r))].sort((a, b) => a - b); const mid = vals[Math.floor(vals.length / 2)]; await ask(`Is its value <b>${Cards.RANKS[mid - 1]} or higher</b>? (A = 1, J = 11, Q = 12, K = 13)`, c => c.r >= mid); }
      u.step(2); u.reveal(left[0], `Your card: the <b>${Cards.long(left[0])}</b>.`);
    },
    explain: ['Every question cuts the cards still possible <b>in half</b>.', 'Colour: 52 → 26. Suit: 26 → 13. Then “this value or higher?” cuts 13 → 7 → 4 → 2 → 1.', 'Six questions are enough because 2 × 2 × 2 × 2 × 2 × 2 = 64, more than 52.', '<b>Do it yourself:</b> always ask questions that split what’s left into two halves. It’s also the best way to win 20 Questions!'] },
  { id: 'missing', title: 'The Missing Card', principle: 'Adding up', blurb: 'Take away any card while I look away. I add up the rest and name the missing one.', steps: ['Take a card away', 'I add them up', 'Reveal'],
    async perform(u, t) {
      const s = rnd(4); const cs = [...Array(13)].map((_, i) => Cards.card(i + 1, s));
      u.step(0); u.say('All thirteen ' + ['clubs', 'hearts', 'spades', 'diamonds'][s] + '. <b>Tap one to take it away</b> — I’ll shuffle the rest.'); const i = await u.show(cs, { pick: true, cols: 7 }); u.guard(t);
      const rest = shuffle(cs.filter((_, k) => k !== i)); u.step(1); await u.show(rest, { cols: 6 }); let sum = 0;
      for (const c of rest) { sum += c.r; u.say(`Adding up: … + ${c.r} = <b>${sum}</b>`); await u.wait(220); u.guard(t); }
      u.say(`All 13 cards always add up to <b>91</b>. These add up to <b>${sum}</b>. 91 − ${sum} = <b>${91 - sum}</b>.`); await u.next('Name it'); u.guard(t);
      u.step(2); u.reveal(Cards.card(91 - sum, s), `You took the <b>${Cards.long(Cards.card(91 - sum, s))}</b>.`);
    },
    explain: ['Count each card by its value: Ace = 1 … Jack = 11, Queen = 12, King = 13.', 'A full suit always adds up to 1 + 2 + … + 13 = <b>91</b>.', 'Add up the cards that are left. Whatever is missing from 91 is the card that was taken.', '<b>Do it yourself:</b> use one suit, let a friend hide a card, add up the rest (a calculator helps), and take it away from 91.'] },
  { id: 'think', title: 'Think of a Number', principle: 'Numbers that cancel out', blurb: 'Pick a number, do four easy sums, and you land on the card I predicted.', steps: ['Prediction', 'Think of a number', 'Do the sums', 'Count the cards'],
    async perform(u, t) {
      const row = Cards.draw(10); u.step(0); u.say('Ten cards face down. My prediction is sealed.'); await u.show(row, { down: true, cols: 10 }); await u.next('OK'); u.guard(t);
      u.step(1); u.say('<b>Think of a number from 1 to 10.</b> Keep it secret.'); await u.next('Got it'); u.guard(t);
      u.step(2); for (const q of ['<b>Double</b> it.', '<b>Add 10.</b>', '<b>Halve</b> it.', '<b>Take away</b> the number you first thought of.']) { u.say(q); await u.next('Done'); u.guard(t); }
      u.step(3); u.say('Now count that many cards along the row and turn that one over.'); await u.show(row, { down: true, cols: 10, hl: new Set([4]) }); await u.next('Turn it over'); u.guard(t);
      await u.show(row.map((c, i) => i === 4 ? c : { ...c, up: false }), { cols: 10, hl: new Set([4]) }); await u.wait(500); u.guard(t);

    },
    explain: ['Call your number N. Double it: 2N. Add 10: 2N + 10. Halve it: N + 5.', 'Take away your number: N + 5 − N = <b>5</b>. Your number cancels out!', 'So everyone counts to the 5th card, and I already knew which card that is.', '<b>Do it yourself:</b> peek at the 5th card from the top before you start. Change “add 10” to “add 8” and everyone gets 4.'] },
  { id: 'teentwenty', title: 'The 10–20 Trick', principle: 'Numbers that cancel out', blurb: 'Pick any number from 10 to 19. Deal, add, count back — and land on my card.', steps: ['Prediction', 'Pick a number', 'Deal that many', 'Add the digits', 'Count back'],
    async perform(u, t) {
      const d = Cards.draw(24); u.step(0); u.say('My prediction is sealed. Here’s a face-down packet.'); await u.show([d[9]], { down: true, note: 'Prediction' }); await u.next('OK'); u.guard(t);
      u.step(1); u.say('Pick <b>any number from 10 to 19</b>.'); const n = await u.num('Your number', 10, 19, 14); u.guard(t);
      u.step(2); u.say(`Deal <b>${n}</b> cards one at a time into a pile.`); const pile = d.slice(0, n).reverse(); await u.show(pile, { down: true, cols: 10 }); await u.wait(700); u.guard(t);
      const a = Math.floor(n / 10), b = n % 10, k = a + b; u.step(3); u.say(`Add the two digits of ${n}: ${a} + ${b} = <b>${k}</b>.`); await u.next('Count back'); u.guard(t);
      u.step(4); u.say(`Count <b>${k}</b> cards off the top of your pile. Turn over the ${k}${k === 1 ? 'st' : k === 2 ? 'nd' : k === 3 ? 'rd' : 'th'}.`); await u.show(pile, { down: true, cols: 10, hl: new Set([k - 1]) }); await u.wait(700); u.guard(t);
      u.reveal(pile[k - 1], `The <b>${Cards.long(pile[k - 1])}</b> — exactly my prediction!`);
