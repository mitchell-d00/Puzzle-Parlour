  art: () => { const K = kitVal('show'); return `<svg viewBox="0 0 100 100"><path d="M10 88h80" stroke="#f2c14e" stroke-width="3"/><g transform="rotate(-18 50 70)"><rect x="22" y="28" width="30" height="42" rx="4" fill="${K.back}" stroke="#fff" stroke-width="2"/><path d="M26 32h22v34H26z" fill="none" stroke="${K.trim}" stroke-width="1.5"/></g><g transform="rotate(4 50 70)"><rect x="35" y="22" width="30" height="42" rx="4" fill="#fff" stroke="#14111c" stroke-width="1.5"/><text x="40" y="34" font-size="9" font-family="Georgia" fill="#c41e3a">A</text><text x="50" y="50" font-size="16" text-anchor="middle" fill="#c41e3a">♥</text></g><g transform="rotate(22 50 70)"><rect x="48" y="26" width="30" height="42" rx="4" fill="${K.back}" stroke="#fff" stroke-width="2"/><path d="M52 30h22v34H52z" fill="none" stroke="${K.trim}" stroke-width="1.5"/></g><path d="M18 14l4 6 6-4-2 7 7 2-7 2 2 7-6-4-4 6-1-7-7-1 6-4-4-6 7 2z" fill="#f2c14e" transform="scale(.6) translate(10 0)"/></svg>`; },
  how: `<p>Welcome to <b>The Show</b>: 20 card tricks that work by mathematics, not sleight of hand.</p><p>Tap <b>Perform it on me</b> and the trick is done to you — you think of cards, choose piles, cut the deck. Then tap <b>How it works</b> and Professor Pip explains it step by step, so you can do it for your friends with a real deck.</p>`,
  create(host, opts) {
    const root = el('div', { class: 'show' }); host.appendChild(root);
    const paintBack = () => { const K = kitVal('show'); root.style.setProperty('--back', K.back); root.style.setProperty('--trim', K.trim); }; paintBack();
    let mode = 'program', cur = null, step = 0, stage = null, curStep = 0;
    opts.innerHTML = `<button class="btn sm" id="shProg">🎩 The programme</button><span class="muted" style="font-size:.85rem">${TRICKS.length} acts · each explained step by step</span>`;
    $('#shProg', opts).onclick = program;
    const seen = () => P.showSeen || (P.showSeen = {});
    function program() {
      if (stage) stage.stop(); mode = 'program'; cur = null; root.className = 'show programme'; root.style.removeProperty('--cw');
      root.innerHTML = `<div class="patter"><b>Tonight’s programme.</b> Pick an act. You make one easy choice at a time and I do the rest — then I show you the secret so you can do it for your friends.</div><div class="acts">${TRICKS.map((x, i) => `<div class="act ${seen()[x.id] ? 'done' : ''}"><div class="anum">${String(i + 1).padStart(2, '0')}</div><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.blurb)}</div><div class="aprin">${esc(x.principle)}</div></div><div class="abtn"><button class="btn sm primary" data-perform="${i}">▶ Perform</button><button class="btn sm" data-explain="${i}">How it works</button></div></div>`).join('')}</div>`;
      $('#gStats').innerHTML = `<span>Seen <b>${Object.keys(seen()).length}/${TRICKS.length}</b></span>`;
      coach();
    }
    root.addEventListener('click', e => { const a = e.target.closest('[data-perform]'), b = e.target.closest('[data-explain]'); if (a) perform(+a.dataset.perform); if (b) explain(+b.dataset.explain); });
    async function perform(i) {
      if (stage) stage.stop(); cur = TRICKS[i]; mode = 'perform'; root.className = 'show'; const my = stage = ShowStage(root); const t = my.start(); my.onstep = k => { curStep = k; coach(); }; my.setSteps(cur.steps); coach();
      try { await cur.perform(my, t); my.guard(t);
        if (!seen()[cur.id]) { seen()[cur.id] = 1; const r = award('show', 'acts', { stars: 2 }); toast(`New act seen! +${r.earned} ★`); }
        saveP(); $('#gStats').innerHTML = `<span>Seen <b>${Object.keys(seen()).length}/${TRICKS.length}</b></span>`;
        const c = $('.ctrl', root); c.innerHTML = `<button class="btn primary" data-explain="${i}">How does it work?</button><button class="btn" data-perform="${i}">Again</button><button class="btn" data-prog>Programme</button>`; c.onclick = e => { if (e.target.closest('[data-prog]')) program(); };
      } catch (e) { if (e !== CANCEL) throw e; }
    }
    function explain(i, k = 0) {
      if (stage) stage.stop(); cur = TRICKS[i]; mode = 'explain'; step = k; root.className = 'show explain';
      const n = cur.explain.length;
      root.innerHTML = `<div class="patter"><span class="eyebrow">${esc(cur.principle)}</span><br><b>${esc(cur.title)}</b> — how it works</div><div class="estep"><div class="enum">Step ${step + 1} of ${n}</div><p>${cur.explain[step]}</p><div class="edots">${cur.explain.map((_, j) => `<i class="${j <= step ? 'on' : ''}"></i>`).join('')}</div></div><div class="ctrl"><button class="btn" data-eb ${step ? '' : 'disabled'}>← Back</button>${step < n - 1 ? '<button class="btn primary" data-en>Next step →</button>' : `<button class="btn primary" data-perform="${i}">▶ Try it now</button>`}<button class="btn" data-prog>Programme</button></div>`;
      $('.ctrl', root).onclick = e => { if (e.target.closest('[data-eb]')) explain(i, step - 1); if (e.target.closest('[data-en]')) explain(i, step + 1); if (e.target.closest('[data-prog]')) program(); };
      coach();
    }
    function coach(why) {
      if (teacherOffMsg(why)) return;
      if (mode === 'program' || !cur) { T.set({ stage: 'The Show · tonight’s programme', steps: null, prog: Object.keys(seen()).length / TRICKS.length, msg: 'Every act here works by <b>mathematics</b>. Watch one performed on you, then tap <b>How it works</b> and I’ll walk you through it, step by step, so you can perform it with a real deck.', next: null, acts: [{ label: '▶ Start with a classic', fn: () => perform(0), primary: true }] }); return; }
      const i = TRICKS.indexOf(cur);
      if (mode === 'explain') T.set({ stage: cur.title, steps: cur.explain.map((_, j) => 'Step ' + (j + 1)), cur: step, prog: (step + 1) / cur.explain.length, msg: `<b>${esc(cur.principle)}.</b> ${cur.explain[step]}`, next: null, acts: [{ label: '▶ Try it now', fn: () => perform(i), primary: true }, { label: '🎩 Programme', fn: program }] });
      else T.set({ stage: cur.title, steps: cur.steps, cur: curStep, prog: (curStep + 1) / cur.steps.length, msg: `Step ${curStep + 1} of ${cur.steps.length}: <b>${esc(cur.steps[curStep])}</b>. Just follow the instructions on the table — I do the hard part. Afterwards I’ll show you the secret so you can do it too.`, next: null, acts: [{ label: '💡 How it works', fn: () => explain(i), primary: true }, { label: '🎩 Programme', fn: program }] });
    }

  }
});
// every act's explanation is also a page in the lesson book
TRICKS.forEach((x, i) => page('SH-' + String(i + 1).padStart(2, '0'), 'show', x.title, x.principle + ' card trick ' + x.id + ' ' + x.blurb, `<p><i>${esc(x.blurb)}</i></p><ol>${x.explain.map(s => `<li>${s}</li>`).join('')}</ol>`).practice = { label: '▶ Perform it on me', fn: () => { if (curId !== 'show') openGame('show'); setTimeout(() => GAMES.show._api.perform(i), 80); } });
</script>

<script>
/* =====================================================================
   20 Questions — a probabilistic guesser over ~1,000 things.
   • Every thing has a probability of "yes" for every question.
   • Answers (Yes / Probably / Don't know / Probably not / No) update a Bayesian
     belief over all things, so a wrong answer lowers a thing's odds instead of ruling it out.
   • Each question is chosen for maximum expected information gain (in bits).
   • Every finished game is learned from: answers nudge the probabilities, and
     new things and new questions can be taught.
   ===================================================================== */
const TQ = (() => {
  const SIZE = { XS: { tiny: 1, hand: 1, bigperson: 0, bighouse: 0 }, S: { tiny: 0, hand: 1, bigperson: 0, bighouse: 0 }, M: { tiny: 0, hand: 0, bigperson: 0, bighouse: 0 }, L: { tiny: 0, hand: 0, bigperson: 1, bighouse: 0 }, XL: { tiny: 0, hand: 0, bigperson: 1, bighouse: 1 } };
  const YES = .94, NO = .05, MAYBE = .5, K = 3, EPS = .08; // EPS: how much a single answer can be wrong without ruling a thing out
  let base = null;
  function parse() {
    if (base) return base;
    const qs = Object.entries(TQ_ATTRS).map(([id, q]) => ({ id, q }));
    const objs = [];
    for (const c of TQ_CATS) {
      const bt = c.base.split(/\s+/).filter(Boolean); const bsize = bt.find(t => SIZE[t] || t === 'N');
      for (const line of c.items.split('\n').map(x => x.trim()).filter(Boolean)) {
        const t = line.split(/\s+/); const name = t[0].replace(/_/g, ' ');
        let i = 1, emoji = c.e; if (t[1] && /[^\x00-\x7F]/.test(t[1])) { emoji = t[1]; i = 2; }
        const rest = t.slice(i); const size = rest.find(x => SIZE[x] || x === 'N') || bsize || 'M';
        const yes = new Set(), maybe = new Set();
        for (const tok of [...bt, ...rest]) { if (SIZE[tok] || tok === 'N') continue; if (tok[0] === '-') { yes.delete(tok.slice(1)); maybe.delete(tok.slice(1)); } else if (tok[0] === '?') { yes.delete(tok.slice(1)); maybe.add(tok.slice(1)); } else yes.add(tok); }
        const p = {}; for (const { id } of qs) p[id] = SIZE[size] && SIZE[size][id] != null ? (SIZE[size][id] ? YES : NO) : (size === 'N' && ['tiny', 'hand', 'bigperson', 'bighouse'].includes(id)) ? MAYBE : yes.has(id) ? YES : maybe.has(id) ? MAYBE : NO;
        objs.push({ name, emoji, p });
      }
    }
    return base = { qs, objs };
  }
  const brain = () => store.get('twenty.brain', { objects: [], questions: [], stats: {}, plays: {} });
  const saveBrain = b => store.set('twenty.brain', b);
  // the knowledge base with everything learned so far mixed in
  function kb() {
    const B = brain(), { qs: q0, objs: o0 } = parse();
    const qs = [...q0, ...B.questions];
    const objs = [...o0.map(o => ({ name: o.name, emoji: o.emoji, p: Object.assign({}, o.p) })), ...B.objects.map(o => ({ name: o.name, emoji: o.emoji || '✨', p: Object.assign({}, o.base || {}), learned: true }))];
    for (const o of objs) { for (const q of qs) if (o.p[q.id] == null) o.p[q.id] = MAYBE; const st = B.stats[o.name]; const k = o.learned ? 1 : K; if (st) for (const id in st) { const [sum, n] = st[id]; o.p[id] = (o.p[id] * k + sum) / (k + n); } o.prior = 1 + .25 * Math.log1p((B.plays || {})[o.name] || 0); }
    return { qs, objs };
  }
  const ANS = { y: 1, py: .78, d: .5, pn: .22, n: 0 };
  function session(K2 = kb()) {
    const { qs, objs } = K2; const n = objs.length; let w = new Float64Array(n);
    const reset = () => { let s = 0; for (let i = 0; i < n; i++) { w[i] = objs[i].prior; s += w[i]; } for (let i = 0; i < n; i++) w[i] /= s; };
    reset(); const answers = [], rejected = new Set();
    const norm = () => { let s = 0; for (let i = 0; i < n; i++) s += w[i]; if (s <= 0) { reset(); return; } for (let i = 0; i < n; i++) w[i] /= s; };
    function apply(qid, a) { const v = ANS[a]; for (let i = 0; i < n; i++) { const p = objs[i].p[qid]; w[i] *= EPS + (1 - 2 * EPS) * (v * p + (1 - v) * (1 - p)); } norm(); }
    function answer(qid, a) { answers.push([qid, a]); apply(qid, a); }
    function reject(name) { rejected.add(name); const i = objs.findIndex(o => o.name === name); if (i >= 0) { w[i] = 0; norm(); } }
    function undo() { answers.pop(); reset(); for (const nm of rejected) { const i = objs.findIndex(o => o.name === nm); if (i >= 0) w[i] = 0; } norm(); for (const [q, a] of answers) apply(q, a); }
    function entropy() { let h = 0; for (let i = 0; i < n; i++) if (w[i] > 0) h -= w[i] * Math.log2(w[i]); return h; }
    function best(k = 1) { // expected information gain for every unasked question
      const asked = new Set(answers.map(x => x[0])); const live = []; for (let i = 0; i < n; i++) if (w[i] > 1e-7) live.push(i);
      const H = entropy(), res = [];
      for (const q of qs) {
        if (asked.has(q.id)) continue; let Sy = 0, Ly = 0, Ln = 0;
        for (const i of live) { const p = EPS + (1 - 2 * EPS) * objs[i].p[q.id], a = w[i] * p, b = w[i] * (1 - p); Sy += a; if (a > 0) Ly += a * Math.log2(a); if (b > 0) Ln += b * Math.log2(b); }
        const Sn = 1 - Sy; if (Sy < 1e-6 || Sn < 1e-6) continue;
        const Hy = -(Ly / Sy) + Math.log2(Sy), Hn = -(Ln / Sn) + Math.log2(Sn);
        res.push({ q, gain: H - (Sy * Hy + Sn * Hn), py: Sy });
      }
      res.sort((a, b) => b.gain - a.gain); return k === 1 ? res[0] : res.slice(0, k);
    }
    function top(k = 5) { const idx = [...Array(n).keys()].sort((a, b) => w[b] - w[a]).slice(0, k); return idx.map(i => ({ o: objs[i], pr: w[i] })); }
    function fitting(th = .02) { const m = Math.max(...w); let c = 0; for (let i = 0; i < n; i++) if (w[i] >= m * th) c++; return c; }
    return { answer, reject, undo, best, top, entropy, fitting, answers, rejected, objs, qs, get w() { return w; } };
  }
  // learning
  function learn(name, answers, opts = {}) {
    const B = brain(); name = name.trim().toLowerCase(); if (!name) return;
    const { objs } = parse(); const known = objs.some(o => o.name === name) || B.objects.some(o => o.name === name);
    if (!known) { // start a new thing from the things it most resembles ("like a guinea pig, but…")
      const base0 = {}; const like = (opts.like || []).filter(t => t.pr > 0); const tot = like.reduce((a, t) => a + t.pr, 0);
      if (tot > 0) for (const id in like[0].o.p) base0[id] = +(like.reduce((a, t) => a + t.pr * t.o.p[id], 0) / tot).toFixed(3);
      B.objects.push({ name, emoji: opts.emoji || '✨', base: base0, like: like.slice(0, 3).map(t => t.o.name) });
    }
    const st = B.stats[name] = B.stats[name] || {};
    for (const [q, a] of answers) { if (a === 'd') continue; const v = ANS[a]; const cur = st[q] || [0, 0]; st[q] = [cur[0] + v, cur[1] + 1]; }
    if (opts.question && opts.question.trim()) {
      let q = opts.question.trim(); if (!q.endsWith('?')) q += '?'; q = q[0].toUpperCase() + q.slice(1);
      const id = 'L' + Date.now().toString(36); B.questions.push({ id, q }); st[id] = [1, 1];
      if (opts.notFor) { const s2 = B.stats[opts.notFor] = B.stats[opts.notFor] || {}; s2[id] = [0, 1]; }
    }
    B.plays = B.plays || {}; B.plays[name] = (B.plays[name] || 0) + 1; saveBrain(B);
  }
  // what a thing would say to a question (for "you guess mine")
  const reply = (o, qid) => { const p = o.p[qid]; return p >= .7 ? 'y' : p <= .3 ? 'n' : 'd'; };
  return { parse, kb, session, learn, reply, brain, ANS, reset() { store.set('twenty.brain', { objects: [], questions: [], stats: {}, plays: {} }); } };
})();

registerGame({
  id: 'twenty', name: '20 Questions', tag: '1,000 things', desc: 'Think of almost anything — an orchid, a ferret, a battleship — and I’ll guess it. Or I think of one and you guess. I learn from every game.',
  art: () => `<svg viewBox="0 0 100 100"><path d="M14 18h56a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H42l-14 12V60H14a8 8 0 0 1-8-8V26a8 8 0 0 1 8-8z" fill="#fff"/><text x="42" y="49" font-family="Bungee,Impact" font-size="26" text-anchor="middle" fill="#ff5c93">20?</text><path d="M58 52h30a6 6 0 0 1 6 6v18a6 6 0 0 1-6 6h-6v10l-10-10H58a6 6 0 0 1-6-6V58a6 6 0 0 1 6-6z" fill="#f2c14e"/><text x="73" y="74" font-size="16" text-anchor="middle">🚢</text></svg>`,
  how: `<p><b>I guess yours:</b> think of almost anything — an animal, food, plant, object, vehicle, place, job, body part or something from a story. I know about 1,000 things. Answer <b>Yes</b>, <b>Probably</b>, <b>Don’t know</b>, <b>Probably not</b> or <b>No</b>. It’s fine to be unsure — or even a bit wrong — I weigh the evidence rather than ruling things out. I get 20 questions and 3 guesses. If you stump me, teach me and I’ll remember.</p><p><b>You guess mine:</b> I think of something. Search for questions to ask, then make a guess. The teacher shows the smartest question — the one that gives the most information.</p>`,
  create(host, opts) {
    const root = el('div', { class: 'tq' }); host.appendChild(root);
    const paint = () => { const K = kitVal('twenty'); root.style.setProperty('--bub', K.bubble); root.style.setProperty('--bubink', K.ink); }; paint();
    let mode = store.get('twenty.mode', 'guess'), limit = 20, S2 = null, cur = null, wrong = 0, over = false, hintsUsed = 0, showHint = false, lastGuess = null, secret = null, asked = 0, guessed = [], qFilter = '';
    opts.innerHTML = `<label>Mode</label><div class="seg" id="tqM"><button data-m="guess">I guess yours</button><button data-m="you">You guess mine</button></div><button class="btn sm" id="tqForget">Forget what I learned</button>`;
    $('#tqM', opts).onclick = e => { const b = e.target.closest('button'); if (b) { mode = b.dataset.m; store.set('twenty.mode', mode); newGame(); } };
    $('#tqForget', opts).onclick = () => { if (confirm('Forget everything I’ve learned from your games?')) { TQ.reset(); toast('Forgotten'); newGame(); } };
    const article = n => /^[aeiou]/i.test(n) ? 'an' : 'a';
    const nq = () => S2 ? S2.answers.length : 0;
    function newGame() {
      $$('#tqM button', opts).forEach(b => b.classList.toggle('on', b.dataset.m === mode)); $$('.win', host).forEach(w => w.remove());
      S2 = TQ.session(); limit = 20; wrong = 0; over = false; hintsUsed = 0; showHint = false; lastGuess = null; asked = 0; guessed = []; qFilter = '';
      if (mode === 'guess') intro(); else { const pool = S2.objs.filter(o => !o.learned); secret = pool[rnd(pool.length)]; youTurn(); }
      stats(); coach();
    }
    const stats = () => $('#gStats').innerHTML = mode === 'guess' ? `<span>Questions <b>${nq()}/${limit}</b></span><span>Guesses <b>${wrong}/${limit > 20 ? 5 : 3}</b></span>` : `<span>Questions <b>${asked}/20</b></span>`;
    // ---------- I guess yours ----------
    function intro() {
      const n = S2.objs.length;
      root.innerHTML = `<div class="tqbub big">Think of <b>almost anything</b> — an animal, a food, a plant, an object, a vehicle, a place, a job, a body part, or something from a story. Keep it secret!<div class="tqsmall">I know about ${n.toLocaleString()} things — orchids, ferrets, battleships… and I learn from every game.</div></div><div class="tqemo">${shuffle(S2.objs.slice()).slice(0, 36).map(o => o.emoji).join(' ')}</div><div class="tqbtns"><button class="btn primary" data-go>I’ve got one</button></div>`;
      $('[data-go]', root).onclick = ask;
    }
    function decide() {
      const tp = S2.top(2), b = S2.best();
      if (tp[0].pr >= .85 || nq() >= limit || !b || b.gain < .02 || (tp[0].pr > .55 && tp[0].pr > tp[1].pr * 6)) return { guess: tp[0].o };
      return { q: b };
    }
    function thinking() {
      const tp = S2.top(6);
      return `<div class="tqthink"><span class="tqsmall">What I’m thinking (${S2.fitting().toLocaleString()} still possible):</span><div class="tqtop">${tp.map(t => `<div><span>${t.o.emoji} ${esc(t.o.name)}</span><i style="width:${Math.max(2, Math.round(t.pr * 100))}%"></i><b>${Math.round(t.pr * 100)}%</b></div>`).join('')}</div></div>`;
    }
    function ask() {
      stats(); const d = decide(); if (d.guess) return guess(d.guess);
      cur = d.q;
      root.innerHTML = `<div class="tqcount">Question ${nq() + 1} of ${limit}${limit > 20 ? ' (bonus round)' : ''}</div><div class="tqbub big">${esc(cur.q.q)}</div>
        <div class="tqbtns five"><button class="btn primary" data-a="y">Yes</button><button class="btn" data-a="py">Probably</button><button class="btn" data-a="d">Don’t know</button><button class="btn" data-a="pn">Probably not</button><button class="btn" data-a="n">No</button></div>
        ${nq() ? '<div class="tqbtns"><button class="btn sm" data-undo>↶ Change my last answer</button></div>' : ''}${thinking()}`;
      root.querySelector('.five').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; S2.answer(cur.q.id, b.dataset.a); beep('tick'); ask(); };
      root.querySelector('[data-undo]')?.addEventListener('click', () => { S2.undo(); ask(); });
      coach();
    }
    function guess(o) {
      lastGuess = o.name; stats();
      root.innerHTML = `<div class="tqcount">Guess ${wrong + 1} of ${limit > 20 ? 5 : 3} · after ${nq()} question${nq() === 1 ? '' : 's'}</div><div class="tqbub big">Is it… <span class="tqbig">${o.emoji}</span> <b>${esc(article(o.name))} ${esc(o.name)}</b>?</div><div class="tqbtns"><button class="btn primary" data-a="y">Yes!</button><button class="btn" data-a="n">No</button></div>${thinking()}`;
      root.querySelector('.tqbtns').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return;
        if (b.dataset.a === 'y') { over = true; TQ.learn(o.name, S2.answers); beep('win'); award('twenty', 'I guessed', { stars: 1 }); root.innerHTML = `<div class="tqbub big">Got it in <b>${nq()}</b> question${nq() === 1 ? '' : 's'}! ${o.emoji}<div class="tqsmall">I’ve updated what I know about ${esc(o.name)}s from your answers.</div></div><div class="tqbtns"><button class="btn primary" data-again>Play again</button><button class="btn" data-sw>Now you guess mine</button></div>`; root.querySelector('[data-again]').onclick = newGame; root.querySelector('[data-sw]').onclick = () => { mode = 'you'; store.set('twenty.mode', mode); newGame(); }; coach(); return; }
        wrong++; S2.reject(o.name); stats(); if (wrong >= (limit > 20 ? 5 : 3)) return stumped(); ask(); };
      coach();
    }
    function stumped() {
      over = true; beep('win'); const r = award('twenty', 'Stumped me', { stars: 3 });
      const names = S2.objs.map(o => o.name);
      root.innerHTML = `<div class="tqbub big">You stumped me! 🎉 <span class="tqsmall">+${r.earned} ★</span>What were you thinking of?</div><div class="tqform"><input id="tqName" list="tqNames" placeholder="e.g. zebra" maxlength="40"><datalist id="tqNames">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist><input id="tqQ" placeholder="Optional: a yes/no question that’s YES for it but NO for ${esc(article(lastGuess || ''))} ${esc(lastGuess || '')}" maxlength="90"><button class="btn primary" id="tqTeach">Teach me</button><button class="btn" data-again>Skip</button></div>${limit === 20 ? '<div class="tqbtns"><button class="btn" data-more>Or give me 5 more questions and 2 more guesses</button></div>' : ''}`;
      root.querySelector('[data-more]')?.addEventListener('click', () => { over = false; limit = 25; ask(); });
      root.querySelector('[data-again]').onclick = newGame;
      $('#tqTeach', root).onclick = () => { const n = $('#tqName', root).value; if (!n.trim()) { toast('Type what it was'); return; } const known = names.includes(n.trim().toLowerCase()); TQ.learn(n, S2.answers, { question: $('#tqQ', root).value, notFor: lastGuess, like: S2.top(5) }); T.note(known ? `Thanks! I already knew <b>${esc(n.trim())}</b>, but I’ve corrected what I know about it from your answers.` : `Learned something new: <b>${esc(n.trim())}</b>${$('#tqQ', root).value.trim() ? ', plus a new question' : ''}. I’ll remember it on this device.`); toast('Thanks — I’ve learned it!'); newGame(); };
      setTimeout(() => $('#tqName', root)?.focus(), 50); coach();
    }
    // ---------- you guess mine ----------
    const ANSWORD = { y: 'Yes', n: 'No', d: 'Sometimes / it depends' };
    function youTurn() {
      const reveal = (S.teacher === 'live' || showHint) && S.teacher !== 'off'; const sug = S2.best(6) || [];
      const askedIds = new Set(S2.answers.map(a => a[0]));
      const f = qFilter.toLowerCase(); let list = S2.qs.filter(q => !askedIds.has(q.id) && (!f || q.q.toLowerCase().includes(f)));
      if (!f) list = [...sug.map(s => s.q), ...list.filter(q => !sug.some(s => s.q.id === q.id))];
      root.innerHTML = `<div class="tqcount">You’ve used ${asked} of 20 questions</div><div class="tqbub">I’m thinking of something. Ask me questions, then make your guess!</div>
        <div class="tqasked">${S2.answers.map(([id, a]) => `<span class="tqa ${a}">${esc(S2.qs.find(q => q.id === id).q)} <b>${ANSWORD[a]}</b></span>`).join('')}${guessed.map(g => `<span class="tqa n">Is it ${esc(g)}? <b>No</b></span>`).join('')}</div>
        <div class="tqbtns"><button class="btn primary" data-guess>🎯 Make a guess</button></div>
        <input class="tqsearch" id="tqSearch" placeholder="Search ${S2.qs.length} questions… (e.g. colour, legs, sea)" value="${esc(qFilter)}">
        <div class="tqqs">${list.slice(0, f ? 80 : 30).map(q => `<button class="tqq ${reveal && sug[0] && sug[0].q.id === q.id ? 'hint' : ''}" data-q="${q.id}">${esc(q.q)}</button>`).join('')}</div>`;
      root.querySelector('.tqqs').onclick = e => { const b = e.target.closest('[data-q]'); if (!b || over) return; const a = TQ.reply(secret, b.dataset.q); S2.answer(b.dataset.q, a); asked++; qFilter = ''; beep('tick'); showHint = false; stats(); if (asked >= 20) return reveal20(false); youTurn(); };
      root.querySelector('[data-guess]').onclick = () => pick();
      const si = $('#tqSearch', root); si.oninput = () => { qFilter = si.value; const pos = si.selectionStart; youTurn(); const s3 = $('#tqSearch', root); s3.focus(); s3.setSelectionRange(pos, pos); };
      coach();
    }
    function pick(filter = '') {
      const tp = S2.top(S2.objs.length); const f = filter.toLowerCase();
      const list = (f ? tp.filter(t => t.o.name.includes(f)) : tp.slice(0, 48)).slice(0, 60);
      root.innerHTML = `<div class="tqbub">Tap your guess. <span class="tqsmall">${f ? 'Search results' : 'The things that fit your answers best are first'} — or search all ${S2.objs.length.toLocaleString()}.</span></div><input class="tqsearch" id="tqFind" placeholder="Type a name…" value="${esc(filter)}"><div class="tqpick">${list.map(t => `<button data-n="${esc(t.o.name)}" class="${guessed.includes(t.o.name) ? 'gone' : ''}"><span>${t.o.emoji}</span>${esc(t.o.name)}</button>`).join('')}</div><div class="tqbtns"><button class="btn" data-back>← Back to questions</button></div>`;
      root.querySelector('[data-back]').onclick = youTurn;
      const fi = $('#tqFind', root); fi.oninput = () => { const v = fi.value, pos = fi.selectionStart; pick(v); const f2 = $('#tqFind', root); f2.focus(); f2.setSelectionRange(pos, pos); };
      root.querySelector('.tqpick').onclick = e => { const b = e.target.closest('[data-n]'); if (!b || guessed.includes(b.dataset.n)) return; asked++; stats(); if (b.dataset.n === secret.name) return reveal20(true); guessed.push(b.dataset.n); S2.reject(b.dataset.n); beep('bad'); toast(`No, it isn’t ${article(b.dataset.n)} ${b.dataset.n}`); if (asked >= 20) return reveal20(false); youTurn(); };
    }
    function reveal20(won) {
      over = true;
      if (won) { const r = award('twenty', 'You guessed', { stars: Math.max(1, Math.ceil((21 - asked) / 4)), hints: hintsUsed }); beep('win'); winOverlay(host, { title: 'You got it!', lines: [`It was ${article(secret.name)} ${secret.name} ${secret.emoji}`, `${asked} question${asked > 1 ? 's' : ''} used`], earned: r.earned, again: newGame }); }
      else { beep('bad'); winOverlay(host, { title: 'Out of questions', lines: [`I was thinking of ${article(secret.name)} ${secret.name} ${secret.emoji}`, 'Tip: ask the questions that split what’s left in half.'], earned: 0, again: newGame }); }
      coach();
    }
    // ---------- teacher ----------
    function coach(why) {
      if (teacherOffMsg(why)) { if (mode === 'you' && !over) youTurn(); return; }
      if (!S2) return; const tp = S2.top(2);
      if (mode === 'guess') {
        const g = cur && !over ? cur.gain : null;
        T.set({ stage: '20 Questions · I guess yours', steps: null, prog: nq() / 20,
          msg: nq() ? `My best idea is <b>${tp[0].o.emoji} ${esc(tp[0].o.name)}</b> at ${Math.round(tp[0].pr * 100)}%. Each answer shifts the odds for every one of the ${S2.objs.length.toLocaleString()} things — a wrong answer only lowers the odds, it doesn’t rule anything out.${g != null ? ` I picked this question because it gives the most information: <b>${g.toFixed(2)} bits</b> (1 bit = a perfect half-and-half split).` : ''}` : `Think of something and tap <b>I’ve got one</b>. I choose each question to learn as much as possible — 20 perfect questions could tell apart a million things.`,

});
page('Q-001', 'twenty', 'How to win 20 Questions', '20 questions twenty guessing strategy split half binary bits information', `<p>The best question splits what’s left <b>in half</b>. If half the things would say yes and half no, every answer throws away half — and 20 halvings can tell apart a million things (2²⁰ = 1,048,576). That perfect split is worth <b>1 bit</b> of information.</p><p>Start broad (“Is it alive?”, “Is it made by people?”), then narrow down. Avoid questions where almost everything gives the same answer. In “You guess mine”, the teacher highlights the question worth the most bits.</p>`);
page('Q-002', 'twenty', 'How the computer guesses', '20 questions probability bayes learn teach probably dont know wrong answer', `<p>I know about 1,000 things, and for each one I store how likely it is to get a “yes” to every question. Each answer — Yes, Probably, Don’t know, Probably not, No — updates my confidence in every thing at once (this is <b>Bayes’ rule</b>). A wrong answer just lowers the odds, so one mistake won’t ruin the game.</p><p>I choose each question for the most <b>information gain</b>, and I guess when one thing is far more likely than the rest. After every game I adjust my numbers from your answers, and if you stump me you can teach me something new.</p>`);

  const deg = (sc, root, d, oct = 0) => { const n = sc.length, i = ((d % n) + n) % n; return root + sc[i] + 12 * (Math.floor(d / n) + oct); };

})();

<script>
/* =====================================================================

const A = s => `<span class="alg">${s.replace(/'/g, '′')}</span>`;
const practiceCube = (stage, size) => () => { if (curId === 'cube' && GAMES.cube.practice) GAMES.cube.practice(stage, size); else openGame('cube', { practice: stage, size }); };
page('L-001', 'all', 'How the teacher works', 'teacher live ask off hint mode professor pip help', `<p>Professor Pip sits beside every table. Pick how much help you want with the switch at the top of his card (also in Settings):</p><ul><li><b>Live</b> — he watches every move, highlights the next one on the puzzle, and replans instantly if you go your own way.</li><li><b>Ask</b> — he explains the current stage but only shows a move when you tap <b>💡 Hint</b>.</li><li><b>Off</b> — you're on your own.</li></ul><p><b>▶ Show me</b> plays one move for you; <b>⏭ Do this step</b> plays the rest of the current step. Solving without hints earns bonus stars.</p>`);
page('L-002', 'all', 'Stars and the shop', 'stars shop buy earn currency felt colours scheme bonus', `<p>Every solve earns stars — harder puzzles earn more, and solving without any hints adds a 50% bonus. Spend them in the 🛍 shop on cube colour schemes, table felts and slide-puzzle tiles. Nothing costs real money.</p>`);
page('L-003', 'all', 'Touch controls', 'touch tap swipe drag pinch zoom rotate phone tablet gesture', `<p><b>Cube:</b> swipe a sticker to turn its row; drag the felt to look around; two fingers twist the view.<br><b>Slide puzzle:</b> tap a tile in line with the gap, or swipe.<br><b>Jigsaw:</b> drag pieces, tap to rotate (when on), pinch to zoom, drag the felt to pan.<br><b>Hanoi and Ball Sort:</b> tap to pick up, tap to drop.</p>`);

page('C-000', 'cube', 'Cube notation', 'notation letters R U F L D B prime clockwise counter-clockwise move names M E S slice', `<p>Each letter is a face: <b>U</b>p, <b>D</b>own, <b>F</b>ront, <b>B</b>ack, <b>R</b>ight, <b>L</b>eft. A letter alone means turn that face a quarter <b>clockwise as you look straight at it</b>. A prime (${A("R'")}) means counter-clockwise; a 2 (${A('R2')}) means a half turn.</p><p>In the Parlour the faces are named by their centre colour: yellow top, white bottom, green front, blue back, orange right, red left. Centres never move, so a face is always its centre's colour.</p><p><b>M, E, S</b> are the middle slices (M follows L, E follows D, S follows F).</p>`);
page('C-001', 'cube', 'Step 1: White cross', 'cross white edges daisy bottom plus first step stage 1', `<p>Make a white <b>plus</b> on the white face, with each edge's other colour matching the centre beside it (green next to green, and so on).</p><p>Find a white edge, turn the side it's on so it lines up over its matching centre, then turn that face twice to bring it down. If the white sticker is facing sideways, the teacher shows a short 3–4 move fix.</p><p>This step is intuitive — no algorithm. Watch how the teacher does it and you'll pick up the patterns.</p>`).practice = { label: 'Practise the cross', fn: practiceCube(0, 3) };
page('C-002', 'cube', 'Step 2: White corners', 'corners white first layer R U R prime U prime sexy move trick insert corner stage 2', `<p>Turn the top until a white corner sits right above its home (between its three colours). Hold that spot at front-right and repeat ${A("R U R' U'")} until the corner drops in with white on the bottom. It takes 1, 3 or 5 goes.</p><p>If a corner is already in the bottom layer but wrong, do ${A("R U R' U'")} once to pop it out to the top.</p>`).practice = { label: 'Practise white corners', fn: practiceCube(1, 3) };
page('C-003', 'cube', 'Step 3: Middle layer', 'middle layer second layer edges insert right left algorithm stage 3', `<p>Find a top-layer edge <b>without yellow</b>. Turn the top until its front colour matches the centre below it. If it needs to go right: ${A("U R U' R' U' F' U F")}. If left: ${A("U' L' U L U F U' F'")}.</p><p>If an edge is stuck in the middle layer the wrong way round, insert any top edge into its slot to pop it out.</p>`).practice = { label: 'Practise the middle layer', fn: practiceCube(2, 3) };
page('C-004', 'cube', 'Step 4: Yellow cross', 'yellow cross dot line L shape F R U R prime U prime F prime stage 4 top', `<p>Look at the yellow top. You'll see a dot, an L, a line, or a cross. Do ${A("F R U R' U' F'")}:</p><ul><li><b>Dot:</b> do it once to get an L.</li><li><b>L:</b> hold it in the back-left (like 9 o'clock to 12 o'clock), then do it.</li><li><b>Line:</b> hold it horizontal, then do it.</li></ul>`).practice = { label: 'Practise the yellow cross', fn: practiceCube(3, 3) };
page('C-005', 'cube', 'Step 5: Yellow face (Sune)', 'yellow face sune corners orient top R U R prime U R U2 R prime fish stage 5', `<p>Now make the whole top yellow with <b>Sune</b>: ${A("R U R' U R U2 R'")}.</p><p>If exactly one corner is yellow on top (a "fish"), hold it at front-left and do Sune. Otherwise, hold a yellow sticker facing left on the front-left corner and do Sune. Repeat until the top is all yellow.</p>`).practice = { label: 'Practise the yellow face', fn: practiceCube(4, 3) };
page('C-006', 'cube', 'Step 6: Yellow corners (A-perm)', 'corners position headlights A perm permute stage 6', `<p>Look for <b>headlights</b>: two corners on one side with the same colour. Hold them at the back and do the A-perm: ${A("R' F R' B2 R F' R' B2 R2")}. If there are no headlights anywhere, do it once from any side and they appear.</p>`).practice = { label: 'Practise yellow corners', fn: practiceCube(5, 3) };
page('C-007', 'cube', 'Step 7: Last edges (U-perm)', 'last edges U perm finish final step 7 solved bar', `<p>Find a side that's fully solved (a bar) and hold it at the back. Then do the U-perm: ${A("R U' R U R U R U' R' U' R2")}. If the edges go the wrong way, do it again. No solved side? Do it once from anywhere.</p><p>Turn the top to line everything up — solved!</p>`).practice = { label: 'Practise the last edges', fn: practiceCube(6, 3) };
page('C-008', 'cube', 'The 2×2 cube', '2x2 pocket cube corners only three steps', `<p>A 2×2 is a 3×3 with only the corners. Use the same moves: build the white corners with ${A("R U R' U'")}, make the top yellow with Sune ${A("R U R' U R U2 R'")}, then cycle the top corners home with the A-perm. Three steps and you're done.</p>`).practice = { label: 'Practise a 2×2', fn: practiceCube(0, 2) };

page('S-001', 'slide', 'The row-and-column method', 'slide method row column strategy reduce 15 puzzle how to solve', `<p>Never try to solve everything at once. Finish the <b>top row</b>, then the <b>left column</b>. You never touch those again, so what's left is a smaller puzzle. Repeat until a 3×3 is left, then solve that.</p><p>To move one tile, walk the gap around in front of it, then slide the tile into the gap. Repeat — the tile "rolls" toward its home.</p>`);
page('S-002', 'slide', 'The last tile of a row', 'last tile row corner trick tricky two tiles', `<p>The last tile of a row is the hard one: there's no room to bring it in from the side. Put it <b>directly below</b> its spot, move the tile before it down one, slide the last tile up, then bring the other back. The teacher shows the exact loop — follow it a few times and it clicks.</p>`);
page('S-003', 'slide', 'Picture mode', 'picture photo image slide upload', `<p>Switch Tiles to <b>Picture</b> and the tiles show a picture instead of numbers. Tap <b>📷 Use my photo</b> to use one of yours — it's cropped square. Small numbers stay in the corner so the teacher can still point at tiles.</p>`);

page('J-001', 'jigsaw', 'Starting a jigsaw', 'jigsaw edges corners frame start strategy border', `<p>Do what puzzlers do: find the <b>four corners</b>, then all the <b>edge pieces</b> (one flat side). Tap 🧩 <b>Edges</b> and they're sorted into the empty frame, side by side, corners first. Build the frame, then fill it in by colour.</p>`);
page('J-002', 'jigsaw', 'Using your own photo', 'photo upload picture image camera own 50 100 500 pieces count', `<p>Tap <b>📷 Use my photo</b> and pick any picture (on a phone you can take one there and then). Choose <b>50</b>, <b>100</b> or <b>500</b> pieces. The picture is cut into real interlocking pieces — every one is different. Your photo stays on your device.</p>`);
page('J-003', 'jigsaw', 'Snapping, rotating and zooming', 'snap rotate rotation zoom pinch pan ghost peek', `<p>Pieces that belong together snap when you drop them close, and move as one. A piece dropped near its spot locks into the frame. Turn on <b>Rotation</b> for a harder puzzle — then tap a piece to turn it. Pinch or scroll to zoom. <b>Ghost image</b> shows a faint guide in the frame; <b>👁 Peek</b> shows the full picture.</p>`);

page('O-001', 'lights', 'Chase the lights', 'lights out chase method rows press below', `<p>Work down the board: for every lit square in a row, press the square <b>directly below</b> it. That clears the row. When you reach the bottom, only the bottom row has lights.</p><p>Then press a few squares on the <b>top row</b> (the pattern depends on what's left) and chase down again. The teacher's dots show the exact presses. Order never matters, and pressing a square twice (in classic mode) cancels out.</p>`);
page('H-001', 'hanoi', 'Hanoi by recursion', 'hanoi recursion tower disks shortest 2 n minus 1 strategy', `<p>To move a tower of <i>n</i> disks: move the top <i>n − 1</i> to the spare peg, move the biggest disk, then move the <i>n − 1</i> back on top. Each smaller tower is the same problem again.</p><p>Shortcut for doing it by hand: the smallest disk moves every other turn, always in the same direction round the pegs (right for an odd number of disks, left for even). On the other turns there's only one legal move.</p>`);
page('F-001', 'flood', 'Flood strategy', 'flood colour strategy centre grow', `<p>Push toward the <b>centre</b> first — from there the board is closest. After that, take whichever colour grows you most. Look out for a colour you can <b>erase completely</b>: that's always a good move, because you'll never need it again.</p>`);
page('B-001', 'balls', 'Ball Sort strategy', 'ball sort tubes strategy empty spare plan', `<p>Empty tubes are your most valuable resource. Fill one only when it starts a colour you can finish. Move whole runs of the same colour together, and work on the colour that's closest to the top of the most tubes.</p>`);

page('M-001', 'maze', 'The right-hand rule', 'maze right hand rule wall follower lost strategy', `<p>Put your right hand on the wall and never let go: at every junction take the right-most opening. In a maze whose start and exit are on the outside edge, this always gets you out — it may not be the shortest way, but it never gets lost.</p><p>The teacher's gold dots show the <b>shortest</b> way, worked out by searching every corridor at once (breadth-first search).</p>`);
page('M-002', 'maze', 'Maze levels and fog', 'maze levels stroll easy medium hard expert fog dead end loops junction hexagon save spot jump back', `<p><b>Stroll</b> and <b>Easy</b> mazes have one long winding path. <b>Medium</b> and <b>Hard</b> branch much more and have a few loops, so there's more than one way through. <b>Expert</b> is big and foggy: you only see what you've been near.</p><p>Spot a <b>dead end</b> early — if a corridor only leads one way, it's not the path. Every junction is a hexagon ⬢. Once you've passed through one it fills in and becomes a <b>save spot</b>: tap it any time to zip straight back there and try another way.</p>`);
page('A-001', 'arcade', 'Match shapes and what they make', 'glitters sparkles arcade match shapes special blaster bomb prism four five L T square 2x2 wild gnomes', `<p>The shape of your match decides what you get:</p><ul><li><b>3 in a line</b> — just clears.</li><li><b>4 in a line</b> — a <b>Blaster</b> (striped gem). Clearing it wipes a full row or column.</li><li><b>T shape</b> (lines crossing in the middle) — a <b>Bomb</b>. Clears the 3×3 around it.</li><li><b>L shape</b> (lines meeting at a corner) — <b>4 gnomes</b> run out and smash 4 gems. They choose helpful ones: specials to set off, gems whose fall makes a new match, and number gems.</li><li><b>2×2 square</b> — a <b>Wild gem</b> ✦ that counts as every colour, so it can finish any line.</li><li><b>5 in a line</b> — a <b>Prism</b>. Swap it with any gem to clear every gem of that colour.</li></ul>`);
page('A-002', 'arcade', 'Numbers, combos and mega swaps', 'glitters sparkles arcade number gems multiplier combo cascade storm mega swap wild', `<p><b>Number gems</b> (×2, ×3, ×5) multiply the points of the match they're in. Put <b>two or more</b> numbers in one match and a <b>Number Storm</b> zaps extra gems.</p><p>When falling gems make new matches by themselves, that's a <b>combo</b> — each step scores more. Match low on the board to set them off.</p><p><b>Swap two specials together:</b> Blaster + Blaster = cross, Bomb + Bomb = mega bomb, Blaster + Bomb = giant cross, Prism + special = every gem of that colour becomes that special, Prism + Wild = the most common colour vanishes, Prism + Prism = the whole board. A Wild gem swapped with an ordinary gem just joins whatever line it lands in.</p>`);
page('K-001', 'stack', 'Stacking basics', 'stack blocks lines clear flat holes hold tetris basics', `<p>Keep your stack <b>flat and low</b>. Avoid <b>holes</b> (gaps covered by blocks) — they stop rows from clearing. Leave one column open at the edge, and drop a long I-block in to clear <b>four lines at once</b> for big points.</p><p><b>Hold</b> saves a block for later — great for keeping an I-block ready. The faint outline shows where your block will land.</p>`);
page('K-002', 'stack', 'Beating the AI', 'stack vs ai junk garbage rows send combo battle zen solo modes', `<p>In <b>Vs AI</b>, clearing 2 lines sends 1 junk row, 3 lines sends 2, and 4 lines sends 4. Back-to-back clears (combos) and clearing the whole board send even more. Junk waiting to hit you shows as a red bar; clearing lines first cancels it out.</p><p><b>Solo</b> speeds up every 10 lines. <b>Zen</b> never ends — reach the top and the stack simply melts away.</p>`);
page('L-004', 'all', 'The shop, kits and dyes', 'shop kits dye colours felt buy reset turn off on custom', `<p>Every game has its own tab in the 🛍 shop and remembers its own look.</p><ul><li><b>Colour kits</b> are premade combos. Buy once; turn on or off whenever you like.</li><li><b>Table felts</b> are bought once and can go on any table; each table keeps its own.</li><li>A <b>dye</b> lets you pick your own colours for one game. Only the colours you change are dyed. They're remembered until you reset them, and switching them off and on is free — but changing them again takes another dye.</li></ul>`);
page('L-005', 'all', 'The jukebox', 'music jukebox tracks songs volume play pause', `<p>Tap ♪ at the top for the jukebox: ten original tracks, from the smooth <b>Neon Lounge</b> to the drum-free <b>Zen Garden</b>. Pick one, skip, or set the volume. The music is composed live in your browser, so it works offline, and it keeps playing as you move between tables.</p>`);
</script>
