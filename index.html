        <div class="tqqs">${list.slice(0, f ? 80 : 30).map(q => `<button class="tqq ${reveal && sug[0] && sug[0].q.id === q.id ? 'hint' : ''}" data-q="${q.id}">${esc(q.q)}</button>`).join('')}</div>`;
      root.querySelector('.tqqs').onclick = e => { const b = e.target.closest('[data-q]'); if (!b || over) return; const a = TQ.reply(secret, b.dataset.q), r = S2.rate(b.dataset.q), best = S2.best(1, true), before = S2.fitting(); S2.answer(b.dataset.q, a); rateNote(b.dataset.q, a, r, best, before); asked++; qFilter = ''; beep('tick'); showHint = false; stats(); if (asked >= 20) return reveal20(false); youTurn(); };
      root.querySelector('[data-guess]').onclick = () => pick();
      const si = $('#tqSearch', root); si.oninput = () => { qFilter = si.value; const pos = si.selectionStart; youTurn(); const s3 = $('#tqSearch', root); s3.focus(); s3.setSelectionRange(pos, pos); };
      coach();
    }
    // teach the strategy: how good was the question the player just asked?
    let myBits = [], bestBits = [];
    function rateNote(qid, a, r, best, before) {
      const q = S2.qs.find(x => x.id === qid).q, yes = Math.round(r.py * 100), after = S2.fitting(); myBits.push(r.gain); if (best) bestBits.push(best.gain);
      const verdict = r.gain >= .75 ? '🌟 <b>Excellent</b> — close to a perfect half-and-half split.' : r.gain >= .4 ? '👍 <b>Good</b> — it cut the field a lot.' : r.gain >= .12 ? '🙂 <b>Narrow</b> — fine near the end, but early on a broader question tells you more.' : '😬 <b>Almost no information</b> — nearly everything still possible would answer the same way.';
      const tip = asked <= 6 && r.py < .12 && r.gain < .3 ? ' <i>Tip: save specific questions (and guesses) for when only a few things are left.</i>' : best && best.gain - r.gain > .35 ? ` <i>Better: “${esc(best.q.q)}” would have split it ${Math.round(best.py * 100)}/${100 - Math.round(best.py * 100)}.</i>` : '';
      if (S.teacher !== 'off') T.note(`“${esc(q)}” → <b>${ANSWORD[a]}</b>. About ${yes}% of what was possible would say yes. ${verdict} (${r.gain.toFixed(2)} bits · ${before.toLocaleString()} → ${after.toLocaleString()} things left)${tip}`);
    }
    function pick(filter = '') {
      const tp = S2.top(S2.objs.length); const f = filter.toLowerCase();
      const list = (f ? tp.filter(t => t.o.name.includes(f) || TQ_also(t.o.name).some(a => a.includes(f)) || t.o.name === TQ_canon(f)) : tp.slice(0, 48)).slice(0, 60);
      root.innerHTML = `<div class="tqbub">Tap your guess. <span class="tqsmall">${f ? 'Search results' : 'The things that fit your answers best are first'} — or search all ${S2.objs.length.toLocaleString()}.</span></div><input class="tqsearch" id="tqFind" placeholder="Type a name…" value="${esc(filter)}"><div class="tqpick">${list.map(t => `<button data-n="${esc(t.o.name)}" class="${guessed.includes(t.o.name) ? 'gone' : ''}"><span>${t.o.emoji}</span>${esc(t.o.name)}</button>`).join('')}</div><div class="tqbtns"><button class="btn" data-back>← Back to questions</button></div>`;
      root.querySelector('[data-back]').onclick = youTurn;
      const fi = $('#tqFind', root); fi.oninput = () => { const v = fi.value, pos = fi.selectionStart; pick(v); const f2 = $('#tqFind', root); f2.focus(); f2.setSelectionRange(pos, pos); };
      root.querySelector('.tqpick').onclick = e => { const b = e.target.closest('[data-n]'); if (!b || guessed.includes(b.dataset.n)) return; asked++; stats(); if (b.dataset.n === secret.name) return reveal20(true); guessed.push(b.dataset.n); S2.reject(b.dataset.n); beep('bad'); toast(`No, it isn’t ${article(b.dataset.n)} ${b.dataset.n}`); if (asked >= 20) return reveal20(false); youTurn(); };
    }
    function reveal20(won) {
      over = true;
      const avg = myBits.length ? myBits.reduce((x, y) => x + y, 0) / myBits.length : 0, bavg = bestBits.length ? bestBits.reduce((x, y) => x + y, 0) / bestBits.length : 0;
      const card = myBits.length ? `Your questions averaged <b>${avg.toFixed(2)} bits</b> each (a perfect yes/no split is 1.00; the best available averaged ${bavg.toFixed(2)}).` : '';
      if (card && S.teacher !== 'off') T.note('📊 ' + card + ' ' + (avg >= .7 ? 'That’s expert play.' : avg >= .45 ? 'Solid — aim for questions about half the things would say yes to.' : 'Try broader questions first: “Is it alive?”, “Is it made by people?”, “Is it bigger than a person?”'));
      if (won) { const r = award('twenty', 'You guessed', { stars: Math.max(1, Math.ceil((21 - asked) / 4)), hints: hintsUsed }); beep('win'); winOverlay(host, { title: 'You got it!', lines: [`It was ${article(secret.name)} ${secret.name} ${secret.emoji}`, `${asked} question${asked > 1 ? 's' : ''} used`], earned: r.earned, again: newGame }); }
      else { beep('bad'); winOverlay(host, { title: 'Out of questions', lines: [`I was thinking of ${article(secret.name)} ${secret.name} ${secret.emoji}`, 'Tip: ask the questions that split what’s left in half.'], earned: 0, again: newGame }); }
      coach();
    }
    // ---------- teacher ----------
    function coach(why) {
      if (teacherOffMsg(why)) { if (mode === 'you' && !over) youTurn(); return; }
      if (!S2) return; const tp = S2.top(2);
      if (mode === 'friends') {
        const b = S2.best(1, true); T.set({ stage: '20 Questions · with friends', steps: ['Start broad', 'Find the category', 'Narrow down', 'Guess'], cur: asked < 4 ? 0 : asked < 9 ? 1 : asked < 16 ? 2 : 3, prog: asked / 20,
          msg: asked < 4 ? 'Start broad: questions that about half of everything would say yes to — alive? made by people? bigger than a person?' : asked < 9 ? 'Pin down the category (animal, food, object, place, job…), then the family within it.' : asked < 16 ? 'Narrow down with features: size, colour, where it’s found, what it’s for.' : 'Guess when only a few things fit. A wrong guess costs a question.',
          next: b ? { mv: '?', how: `Coach suggests: “${esc(b.q.q)}” (${b.gain.toFixed(2)} bits)` } : null, acts: [{ label: '↻ New game', fn: () => { custom = []; fq = null; newGame(); } }, { label: '📖 Lessons', fn: () => showLessons('twenty') }] });
        return;
      }
      if (mode === 'guess') {
        const g = cur && !over ? cur.gain : null;
        T.set({ stage: '20 Questions · I guess yours', steps: null, prog: nq() / 20,
          msg: nq() ? `My best idea is <b>${tp[0].o.emoji} ${esc(tp[0].o.name)}</b> at ${Math.round(tp[0].pr * 100)}%. Each answer shifts the odds for every one of the ${S2.objs.length.toLocaleString()} things — a wrong answer only lowers the odds, it doesn’t rule anything out.${g != null ? ` I picked this question because it gives the most information: <b>${g.toFixed(2)} bits</b> (1 bit = a perfect half-and-half split).` : ''}` : `Think of something and tap <b>I’ve got one</b>. I choose each question to learn as much as possible — 20 perfect questions could tell apart a million things.`,
          next: null, acts: [{ label: '↻ New game', fn: newGame }, { label: '📖 Lessons', fn: () => showLessons('twenty') }] });
      } else {
        const b = S2.best(1, true); const reveal = S.teacher === 'live' || showHint; const fit = S2.fitting();
        T.set({ stage: '20 Questions · you guess mine', steps: null, prog: asked / 20,
          msg: `About <b>${fit.toLocaleString()}</b> thing${fit > 1 ? 's' : ''} still fit your answers. The smartest question is the one that splits them closest to half.` + (reveal ? '' : '<br><span class="muted">Tap 💡 Hint for the smartest question.</span>'),
          next: reveal ? (tp[0].pr > .6 ? { mv: '🎯', how: `Time to guess — it’s probably ${tp[0].o.emoji} <b>${esc(tp[0].o.name)}</b>.` } : b ? { mv: '?', how: `Ask “${esc(b.q.q)}” — worth ${b.gain.toFixed(2)} bits of information.` } : null) : null,
          acts: [{ label: '💡 Best question', fn: hint, primary: true }, { label: '↻ New game', fn: newGame }] });
      }
    }
    function hint() { hintsUsed++; hintOn(); showHint = true; if (mode === 'you' && !over) youTurn(); else coach(); }
    GAMES.twenty._dbg = { get S2() { return S2; }, get secret() { return secret; }, get asked() { return asked; }, newGame, setMode(m) { mode = m; newGame(); } };
    setTimeout(newGame, 20);
    return { hint, newGame, coach, undo() { if (mode === 'guess' && S2 && nq() && !over) { S2.undo(); ask(); } else toast('Nothing to undo'); }, restyle: paint, resize() { }, destroy() { } };
  }
});
page('Q-003', 'twenty', 'Playing 20 Questions in real life', 'rules play real life friends family car trip how to play twenty questions thinker asker', `<p><b>You need:</b> two or more people and nothing else. It’s perfect for car trips and waiting rooms.</p><ol><li>One person, the <b>thinker</b>, secretly picks something: an animal, an object, a place, a job, a food, a famous person.</li><li>Everyone else takes turns asking questions that can be answered <b>yes</b> or <b>no</b>. (“Sometimes” or “I’m not sure” is allowed when the honest answer really is in between.)</li><li>Count every question out loud. A guess (“Is it a giraffe?”) counts as one of the 20.</li><li>Guess it within 20 and the askers win; otherwise the thinker wins and becomes the asker next time.</li></ol><p>Old-style openers: the thinker says whether it’s <b>animal, vegetable or mineral</b> (living animal, plant/food, or a non-living thing) before the questions start.</p><p>Try the <b>Play with friends</b> mode: the app counts, logs every answer, suggests strong questions and rates each one.</p>`).practice = { label: 'Play with friends', fn: () => { store.set('twenty.mode', 'friends'); openGame('twenty'); } };
page('Q-004', 'twenty', 'The best first questions', 'first questions opening start broad alive bigger than breadbox man made category good questions', `<p>The first few questions should split <b>everything</b> roughly in half. Great openers:</p><ul><li>“Is it alive (or was it ever)?”</li><li>“Is it made by people?”</li><li>“Is it bigger than a person?” (the classic is “bigger than a breadbox?”)</li><li>“Would you find it in a house?”</li><li>“Can you eat it?”</li></ul><p>Bad openers are specific: “Is it a dog?” or “Is it red?” Almost everything says no, so you learn almost nothing. Save those for the end.</p>`);
page('Q-005', 'twenty', 'Halving: why 20 questions is enough', 'halving binary search bits 2 to the 20 million information keep track list narrow', `<p>Each perfect question cuts what’s possible in half. After 10 questions you’ve narrowed 1,024 possibilities to 1; after 20, over a <b>million</b> (2²⁰ = 1,048,576). That’s why 20 is plenty — if every question is good.</p><p>Keep a mental (or real) list: “alive, not an animal, eaten, sweet, grows on trees → a fruit”. Then split the fruits: “Is it bigger than your fist?”, “Is it yellow?”. Each answer should rule out lots of your list.</p><p>Watch out for questions with <b>or</b> (“Is it red or blue?”) — a yes doesn’t tell you which.</p>`);
page('Q-006', 'twenty', 'Guessing jobs and people', 'jobs job occupation person people work career guess doctor teacher firefighter questions', `<p>Once you know it’s a <b>job</b>, these questions split jobs well:</p><ul><li>“Do they need a university degree?”</li><li>“Do they mostly work outdoors?”</li><li>“Do they wear a uniform?”</li><li>“Do they help people who are hurt or in danger?”</li><li>“Do they work with their hands — building or fixing?”</li><li>“Do they work with children / animals / food / money?”</li><li>“Do they drive or fly something for the job?”</li><li>“Do they perform in front of an audience?”</li><li>“Is it a dangerous job?”</li></ul><p>For example: degree + hospital + caring → doctor, nurse or surgeon. Then “Do they operate with tools?” separates the surgeon. I know about 150 jobs, from plumber to astronaut.</p>`);
page('Q-007', 'twenty', 'Being a fair thinker', 'thinker answering fair honest typical sometimes dont know answer well choose something', `<ul><li><b>Pick something the others know.</b> “Aardvark” is fair; your neighbour’s cat isn’t.</li><li><b>Answer for the typical one.</b> Is a banana yellow? Yes — even though green ones exist.</li><li><b>Say “sometimes” honestly</b> when a question really doesn’t have one answer.</li><li><b>Don’t be sneaky-literal.</b> “Does a firefighter use water?” — yes, even if they also use foam.</li><li>If you realise you gave a wrong answer, own up straight away.</li></ul>`);
page('Q-008', 'twenty', 'When to guess', 'guess when timing narrow few left wrong guess cost endgame', `<p>Guess when only a <b>handful</b> of things still fit — two or three at most. A wrong guess wastes a question and tells you only one thing.</p><p>If two things are left, ask a question that splits <i>them</i> (“Does it have stripes?” for tiger vs lion) rather than guessing one and hoping.</p><p>Out of questions soon? Guess the most likely thing — a guess is better than an unused question.</p>`);
page('Q-009', 'twenty', 'Variations to try', 'variations animal vegetable mineral who am i botticelli guess who sticky note party game', `<ul><li><b>Animal, Vegetable or Mineral</b> — the thinker announces which before the questions.</li><li><b>Who am I?</b> — stick a famous name on someone’s forehead; they ask the questions.</li><li><b>Guess Who-style</b> — only people or characters; questions about looks and life.</li><li><b>Reverse</b> — the askers pick the category and the thinker must choose something in it.</li><li><b>Ten Questions</b> — the expert version.</li></ul>`);
page('Q-001', 'twenty', 'How to win 20 Questions (the strategy)', '20 questions twenty guessing strategy split half binary bits information', `<p>The best question splits what’s left <b>in half</b>. If half the things would say yes and half no, every answer throws away half — and 20 halvings can tell apart a million things (2²⁰ = 1,048,576). That perfect split is worth <b>1 bit</b> of information.</p><p>Start broad (“Is it alive?”, “Is it made by people?”), then narrow down. Avoid questions where almost everything gives the same answer. In “You guess mine”, the teacher highlights the question worth the most bits.</p>`);
page('Q-002', 'twenty', 'How the computer guesses', '20 questions probability bayes learn teach probably dont know wrong answer', `<p>I know about 1,000 things, and for each one I store how likely it is to get a “yes” to every question. Each answer — Yes, Probably, Don’t know, Probably not, No — updates my confidence in every thing at once (this is <b>Bayes’ rule</b>). A wrong answer just lowers the odds, so one mistake won’t ruin the game.</p><p>I choose each question for the most <b>information gain</b>, and I guess when one thing is far more likely than the rest. After every game I adjust my numbers from your answers, and if you stump me you can teach me something new.</p>`);

function MM_build(level) {
  const bp = MM.newBP(); bp.w = level.w; bp.h = level.h;
  (level.parts || []).forEach(([t, x, y, a, p, lk]) => { const P = MM.addPart(bp, t, x, y, a, p); if (lk) P.lk = lk; });
  const snapIdx = (P, k) => typeof k === 'number' ? k : MM.PARTS[P.t].snaps(P.p).findIndex(s => s.k === k || (k === 'mid' && s.k === 'hook'));
  (level.joints || []).forEach(([ia, sa, ib, sb]) => { const A = bp.parts[ia], B = bp.parts[ib]; const j = { a: A.id, sa: snapIdx(A, sa), b: B.id, sb: snapIdx(B, sb) }; j.k = MM.jointKind(MM.snapsW(A)[j.sa], MM.snapsW(B)[j.sb]); bp.joints.push(j); });
  (level.wires || []).forEach(([ia, ib]) => bp.wires.push({ a: bp.parts[ia].id, b: bp.parts[ib].id }));
  return bp;
}
// place the teacher's solution onto a challenge blueprint (used by "Show me" and the tests)
function MM_solve(level, bp, upto = Infinity) {
  (level.rot || []).forEach(([i, a]) => { bp.parts[i].a = a; });
  const added = [];
  level.sol.forEach((s, k) => {
    if (k >= upto) return; const [t, x, y, a, p, ang, snap] = s;
    if (x === 'mesh') { // a gear meshing two others
      const A = bp.parts[1], B = bp.parts[2], r = p.r, ra = A.p.r + r, rb = B.p.r + r, d = Math.hypot(B.x - A.x, B.y - A.y);
      const ax = (ra * ra - rb * rb + d * d) / (2 * d), h = Math.sqrt(Math.max(0, ra * ra - ax * ax)), ux = (B.x - A.x) / d, uy = (B.y - A.y) / d;
      added.push(MM.addPart(bp, t, A.x + ux * ax + uy * h, A.y + uy * ax - ux * h, 0, p)); return;
    }
    if (x === 'snap') { // snap onto part y's snap point `snap` with this part's snap `a`
      const host = bp.parts[y], P = MM.addPart(bp, t, 0, 0, ang || 0, p), hs = MM.snapsW(host)[snap], ms = MM.snapsW(P)[a];
      P.x += hs.x - ms.x; P.y += hs.y - ms.y; const ms2 = MM.snapsW(P)[a];
      bp.joints.push({ a: host.id, sa: snap, b: P.id, sb: a, k: MM.jointKind(hs, ms2) }); added.push(P); return;
    }
    added.push(MM.addPart(bp, t, x, y, a, p));
  });
  return added;
}
// has a running machine met the challenge goal?
function MM_goal(rt, level) {
  const g = level.goal, I = rt.I[g.i]; if (!I) return false;
  if (g.k === 'note') return !!I.st.rang;
  if (g.k === 'lamp') return !!I.on;
  if (g.k === 'bucket') return (I.st.n || 0) >= (g.n || 1);
  if (g.k === 'finish') return !!I.st.got;
  if (g.k === 'star') return !!I.st.got && (g.by == null || I.st.bys?.has(rt.bp.parts[g.by].id));
  if (g.k === 'turns') { if (!I.host) return false; I.st.a0 = I.st.a0 ?? I.host.angle; return (I.host.angle - I.st.a0) >= g.n * Math.PI * 2; }
  return false;
}

/* =====================================================================
   Machines & Mechanics — the science behind every part (real-world cards)
   ===================================================================== */
const MM_FACTS = {
  mass: { t: 'Mass and weight', b: 'Mass is how much stuff something is made of (kilograms). Weight is the pull of gravity on that mass: W = m × g, where g = 9.8 m/s² on Earth. A glass marble is only about 20 grams, so it weighs about 0.2 newtons.', f: 'W = m·g', w: 'Bathroom scales, lifts with a maximum load, astronauts weighing less on the Moon (same mass, smaller g).', try: 'Drop a marble and a steel ball together — they land at the same time. Gravity accelerates everything equally (if air resistance is small).' },
  bounce: { t: 'Bouncing and restitution', b: 'When a ball hits the floor it squashes, storing energy, then springs back. Some energy is lost as heat and sound. The “coefficient of restitution” e is how much speed survives: bounce height ≈ e² × drop height.', f: 'h₂ = e²·h₁', w: 'Tennis balls are tested by dropping them from 254 cm — they must bounce 135–147 cm. A cold squash ball barely bounces.', try: 'Drop a rubber ball from 2 m. It comes back to about half the height (e ≈ 0.72).' },
  inertia: { t: 'Inertia', b: 'Inertia is an object’s resistance to changing its motion. Heavy things are hard to start and hard to stop — that’s Newton’s first law: things keep doing what they’re doing unless a force acts.', f: 'F = m·a', w: 'Seatbelts stop you continuing forward when a car brakes. A tablecloth trick works because the dishes’ inertia keeps them still.', try: 'Roll a steel ball and a marble at the same speed into a domino. The steel ball barely notices; the marble bounces back.' },
  momentum: { t: 'Momentum', b: 'Momentum is mass × velocity. In a collision the total momentum stays the same — so a heavy, slow bowling ball can send a light pin flying fast.', f: 'p = m·v', w: 'Bowling, snooker, crash tests, Newton’s cradle.', try: 'Drop the bowling ball on one end of a seesaw: its momentum becomes a fast launch at the other end.' },
  drag: { t: 'Air resistance (drag)', b: 'Moving through air means pushing air out of the way. Big, light things (a beach ball, a feather) feel drag much more than small heavy things — that’s why a beach ball floats down slowly.', f: 'F ≈ ½·ρ·v²·C·A', w: 'Parachutes, cyclists crouching low, car designers using wind tunnels.', try: 'Drop a beach ball and a steel ball from the same height and watch who wins.' },
  domino: { t: 'Chain reactions', b: 'Standing a domino up stores a little gravitational potential energy. When it tips past its balance point it falls, releasing that energy into the next one. A domino can knock over one about 1.5 times bigger — chains can grow!', w: 'Rube Goldberg machines, nuclear chain reactions (on a very different scale), stadium waves.', try: 'Space dominoes about three-quarters of their height apart. Too close and they lean on each other; too far and they miss.' },
  friction: { t: 'Friction', b: 'Friction is the force that resists surfaces sliding over each other. It’s proportional to how hard the surfaces press together: F = μ × N. μ (mu) is small for ice or steel on steel, big for rubber on concrete.', f: 'F = μ·N', w: 'Brakes, tyre grip, walking (without friction you couldn’t), matches lighting.', try: 'Slide a crate on the floor: it stops after v²/(2μg) metres — in this workshop, exactly that.' },
  lever: { t: 'Levers', b: 'A lever is a rigid bar that turns about a pivot (the fulcrum). A small force far from the pivot can balance a big force close to it, because what matters is torque: force × distance. Archimedes said: “Give me a place to stand and I will move the Earth.”', f: 'F₁·d₁ = F₂·d₂', w: 'Seesaws, crowbars, scissors, bottle openers, your forearm (elbow is the pivot).', try: 'Drop a heavy ball far from the seesaw’s pivot, then near it. Further out = more torque = bigger launch.' },
  structure: { t: 'Beams and structures', b: 'Steel beams are shaped like an I because most of the bending stress is at the top and bottom edges — so that’s where the metal goes. Bolted beams don’t move: they’re the skeleton of a machine.', w: 'Bridges, skyscrapers, cranes, bicycle frames.', try: 'Bolt beams together to build shelves and walls for your machine.' },
  incline: { t: 'The inclined plane', b: 'A ramp is one of the six simple machines. It lets you raise a load using a smaller force over a longer distance. Things on a slope feel only part of gravity along the slope: g × sin θ. A rolling ball goes a bit slower still, because some energy spins it (5/7 g sin θ for a solid ball).', f: 'a = g·sinθ', w: 'Wheelchair ramps, mountain roads that zig-zag, the pyramids (probably), loading ramps.', try: 'Make a ramp steeper and time a ball rolling down — steeper is faster.' },
  goal: { t: 'Containers and targets', b: 'A bucket catches things because its walls turn sideways motion into a stop. Light, bouncy things (glass marbles dropped from high up) can bounce right out — real-world engineers add soft linings for that reason.', w: 'Ball pits, egg cartons, the foam in a bike helmet.', try: 'Drop a marble into a bucket from low, then from very high.' },
  pivot: { t: 'Pivots and axles', b: 'A pivot lets something turn but not slide. In this workshop, snapping something onto a pivot pin makes a joint that can rotate freely — like a hinge or a wheel on an axle.', w: 'Door hinges, scissors, wheels, clock hands.', try: 'Snap a plank onto a pivot pin at its middle: you’ve made a balance.' },
  pendulum: { t: 'Pendulums', b: 'A pendulum swaps height for speed and back again. Its period (time for one swing) depends only on its length: T = 2π√(L/g) — not on how heavy it is or (for small swings) how far it swings. Galileo noticed this watching a lamp sway in a cathedral.', f: 'T = 2π√(L/g)', w: 'Grandfather clocks, metronomes, playground swings, wrecking balls, Foucault’s pendulum showing the Earth turning.', try: 'An 80 cm pendulum swings back and forth in 1.8 s. Make it four times longer and the swing takes twice as long.' },
  tension: { t: 'Ropes and tension', b: 'A rope can only pull, never push. The pull along it is called tension, and it is the same all along a light rope. Ropes let you transmit a pull around corners and over distance.', w: 'Cranes, tug-of-war, suspension bridges, sailing rigging.', try: 'Hang a bucket from a rope tied to a pivot — it becomes a pendulum.' },
  hooke: { t: 'Springs — Hooke’s law', b: 'Robert Hooke found in 1660 that a spring’s force grows in step with how far you stretch or squash it: F = k × x. The stiffness k is in newtons per metre. A squashed spring stores energy ½kx² — let go and it becomes motion.', f: 'F = k·x,  E = ½·k·x²', w: 'Mattresses, car suspension, pogo sticks, retractable pens, trampolines, weighing scales.', try: 'Set “Squeezed” to 50% and put a ball on top: the spring launches it. Double the stiffness and see how much higher it goes.' },
  elastic: { t: 'Elastic energy', b: 'Stretchy materials store energy when they’re deformed and give it back when they spring into shape. A trampoline returns about 90% of a bounce. Angle the mat and the ball leaves at the same angle it arrived — like light off a mirror.', f: 'angle in = angle out', w: 'Trampolines, bows and arrows, catapults, running shoes, pole vaulting.', try: 'Tilt the trampoline 15° and watch the bounce change direction.' },
  gears: { t: 'Gears and gear ratios', b: 'Meshing gears turn in opposite directions. If a 30-tooth gear drives a 60-tooth gear, the big one turns at half the speed but with twice the turning force (torque). Speed and force trade off — you can’t get more of both.', f: 'ω₁·r₁ = ω₂·r₂', w: 'Bicycles, clocks, car gearboxes, kitchen mixers, wind turbines.', try: 'Drive a small gear with a motor and mesh a big gear to it. Count: the big one turns at half the rpm, the other way.' },
  wheel: { t: 'Wheels and axles', b: 'A wheel turns sliding friction (big) into rolling (tiny). The wheel and axle is a simple machine: a small turn of the axle gives a big movement at the rim. A car’s speed is rpm × the wheel’s circumference.', f: 'v = ω·r', w: 'Cars, trolleys, door knobs, steering wheels, screwdrivers.', try: 'A 15 cm wheel turning 120 times a minute rolls the car about 0.94 m every second.' },
  conveyor: { t: 'Conveyor belts', b: 'A conveyor moves things using friction: the belt’s surface drags whatever sits on it up to belt speed. Boxes ride along; round things can roll instead — that’s why real conveyors carry balls in trays or cups.', w: 'Airport baggage belts, supermarket checkouts, factories, escalators.', try: 'Put a crate and a ball on a tilted belt. The crate rides up; the ball rolls back down.' },
  motor: { t: 'Electric motors', b: 'An electric motor uses magnetism to turn electricity into rotation. Current through coils of wire makes a magnetic field that pushes against permanent magnets, spinning the shaft. It holds a set speed until the load needs more torque than it can give.', f: 'Power = torque × ω', w: 'Fans, drills, electric cars, washing machines, toothbrushes, drones.', try: 'Snap a wheel or gear onto the motor’s shaft. Turn the torque down and give it a heavy load: it slows.' },
  steam: { t: 'Steam engines', b: 'Boiling water makes steam at high pressure that pushes a piston. A crank turns that back-and-forth push into rotation — the same trick as a bicycle pedal. James Watt’s improved engine (1776) powered the Industrial Revolution.', w: 'Steam trains, old factories, paddle steamers, and still today: most power stations spin turbines with steam.', try: 'Watch the connecting rod: one push and one pull for every turn of the flywheel.' },
  fan: { t: 'Fans and air pressure', b: 'A fan’s angled blades throw air backwards. That moving air pushes on whatever it hits — and, by Newton’s third law, pushes the fan the other way. A fan on a cart is a propeller car.', f: 'F = m·a', w: 'Hovercraft, propeller planes, wind tunnels, cooling fans, sailboats (pushed by wind).', try: 'Bolt a fan behind a cart, then try snapping the fan onto the cart instead.' },
  rocket: { t: 'Rockets — action and reaction', b: 'A rocket throws hot gas out of its nozzle very fast. Pushing the gas backwards pushes the rocket forwards just as hard: Newton’s third law. It lifts off when thrust beats weight; its acceleration is (thrust − weight) ÷ mass.', f: 'a = (T − m·g) / m', w: 'Space launches, fireworks, jet packs, balloons letting air out.', try: 'A 0.5 kg rocket with 14 N of thrust accelerates upward at 18 m/s². Point it sideways on a cart for a rocket car.' },
  jet: { t: 'Jet engines', b: 'A jet engine sucks air in the front, squeezes it, burns fuel in it and blasts it out the back much faster. Unlike a rocket it uses oxygen from the air, so it carries only fuel — but it can’t work in space.', w: 'Airliners, fighter jets, jet skis (with water instead of air).', try: 'Snap a jet engine onto a skateboard and give it a long runway.' },
  cannon: { t: 'Projectiles', b: 'Once a cannonball leaves the barrel only gravity acts on it (and a little air), so it flies in a parabola. Ignoring air, the range on flat ground is v² × sin(2θ) ÷ g — the best angle is 45°.', f: 'R = v²·sin2θ / g', w: 'Basketball shots, water fountains, long jump, fireworks, space probes using gravity.', try: 'Fire at 30° and 60°: they land in the same place! Then try 45°.' },
  buoyancy: { t: 'Buoyancy', b: 'Air pushes up on everything with a force equal to the weight of the air it pushes aside (Archimedes’ principle). Helium is seven times lighter than air, so a helium balloon’s upthrust beats its weight and it rises — strong enough balloons can lift a load.', f: 'Upthrust = weight of fluid displaced', w: 'Hot-air balloons, airships, ships floating, submarines, fish swim bladders.', try: 'One balloon can’t lift the rubber ball; two can. Add up lift and weight to predict it.' },
  pressure: { t: 'Pressure', b: 'Pressure is force spread over an area. A sharp point concentrates a small force onto a tiny area, making huge pressure — enough to burst a stretched balloon skin.', f: 'P = F / A', w: 'Drawing pins, knives, snowshoes (the opposite: big area, low pressure), stiletto heels sinking into grass.', try: 'Float a balloon up into a spike.' },
  firework: { t: 'Fireworks', b: 'A firework is a small rocket with a fuse. Gunpowder pushes it up; at the top a second charge bursts and flings out pellets of metal salts that glow different colours when hot: strontium red, barium green, copper blue, sodium gold.', w: 'Celebrations everywhere — and flares used at sea.', try: 'Wire a firework to a finish flag so the win sets it off.' },
  car: { t: 'How a car moves', b: 'The engine turns the wheels, and the tyres push backwards on the road through friction. The road pushes the car forwards (Newton’s third law again). With no grip — on ice — the wheels just spin.', f: 'v = ω·r', w: 'Every car, bike and train. Drag racers use wide soft tyres for more grip.', try: 'Give a car too much torque on a slippery ramp and watch the wheels spin.' },
  suspension: { t: 'Suspension', b: 'Springs between the wheels and the body let the wheels follow bumps while the body stays smoother. Shock absorbers (dampers) stop it bouncing forever.', w: 'Cars, mountain bikes, trains, running shoes, Mars rovers.', try: 'Drive the monster truck over a ramp and watch the springs squash.' },
  coaster: { t: 'Roller coasters and energy', b: 'A coaster car is pulled up the first hill, then gravity does everything: height becomes speed (v = √(2gh)) and speed becomes height again. Friction slowly steals energy, so no hill can be as high as the first.', f: 'mgh = ½mv²', w: 'Roller coasters, skateboard half-pipes, ski jumps, pendulums.', try: 'Drop a car from 1.5 m: at the bottom it’s doing about 5.4 m/s.' },
  slide: { t: 'Slides and friction', b: 'On a slide, gravity pulls you down the slope while friction holds you back. Smooth plastic means low friction and a fast ride; the gentle curve at the bottom turns your fall into forward speed.', f: 'a = g(sinθ − μ·cosθ)', w: 'Playground slides, water slides, ski slopes, chutes in factories.', try: 'Send a ball and a crate down the same slide.' },
  swing: { t: 'Swings', b: 'A swing is a pendulum you can ride. Kids “pump” by shifting their weight at just the right moments, adding energy in time with the swing — that’s resonance. At the bottom you feel heavier: the seat has to provide your weight plus the push that curves your path.', f: 'T = 2π√(L/g)', w: 'Playgrounds, pendulum rides, trapeze artists.', try: 'Change the chain length and time a swing.' },
  ferris: { t: 'Ferris wheels', b: 'The gondolas hang from pins, so gravity keeps them level as the wheel turns — each one is a little pendulum. The first Ferris wheel (Chicago, 1893) was 80 m tall and carried 2,000 people at once.', w: 'Fairground wheels, the London Eye, water wheels, cable cars.', try: 'Watch the gondolas: they swing a little when the wheel starts and stops.' },
  resonance: { t: 'Resonance', b: 'Everything that swings has a natural rhythm. Small pushes timed to match it add up to big swings — that’s resonance. Push at the wrong moments and you slow it down instead.', w: 'Swings, musical instruments, opera singers breaking glasses, engineers making sure bridges don’t resonate with wind or footsteps.', try: 'The pirate ship only pumps near the bottom of its swing, in the direction it’s moving — watch it build up.' },
  sound: { t: 'Sound', b: 'Sound is a vibration travelling through the air as pressure waves, at about 343 m/s. A bell rings for a long time because thick metal vibrates with little damping. Its tone mixes several pitches (partials) that give it that clang.', f: 'speed = frequency × wavelength', w: 'Church bells, cymbals, speakers, your vocal cords.', try: 'Ring a bell with a light marble and then a heavy steel ball — harder hits are louder, but the pitch stays the same.' },
  pitch: { t: 'Pitch and length', b: 'Pitch is how fast something vibrates (frequency, in hertz). A shorter or stiffer bar vibrates faster and sounds higher. For a xylophone bar, frequency goes up as 1/length², so a bar for a note one octave higher is about 0.7 times as long.', f: 'f ∝ 1 / L²', w: 'Xylophones, guitar strings (shorter = higher), organ pipes, wind chimes.', try: 'Look at the bars: C6 is shorter than C5. Line them up to play a scale.' },
  drum: { t: 'Drums', b: 'A drum’s tight skin vibrates when hit. A big, loose drum vibrates slowly (low boom); a small tight one vibrates fast (high crack). A snare drum adds rattling wires for its buzz.', w: 'Drum kits, kettle drums, your eardrum (a drum in reverse — it receives vibrations).', try: 'Set the drum to kick, tom and snare and drop balls on each.' },
  switch: { t: 'Switches and circuits', b: 'A switch connects or breaks an electrical circuit. Press the button and current can flow along the wire to whatever it’s connected to — a lamp, a motor, a rocket igniter.', w: 'Light switches, doorbells, keyboards, pressure pads on automatic doors.', try: 'Wire a button to a lamp, then drop something on the button.' },
  timer: { t: 'Timers', b: 'A timer sends a signal after a set time. Mechanical timers use a wound spring or a pendulum; electronic ones count the vibrations of a tiny quartz crystal — 32,768 times a second.', w: 'Ovens, traffic lights, washing machines, rocket countdowns.', try: 'Use a timer to start your machine a few seconds after you press Play.' },
  laser: { t: 'Laser tripwires', b: 'A laser makes a narrow beam of light that a sensor watches. Anything passing through blocks the beam, and the sensor notices it’s gone dark — no touching required.', w: 'Supermarket doors, garage door safety beams, finish lines in sprint races, burglar alarms.', try: 'Aim a laser across a ball’s path and wire it to a cannon.' },
  circuit: { t: 'Lamps and electricity', b: 'A lamp turns electrical energy into light. Old bulbs heat a thin wire until it glows (and waste most energy as heat); LEDs make light directly and use about 85% less power.', f: 'Power = voltage × current', w: 'Every light you have ever switched on.', try: 'Wire several lamps to one timer for a light show.' },
  speed: { t: 'Speed and timing', b: 'Speed is distance ÷ time. A finish flag is a sensor across the track: it records the moment something crosses. With the Science lens on you can read every part’s speed in metres per second.', f: 'v = d / t', w: 'Speed cameras, photo finishes, sports timing.', try: 'Turn on the Science lens, tap your car and read its speed.' },
  energy: { t: 'Energy changes', b: 'Energy can’t be made or destroyed, only changed from one form to another: height (potential) into speed (kinetic), into sound and heat. Turn on the Science lens to watch the totals for your machine.', f: 'PE = m·g·h,  KE = ½·m·v²', w: 'Everything! Hydroelectric dams, batteries, food, the Sun.', try: 'Collect a star by turning height into speed and back into height.' },
  hinge: { t: 'Hinges and trapdoors', b: 'A trapdoor is a lever held shut by a latch. Release the latch and gravity swings it open about its hinge, dropping whatever sat on it.', w: 'Doors, laptop lids, drawbridges, cat flaps.', try: 'Put a ball on a trapdoor and wire it to a button.' },
  wind: { t: 'Wind power', b: 'Wind is moving air, and moving air has energy. Angled blades turn the push of the wind into rotation, which can drive a generator.', w: 'Wind turbines (the big ones make enough power for about 1,500 homes), windmills, pinwheels.', try: 'Point a fan at a pinwheel.' },
  gas: { t: 'Compressed gas', b: 'Squeezing a gas into a small space stores energy. Let it out suddenly and it expands with a pop, throwing whatever’s in the way.', w: 'Party poppers, aerosol cans, airbags (inflate in 0.03 s), tyres.', try: 'Wire a confetti popper to the end of your machine.' }
};
// lessons in the shared lesson book
page('MM-01', 'machines', 'Welcome to the workshop', 'machines mechanics workshop build controls snap wheel rotate twist parts', `<p>Build a machine from parts, press <b>▶ Play</b>, and real physics takes over: gravity (9.8 m/s²), friction, bouncing, momentum, gears and springs. In this workshop <b>1 metre = one big grid square</b>; the ruler on the floor shows metres.</p><ul><li><b>Add parts:</b> tap <b>＋ Parts</b>, then tap a part (it appears in the middle) or drag it out.</li><li><b>Move:</b> drag a part. Drag the background to look around; pinch or scroll to zoom.</li><li><b>Snap:</b> drop a part near another and its snap points click together — a <b>pin</b> (turns freely) or a <b>weld</b> (rigid). Tap a joint’s marker to switch.</li><li><b>Manipulation wheel:</b> tap a part to get its wheel. Drag the knob to rotate, use ⟲ ⟳ for 15° steps, ⇋ to flip, ✂ to take it off the machine, ⚙ for settings, ⓘ for the science.</li><li><b>Part or machine:</b> the middle of the wheel switches between turning just this part and turning the whole machine it belongs to. Two fingers on a selected part twist it — the view stays put, just like twisting one layer of the cube.</li></ul>`);
page('MM-02', 'machines', 'Simple machines: the inclined plane', 'simple machines inclined plane ramp slope incline gravity sin', `<p>There are six classic <b>simple machines</b>: lever, wheel and axle, pulley, inclined plane, wedge and screw. Almost every machine is built from them.</p><p>A ramp — an <b>inclined plane</b> — lets gravity move something sideways. On a slope of angle θ, only part of gravity pulls along the slope: <b>g × sin θ</b>. A ball rolls a little slower again, because some energy goes into spinning it (about 5/7 of that for a solid ball).</p><p>Real world: wheelchair ramps, zig-zag mountain roads, the wedge of an axe (two ramps back to back), and a screw (a ramp wrapped round a rod).</p>`).practice = { label: 'Try “Ring the bell”', fn: () => GAMES.machines.practice?.('bell') };
page('MM-03', 'machines', 'Energy and chain reactions', 'energy potential kinetic chain reaction dominoes rube goldberg', `<p>Energy is never made or lost — it changes form. A raised ball has <b>potential energy</b> (m·g·h). As it falls it becomes <b>kinetic energy</b> (½·m·v²). When it hits something, energy passes on — some becomes sound and heat.</p><p>A <b>Rube Goldberg machine</b> (named after the cartoonist Rube Goldberg) chains many small energy hand-offs to do something simple in the most delightful way possible.</p><p>Turn on the <b>🔬 Science lens</b> while playing to see energy bars and every part’s speed and height.</p>`).practice = { label: 'Try “Domino effect”', fn: () => GAMES.machines.practice?.('domino') };
page('MM-04', 'machines', 'Levers and torque', 'lever torque seesaw fulcrum pivot force distance archimedes', `<p>A <b>lever</b> is a bar that turns about a pivot. The turning effect of a force is its <b>torque</b>: force × distance from the pivot. Balance happens when torques match: F₁·d₁ = F₂·d₂.</p><p>Three classes: pivot in the middle (seesaw, scissors), load in the middle (wheelbarrow, nutcracker), effort in the middle (tweezers, your forearm).</p>`).practice = { label: 'Try “Lever launch”', fn: () => GAMES.machines.practice?.('lever') };
page('MM-05', 'machines', 'Pendulums and swings', 'pendulum swing period clock galileo length time', `<p>A pendulum’s swing time is <b>T = 2π√(L/g)</b>. It depends on the length, not the weight. That made pendulum clocks the most accurate clocks in the world for nearly 300 years.</p><p>In this workshop an 80 cm pendulum takes 1.8 s per swing — exactly what the formula says. Pull it back further and it hits harder (more height, more energy) but takes almost the same time.</p>`).practice = { label: 'Try “Swing and hit”', fn: () => GAMES.machines.practice?.('pendulum') };
page('MM-06', 'machines', 'Gears and ratios', 'gears ratio teeth torque speed mesh direction clockwise', `<p>Meshing gears turn in <b>opposite directions</b>. The rims move at the same speed, so ω₁·r₁ = ω₂·r₂: a gear twice the size turns half as fast but with twice the torque.</p><p>Rule of thumb: in a straight chain, an <b>odd</b> number of gears makes the last turn the same way as the first; an <b>even</b> number reverses it. Gears click into mesh here when their rims touch.</p>`).practice = { label: 'Try “Gear up”', fn: () => GAMES.machines.practice?.('gears') };
page('MM-07', 'machines', 'Springs, bounces and elastic energy', 'spring hooke elastic bounce trampoline restitution energy', `<p>Springs obey <b>Hooke’s law</b>: F = k·x. Squash a spring by x and it stores ½·k·x² of energy. Balls and trampolines are springs too — they squash and spring back, returning a fraction of the energy each bounce (the coefficient of restitution).</p>`).practice = { label: 'Try “Bounce house”', fn: () => GAMES.machines.practice?.('bounce') };
page('MM-08', 'machines', 'Newton’s laws of motion', 'newton laws motion force mass acceleration first second third inertia', `<ol><li><b>Inertia:</b> things keep moving (or stay still) unless a force acts.</li><li><b>F = m·a:</b> a force accelerates a mass; twice the mass, half the acceleration.</li><li><b>Action and reaction:</b> every push has an equal push back.</li></ol><p>Isaac Newton published these in 1687. The physics in this workshop follows them every 1/240 of a second.</p>`).practice = { label: 'Try “Fan-tastic”', fn: () => GAMES.machines.practice?.('fan') };
page('MM-09', 'machines', 'Rockets, jets and thrust', 'rocket jet thrust newton third law action reaction fuel space', `<p>Rockets and jets push gas backwards to be pushed forwards (Newton’s third law). A rocket lifts off when its <b>thrust</b> beats its <b>weight</b>; the extra force accelerates it: a = (T − m·g) ÷ m.</p><p>Rockets carry their own oxygen, so they work in space. Jets breathe air, so they don’t.</p>`).practice = { label: 'Try “Rocket cart”', fn: () => GAMES.machines.practice?.('rocket') };
page('MM-10', 'machines', 'Floating and buoyancy', 'buoyancy balloon helium archimedes float lift upthrust', `<p>Archimedes’ principle: anything in a fluid (water or air) is pushed up by the weight of the fluid it displaces. A helium balloon displaces air that weighs more than the balloon, so it rises. To lift something, total lift must beat total weight.</p>`).practice = { label: 'Try “Up, up and away”', fn: () => GAMES.machines.practice?.('balloon') };
page('MM-11', 'machines', 'Designing like an engineer', 'engineering design process plan test improve rube goldberg invent', `<p>Real engineers follow a loop: <b>Ask</b> (what must it do?) → <b>Imagine</b> → <b>Plan</b> → <b>Create</b> → <b>Test</b> → <b>Improve</b>. Expect the first version to fail; each test teaches you something. Change one thing at a time so you know what fixed it.</p>`).practice = { label: 'Try “The grand contraption”', fn: () => GAMES.machines.practice?.('grand') };
page('MM-12', 'machines', 'Selling your inventions', 'sell money cogs economy gallery collectors exhibit buy parts tools licence store', `<p>Your workshop runs on <b>cogs ⚙</b>. Tap <b>🖼 Exhibit & sell</b> and your machine runs for 12 seconds in front of three collectors. They score it on <b>motion, chain reaction, music, flight, driving, craft and show</b> and each makes an offer.</p><ul><li><b>Sell the machine</b> — the full price; its parts go with it.</li><li><b>Sell the plans</b> — about a third, and you keep the machine.</li></ul><p>Each collector loves something different, and new collectors visit every day. Selling the same design again earns less each time — invent something new! Spend cogs in the <b>🏪 Supply store</b> on parts, tools and licences (rockets, vehicles, rides, wiring). Challenges pay cogs too, and you can trade lounge stars for cogs.</p>`);
page('MM-13', 'machines', 'Wires, triggers and signals', 'wire wiring signal trigger button timer laser hold release trapdoor', `<p>Buy the <b>Wiring kit</b> to connect triggers to things. Tap <b>⚡ Wire</b>, tap a trigger (button, timer, laser, bucket, finish flag, star) and then what it should switch on (rocket, motor, fan, cannon, lamp, bell, trapdoor, firework, popper).</p><p>Any free part can also be set to <b>Hold until signal</b> in its ⚙ settings: it hangs frozen in place until a wire releases it — perfect for dropping a ball at exactly the right moment.</p>`);
</script>

const mmUnits = { len: v => (v * 100 / MM.SC).toFixed(0) + ' cm', deg: v => v + '°', rpm: v => v + ' rpm', N: v => v + ' N', 'N·m': v => v + ' N·m', 'm/s': v => v + ' m/s', s: v => v + ' s', '%': v => v + '%', 'N/m': v => v + ' N/m', '': v => v };
let mmApi = null;

registerGame({
  id: 'machines', name: 'Machines & Mechanics', tag: 'Physics workshop',
  desc: 'Build Rube Goldberg machines with real physics — dominoes, gears, rockets, cars, rides and music. Snap parts together, sell your inventions, learn how it all works.',
  art: () => `<svg viewBox="0 0 100 100"><g fill="#f2c14e" stroke="#7a5a10" stroke-width="1.5"><path d="M38 22l4-8h8l4 8 8 3 8-4 6 6-4 8 3 8 8 4v8l-8 4-3 8 4 8-6 6-8-4-8 3-4 8h-8l-4-8-8-3-8 4-6-6 4-8-3-8-8-4v-8l8-4 3-8-4-8 6-6 8 4z" transform="translate(-6 8) scale(.8)"/></g><circle cx="34" cy="54" r="9" fill="#1d1a24"/><path d="M70 18c10 6 14 20 10 34l-12-4c3-10 1-18-4-24z" fill="#fff"/><path d="M66 48l14 4-6 14z" fill="#ff4d6d"/><path d="M74 64l4 12 4-12z" fill="#ffb703"/><circle cx="74" cy="34" r="4" fill="#4fd6ff"/></svg>`,
  how: `<p><b>Build a machine, press ▶ Play, and real physics takes over</b> — gravity, friction, bounces, gears, springs and thrust, all in real units (1 grid square = 1 metre).</p><ul><li><b>＋ Parts</b> opens your shelf. Tap a part to drop it in, or drag it out.</li><li><b>Snap:</b> drop a part near another and their snap points click together — a <b>pin</b> turns, a <b>weld</b> holds rigid. Tap a joint marker to switch.</li><li><b>Manipulation wheel:</b> tap a part. Drag the gold knob to rotate it; ⟲ ⟳ turn in steps; ✂ takes it off the machine; ⚙ settings; ⓘ the real-world science.</li><li><b>Like the cube:</b> drag the background to look around, pinch to zoom, and twist a selected part with two fingers — the view stays put. The pill on the wheel switches between turning one <b>part</b> or the whole <b>machine</b>.</li><li><b>🏆 Challenges</b> teach one idea each. <b>🎪 Showcase</b> runs big demo machines with the teacher explaining. <b>🖼 Exhibit & sell</b> your inventions for cogs ⚙ to buy parts, tools and licences.</li></ul>`,
  practice(id) { if (curId === 'machines' && mmApi) mmApi.openLevel(id); else openGame('machines', { level: id }); },
  create(host, opts, o) {
    /* ---------------- state ---------------- */
    const fresh = () => ({ v: 1, cogs: 150, inv: { ...MM_START_INV }, tools: {}, bench: null, slots: [], sold: {}, gallery: [], done: {}, day: { d: '', sold: [], plans: [] }, sales: 0 });

      <button class="btn sm" id="mmStore">🏪 Supply store</button><button class="btn sm" id="mmList">📋 Parts list</button><button class="btn sm" id="mmSlots">💾 Blueprints</button><button class="btn sm brass" id="mmSell">🖼 Exhibit & sell</button><span class="mmcogs" id="mmCogs"></span>`;
    $('#mmMode', opts).onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.m === 'build') openBench(); else if (b.dataset.m === 'challenge') levelPicker(); else showPicker(); };

    function snapshot() { hist.push(JSON.stringify({ bp, tray })); if (hist.length > 80) hist.shift(); }

    function liveHitAt(wx, wy) { const bodies = Matter.Query.point(rt.dyn().concat(rt.hosts.filter(h => h.isStatic)), { x: wx, y: wy }); for (const b of bodies) { const I = b.mmI || b.mmG?.[0]; if (I) return I; } let best = null, bd = 30 / cam.z; for (const I of rt.I) { if (I.dead || !I.host) continue; const d = Math.hypot(I.host.position.x - wx, I.host.position.y - wy); if (d < bd) { bd = d; best = I; } } return best; }

    function keepInside(set) { const b = setBounds(set); let dx = 0, dy = 0; if (b.x0 < 0) dx = -b.x0; if (b.x1 > worldW()) dx = worldW() - b.x1; if (b.y1 > worldH()) dy = worldH() - b.y1; if (dx || dy) moveSet(set, dx, dy); }
    function floorSnap(set) { const b = setBounds(set), gap = worldH() - b.y1; if (Math.abs(gap) < Math.max(14, 20 / cam.z)) moveSet(set, 0, gap); }

      card.hidden = false; card.innerHTML = `<span>${d.icon} <b>${esc(d.name)}</b> <span class="muted">· ${P.p.fx === 'bolted' ? 'bolted' : P.p.fx === 'pinned' ? 'pinned' : 'free'}${js ? ` · ${js} snap${js > 1 ? 's' : ''}` : ''}${ws2 ? ` · ${ws2} wire${ws2 > 1 ? 's' : ''}` : ''}${P.lk === 1 ? ' · 🔒 fixed' : P.lk === 'r' ? ' · 🔒 turn only' : ''}</span></span><button class="btn sm" data-f>ⓘ Real world</button>`;

      if (has('slowmo')) B.push(['🐢', () => { slow = !slow; paintBar(); }, slow ? 'on' : '']);
      B.push(['⤢', () => fit(), '']);
      bar.innerHTML = ''; for (const [label, fn, cls] of B) { const b = el('button', { class: 'btn sm ' + cls }, label); b.onclick = () => fn(); bar.appendChild(b); }
    }

    /* ---------------- parts drawer ---------------- */

    function closeDrawer() { drawerOpen = false; drawer.hidden = true; paintBar(); }
    function openDrawer() { drawerOpen = true; drawer.hidden = false; paintDrawer(); paintBar(); }
    function paintDrawer() {

      if (mode === 'challenge') {
        const counts = {}; tray.forEach(x => counts[x.t] = (counts[x.t] || 0) + 1);
        drawer.innerHTML = `<div class="dh"><button class="on">🧰 Tray for this challenge</button><button class="x" data-x>✕</button></div><div class="mmtip">${tray.length ? 'Tap a part to add it, or drag it up onto the table.' : 'The tray is empty — everything is on the table. Rotate parts with the wheel, or press ▶ Play.'}</div><div class="grid"></div>`;

        const grid = $('.grid', drawer), tip = $('.mmtip', drawer), list = Object.values(MM.PARTS).filter(d => d.cat === drawerCat);

        else tip.innerHTML = `Tap to add · drag up to place · swipe sideways for more · you have <b>⚙ ${ws.cogs}</b>`;

      }

    }
    function tile(t, n, p) {

      const b = el('button', { class: 'mmtile' + (n ? '' : ' out') + (lockd ? ' lock' : ''), title: d.name }); b.appendChild(MMD.thumb(t, 52, p)); b.appendChild(el('span', {}, esc(d.name)));
      b.appendChild(el('span', { class: 'n' }, mode === 'build' ? '×' + n : '×' + n)); if (lockd) b.appendChild(el('span', { class: 'lk' }, '🔒'));
      let sx = 0, sy = 0, started = false, pid = null;

      const up = e => { if (e.pointerId !== pid) return; window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);

      wheel.style.left = sx + 'px'; wheel.style.top = sy + 'px'; k.setAttribute('cx', kx); k.setAttribute('cy', ky); const ln = $('line', wheel); if (ln) { ln.setAttribute('x2', kx); ln.setAttribute('y2', ky); }

    }
    function placeWheel() {
      const P = sel && byId(sel); if (!P || !canEdit() || drag || tool === 'wire') { wheel.hidden = true; return; }
      const b = MM.bounds(P), [sx, sy] = toScreen(P.x, P.y), rad = clamp(Math.max(b.x1 - b.x0, b.y1 - b.y0) / 2 * cam.z + 30, 64, Math.min(150, Math.min(vw, vh) / 2 - 30));
      wheel.hidden = false; wheel.style.left = sx + 'px'; wheel.style.top = sy + 'px'; wheel.dataset.rad = rad;
      const lk = P.lk, canMove = lk !== 1, canRot = lk !== 1, inMachine = jointOf(P.id).length > 0;

      const deg = Math.PI / 180, aDeg = Math.round(((P.a * 180 / Math.PI) % 360 + 540) % 360 - 180);

      for (let i = 0; i < bp.wires.length; i++) { const m = wireMid(bp.wires[i]); if (m && Math.hypot(m[0] - w[0], m[1] - w[1]) < R * 1.4) { if (mode === 'challenge' && level.wires) return true; snapshot(); bp.wires.splice(i, 1); toast('✂ Wire cut'); beep('tick'); changed(); return true; } }

    }
    function wireTap(w) {
      const P = partHitAt(...w); if (!P) { wireFrom = null; dirty = true; return; } const d = defOf(P);
      if (!wireFrom) { if (!d.trig) { toast(`${d.name} can’t send signals — start at a button, timer, laser, bucket, flag or star`); beep('bad'); return; } wireFrom = P.id; toast(`From ${d.name}: now tap what it should switch on`); beep('pick'); dirty = true; return; }
      if (P.id === wireFrom) { wireFrom = null; dirty = true; return; }
      if (!(d.target || d.music || d.id === 'lamp' || d.id === 'balloon' || P.p.hold)) { toast(`${d.name} doesn’t respond to signals. Try a rocket, motor, fan, cannon, lamp, bell, trapdoor — or set a part to “hold until signal”.`); beep('bad'); return; }
      if (bp.wires.some(x => x.a === wireFrom && x.b === P.id)) { toast('Already wired'); return; }
      snapshot(); bp.wires.push({ a: wireFrom, b: P.id }); if (d.powered && P.p.start === 'play' && MM.PARTS[P.t].props.start) P.p.start = 'signal';
      toast(`⚡ Wired: ${defOf(byId(wireFrom)).name} → ${d.name}`); MMD.SND.zap(); wireFrom = null; changed();
    }
    const wireMid = w => { const A = byId(w.a), B = byId(w.b); if (!A || !B) return null; return [(A.x + B.x) / 2, (A.y + B.y) / 2 + Math.hypot(A.x - B.x, A.y - B.y) * .15]; };

    /* ---------------- play ---------------- */
    function play() {
      if (playing) return; closeDrawer(); wheel.hidden = true; tool = 'hand'; wireFrom = null;
      try { rt = MM.build(bp); } catch (e) { toast('That machine can’t run: ' + e.message); return; }
      playing = true; won = false; failedNote = false; seenEv = new Set(); trails.clear(); energyHist = []; rtAcc = 0; lastT = performance.now();
      paintBar(); paintLens(); paintCard(); coach(); beep('pick');
      if (mode === 'show') T.note('▶ Watch closely — I’ll explain as it goes.');
    }
    let rtAcc = 0, lastT = performance.now();
    function stepRun(dt) {
      const speed = slow ? .25 : 1; rtAcc += Math.min(dt, .05) * speed; let n = 0;
      while (rtAcc >= MM.STEP / 1000 && n < 16) { MM.step(rt); rtAcc -= MM.STEP / 1000; n++; }
      if (n) { rt.frames++; const m = rt.m; let ke = 0, mov = 0, cnt = 0; for (const b of rt.dyn()) { const v = Matter.Body.getVelocity(b), s = Math.hypot(v.x, v.y) * MM.V2MS; ke += .5 * b.mass * s * s; cnt++; if (s > .05) mov++; } m.ke += ke; m.moving += cnt ? mov / cnt : 0;
        for (const I of rt.I) if (I.host && !I.host.isStatic && I.y0 != null && !I.dead) { m.rise = Math.max(m.rise, (I.y0 - I.host.position.y) / MM.SC); if (I.d.veh) m.drive = Math.max(m.drive, Math.abs(I.host.position.x - I.x0) / MM.SC); if (I.host.position.y > rt.H + 600 || I.host.position.x < -800 || I.host.position.x > rt.W + 800) { if (I.host.mmG?.length > 1) { Matter.Body.setStatic(I.host, true); I.dead = true; } else { I.dead = true; Matter.Composite.remove(rt.world, I.host); for (const s of I.subs) Matter.Composite.remove(rt.world, s.body); } } } }
      handleEvents();
      // continuous engine sounds
      const st = { rocket: 0, jet: 0, fan: 0, motor: 0 }; for (const I of rt.I) { if (I.dead) continue; if (I.burn && (I.t === 'rocket' || I.t === 'firework')) st.rocket++; if (I.burn && I.t === 'jet') st.jet++; if (I.on && I.t === 'fan') st.fan++; if (I.on && ['motor', 'steam', 'car', 'truck', 'ferris', 'conveyor'].includes(I.t)) st.motor++; }
      st.chuff = rt.I.some(I => I.on && I.t === 'steam') && Math.floor(rt.t * 4) !== Math.floor((rt.t - dt) * 4); MMD.SND.loops(st); MMD.SND.frame();
      if (lens) { const E = MM.energy(rt); energyHist.push(E); if (energyHist.length > 240) energyHist.shift(); if (rt.frames % 6 === 0) paintLens(); }
      for (const I of rt.I) if (I.host && !I.host.isStatic && !I.dead && (I.d.ball || I.id === sel)) { let tr = trails.get(I.id); if (!tr) trails.set(I.id, tr = []); const q = I.host.position; if (!tr.length || Math.hypot(tr.at(-1)[0] - q.x, tr.at(-1)[1] - q.y) > 6) { tr.push([q.x, q.y]); if (tr.length > 70) tr.shift(); } }
      if (mode === 'challenge' && !won && MM_goal(rt, level)) challengeWon();
      if (mode === 'challenge' && !won && !failedNote && rt.t > level.time + 1.5) { failedNote = true; T.set({ msg: `Not yet — the goal didn’t happen in ${level.time} s. Press ■ Stop, adjust, and try again. ${hintsUsed ? '' : 'Stuck? Tap 💡 Hint for a ghost of the answer.'}` }); toast('Not quite — Stop, adjust, try again'); }
      if (exhibit) exhibitTick();
    }
    function handleEvents() {
      for (const e of rt.ev) {
        MMD.emit(e); const S2 = MMD.SND;
        if (e.k === 'hit') S2.hit(e.v > 0 && e.ma === 'metal' || e.mb === 'metal' ? 'metal' : e.ma === 'glass' || e.mb === 'glass' ? 'glass' : (e.ma === 'floor' ? e.mb : e.ma), e.v);
        else if (e.k === 'note') S2.note(e.ins, e.hz, e.v, e.tone);
        else if (e.k === 'boom') S2.boom(); else if (e.k === 'pop') S2.pop(); else if (e.k === 'burst') S2.burst(); else if (e.k === 'confetti') { S2.pop(); S2.burst(); }
        else if (e.k === 'ign' && e.I.t === 'firework') S2.whistle(); else if (e.k === 'press') S2.press(); else if (e.k === 'trip' || e.k === 'sig') S2.zap();
        else if (e.k === 'lamp') S2.lamp(e.on); else if (e.k === 'tick') S2.tick(); else if (e.k === 'boing') S2.boing(e.v); else if (e.k === 'release') S2.click();
        else if (e.k === 'goal' || e.k === 'star' || e.k === 'finish') S2.coin();
        narrate(e);
      }
      rt.ev.length = 0;
    }
    const NARR = {
      note: e => e.ins === 'bell' ? '🔔 The bell rings: the impact makes the metal vibrate, and the vibration travels to your ears as sound.' : e.ins === 'xylo' ? `🎵 ${e.name}: shorter bars vibrate faster and sound higher.` : e.ins === 'drum' ? '🥁 Boom — the drum skin vibrates; big loose drums sound low.' : '✨ Crash! Thin brass rings for a long time.',
      ign: e => e.I.t === 'firework' ? '🎆 The fuse is lit!' : '🔥 Ignition! Gas rushes backwards, so the rocket is pushed forwards — Newton’s third law.',
      boom: () => '💥 Fire! The cannonball flies in a curve (a parabola) — only gravity acts on it now.',
      press: () => '🔘 Something pressed the button: that closes a circuit and sends a signal down the wire.',
      trip: () => '🔴 The laser beam was broken — the sensor noticed the light disappear.',
      goal: () => '🪣 In the bucket! Its walls turned sideways motion into a stop.', star: () => '⭐ Star collected!', finish: () => '🏁 Over the finish line!',
      burst: () => '🎆 Burst! Metal salts glow different colours when hot.', pop: () => '🎈 Pop! The sharp point made enormous pressure on the thin rubber.',
      boing: () => '🤸 Boing — the mat stretched, stored elastic energy and gave it back.', release: () => '🧲 Released! A signal let the part go.', lamp: e => e.on ? '💡 Lamp on: electrical energy becoming light.' : ''
    };
    function narrate(e) {
      if (seenEv.has(e.k + (e.ins || '')) || !NARR[e.k]) return; seenEv.add(e.k + (e.ins || ''));

    }

    /* ---------------- challenges ---------------- */
    function challengeWon() {
      won = true; const first = !ws.done[level.id], idx = MM_LEVELS.indexOf(level), stars = 2 + (idx >= 4 ? 1 : 0) + (idx >= 8 ? 1 : 0);
      const r = award('machines', level.id, { time: Math.round(rt.t), stars, hints: hintsUsed }); const cogs = first ? 40 : 10; ws.cogs += cogs; ws.done[level.id] = 1; saveWS(); paintOpts(); paintChip(); MMD.SND.fanfare();
      setTimeout(() => {

        winOverlay(host, { title: level.name + ' — solved!', lines: [`<b>What you just did:</b> ${level.learned}`, `+${cogs} ⚙ cogs for your workshop${first ? ' (first solve)' : ''}`], earned: r.earned, again: () => openLevel(level.id) });
        const next = MM_LEVELS[idx + 1], row = $('.win .row', host); if (next && row) { const b = el('button', { class: 'btn' }, 'Next: ' + esc(next.name) + ' ▶'); b.onclick = () => { $('.win', host)?.remove(); openLevel(next.id); }; row.prepend(b); }
      }, 900);

    }

    /* ---------------- exhibit & sell ---------------- */

    /* ---------------- science lens ---------------- */

      if (R) html += `<table><tr><td colspan="2"><b>${I.d.icon} ${esc(I.d.name)}</b>${R.welded > 1 ? ` <span class="muted">(+${R.welded - 1} welded)</span>` : ''}</td></tr>${R.mass != null ? `<tr><td>Mass</td><td>${R.mass < 1 ? (R.mass * 1000).toFixed(0) + ' g' : R.mass.toFixed(2) + ' kg'}</td></tr><tr><td>Speed</td><td>${R.speed.toFixed(2)} m/s</td></tr><tr><td>Height</td><td>${R.h.toFixed(2)} m</td></tr><tr><td>KE = ½mv²</td><td>${R.ke.toFixed(2)} J</td></tr><tr><td>PE = mgh</td><td>${R.pe.toFixed(2)} J</td></tr>${Math.abs(R.rpm) > .5 ? `<tr><td>Spin</td><td>${Math.abs(R.rpm).toFixed(0)} rpm</td></tr>` : ''}` : '<tr><td colspan="2" class="muted">Fixed in place</td></tr>'}</table>`;

    /* ---------------- rendering ---------------- */
    let tAnim = 0;
    function render(dt) {
      const L = look(), z = cam.z;
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, vw, vh);
      g.setTransform(dpr * z, 0, 0, dpr * z, dpr * (vw / 2 - cam.x * z), dpr * (vh / 2 - cam.y * z));

        g.beginPath(); g.moveTo(qa.x, qa.y); g.quadraticCurveTo(mx, my, qb.x, qb.y); g.strokeStyle = 'rgba(20,20,30,.6)'; g.lineWidth = 4 / Math.max(z, .5); g.stroke(); g.strokeStyle = playing ? '#4fd6ff' : '#ffd166'; g.lineWidth = 2 / Math.max(z, .5); g.setLineDash(playing ? [] : [6 / z, 4 / z]); g.stroke(); g.setLineDash([]);
        if (playing) { const k = (tAnim * .8) % 1, x = (1 - k) ** 2 * qa.x + 2 * (1 - k) * k * mx + k * k * qb.x, y = (1 - k) ** 2 * qa.y + 2 * (1 - k) * k * my + k * k * qb.y; g.beginPath(); g.arc(x, y, 3.5 / Math.max(z, .5), 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill(); }
        else if (canEdit()) { const m2 = wireMid(w); g.beginPath(); g.arc(m2[0], m2[1], 6 / z, 0, Math.PI * 2); g.fillStyle = '#ffd166'; g.fill(); g.fillStyle = '#14111c'; g.font = `${9 / z}px system-ui`; g.textAlign = 'center'; g.fillText('⚡', m2[0], m2[1] + 3 / z); } }
      if (wireFrom) { const A = byId(wireFrom); if (A) { g.beginPath(); g.arc(A.x, A.y, 26 + 4 * Math.sin(tAnim * 8), 0, Math.PI * 2); g.strokeStyle = '#4fd6ff'; g.lineWidth = 3 / z; g.stroke(); } }

        for (const j of bp.joints) { const A = byId(j.a), s = A && MM.snapsW(A)[j.sa]; if (!s) continue; const r = Math.max(5, 7 / z);
          if (j.k === 'pin') { g.beginPath(); g.arc(s.x, s.y, r, 0, Math.PI * 2); g.fillStyle = '#d4a73c'; g.fill(); g.strokeStyle = '#5b4210'; g.lineWidth = 1.2 / z; g.stroke(); g.beginPath(); g.moveTo(s.x - r * .5, s.y); g.lineTo(s.x + r * .5, s.y); g.moveTo(s.x, s.y - r * .5); g.lineTo(s.x, s.y + r * .5); g.stroke(); }

        if (snapPrev) { const S2 = snapPrev; if (S2.mesh) { g.beginPath(); g.arc(S2.A.x + S2.dx, S2.A.y + S2.dy, S2.A.p.r + 8, 0, Math.PI * 2); g.strokeStyle = '#5fd08f'; g.lineWidth = 3 / z; g.setLineDash([6 / z, 4 / z]); g.stroke(); g.setLineDash([]); } else { const pulse = 10 + 4 * Math.sin(tAnim * 12); g.beginPath(); g.moveTo(S2.sa.x, S2.sa.y); g.lineTo(S2.sb.x, S2.sb.y); g.strokeStyle = '#5fd08f'; g.lineWidth = 2 / z; g.stroke(); g.beginPath(); g.arc(S2.sb.x, S2.sb.y, pulse / z, 0, Math.PI * 2); g.strokeStyle = '#5fd08f'; g.lineWidth = 3 / z; g.stroke(); g.fillStyle = 'rgba(95,208,143,.25)'; g.fill(); } }

      if (rt) MMD.ambient(rt, dt);
      MMD.drawParticles(g, dt);
    }
    function loop(now) {
      if (!alive) return; raf = requestAnimationFrame(loop);
      const dt = Math.min(.05, (now - lastT) / 1000 || .016); lastT = now; tAnim += dt;
      if (playing && rt) stepRun(dt);

    /* ---------------- teacher ---------------- */

      if (S.teacher === 'off') { T.set({ stage: 'Machines & Mechanics', msg: teacherOffMsg('workshop'), next: null, acts: [] }); return; }
      if (mode === 'challenge') {
        const steps = ['Read the goal', 'Place parts', 'Press ▶ Play', 'Solved'], cur = won ? 3 : playing ? 2 : bp.parts.some(P => P.tray) || !level.tray.length ? 1 : 0;
        T.set({ stage: level.name, steps, cur, prog: cur / 3, msg: `<b>${esc(level.concept)}.</b> ${level.brief}`, next: !won ? { mv: '💡', how: S.teacher === 'live' || showGhost ? level.hints[0] : 'Tap 💡 Hint if you’d like a clue.' } : null,
          acts: [{ label: showGhost ? '🙈 Hide ghost' : '👻 Show ghost', fn: () => { showGhost = !showGhost; if (showGhost) hintsUsed++; dirty = true; coach(); } }, { label: '✨ Show me', fn: () => showMe() }, { label: '📖 Lesson', fn: () => { const pg = PAGES.find(p => p.id === level.lesson); pg ? showLessons('machines') : null; } }, { label: playing ? '■ Stop' : '▶ Play', fn: () => { playing ? stopRun() : play(); coach(); }, primary: true }] });
      } else if (mode === 'show') {
        T.set({ stage: 'Showcase', steps: MM_SHOWS.map(s => s.name), cur: MM_SHOWS.indexOf(show), msg: `<b>${esc(show.name)}.</b> ${esc(show.desc)} Tap any part to read about it; ⓘ explains the science.`, next: null,
          acts: [{ label: playing ? '■ Stop' : '▶ Play', fn: () => { playing ? stopRun() : play(); coach(); }, primary: true }, { label: '📋 Copy to my bench', fn: () => { const sb = JSON.parse(JSON.stringify(bp)); loadDesign(sb, show.name); } }, { label: 'Next show ▶', fn: () => openShow(MM_SHOWS[(MM_SHOWS.indexOf(show) + 1) % MM_SHOWS.length].id) }] });
      } else {
        const P = sel && byId(sel), d = P && defOf(P), F = d && MM_FACTS[d.fact];
        const steps = ['Add parts', 'Snap together', 'Play & test', 'Exhibit & sell'], cur = !bp.parts.length ? 0 : !bp.joints.length && bp.parts.length < 4 ? 1 : ws.sales ? 3 : 2;
        let msg = !bp.parts.length ? 'Your bench is empty. Tap <b>＋ Parts</b> and drop in a ramp, a ball and some dominoes — then press ▶ Play.' : playing ? 'Watch the physics: tap a moving part with the 🔬 lens on to see its speed, height and energy.' : F ? `<b>${esc(d.name)}</b> — ${esc(F.t)}. ${F.b.split('. ')[0]}. Tap ⓘ for the full story.` : 'Drag parts to move them. Drop one near another to snap. Tap a part for its manipulation wheel. When you’re proud of it, 🖼 Exhibit & sell.';
        T.set({ stage: 'Workshop', steps, cur, prog: cur / 3, msg, next: null, acts: [{ label: playing ? '■ Stop' : '▶ Play', fn: () => { playing ? stopRun() : play(); coach(); }, primary: true }, { label: '🏆 Challenges', fn: levelPicker }, { label: '🎪 Showcase', fn: showPicker }] });
      }
    }

    /* ---------------- keyboard ---------------- */
    const onKey = e => {
      if (curId !== 'machines' || e.target.closest?.('input,select,textarea') || $('#modalRoot').children.length) return;
      if (e.key === ' ') { e.preventDefault(); playing ? stopRun() : play(); coach(); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && sel && canEdit()) { const P = byId(sel); if (P && (mode === 'build' || P.tray)) { snapshot(); removePart(P); changed(); } }
      else if ((e.key === 'q' || e.key === 'e') && sel && canEdit()) rotateSel((e.key === 'q' ? -1 : 1) * (e.shiftKey ? 1 : 15) * Math.PI / 180);
      else if (e.key === 'Escape') { select(null); tool = 'hand'; wireFrom = null; paintBar(); }
    };
    document.addEventListener('keydown', onKey);

    /* ---------------- start ---------------- */
    const ro = new ResizeObserver(() => resize()); ro.observe(host); resize();
    if (o.level) openLevel(o.level); else if (o.show) openShow(o.show); else openBench();
    raf = requestAnimationFrame(loop);
    mmApi = { openLevel };
    const api = {
      undo() { if (playing) stopRun(); const s = hist.pop(); if (!s) { toast('Nothing to undo'); return; } const o2 = JSON.parse(s); if (mode === 'build') { const before = {}; bp.parts.forEach(P => before[P.t] = (before[P.t] || 0) + 1); const after = {}; o2.bp.parts.forEach(P => after[P.t] = (after[P.t] || 0) + 1); for (const t of new Set([...Object.keys(before), ...Object.keys(after)])) ws.inv[t] = (ws.inv[t] || 0) + (before[t] || 0) - (after[t] || 0); } bp = o2.bp; tray = o2.tray || []; if (mode === 'build') ws.bench = bp; sel = null; paintDrawer(); changed(); beep('tick'); },
      hint() { hintsUsed++; if (mode === 'challenge') { showGhost = true; dirty = true; T.set({ msg: '👻 ' + level.hints[0] }); toast('Ghost shows where the parts go'); coach(); } else if (mode === 'show') { T.note('Tap any part, then ⓘ, to learn the science behind it.'); } else { const tips = ['Put a ball at the top of a ramp — gravity does the rest.', 'Dominoes topple best about three-quarters of their height apart.', 'Snap a wheel onto a motor’s shaft to make it spin.', 'A seesaw plus a heavy drop makes a catapult.', 'Wire a button to a rocket on a cart for a surprise.', 'Collectors pay more for music, chain reactions and flight.', 'Tap a joint marker to switch between pin (turns) and weld (rigid).', 'Two fingers on a selected part twist just that part.']; T.set({ msg: '💡 ' + tips[Math.floor(Math.random() * tips.length)] }); } },
      newGame() { if (mode === 'challenge') openLevel(level.id); else if (mode === 'show') openShow(show.id); else { if (!bp.parts.length) return; modal('Clear the bench?', '<p>All parts go back on your shelf.</p><div class="row"><button class="btn primary" data-ok>Clear it</button><button class="btn" data-close>Cancel</button></div>', mb => $('[data-ok]', mb).onclick = () => { closeModal(); stopRun(); snapshot(); for (const P of bp.parts) ws.inv[P.t] = (ws.inv[P.t] || 0) + 1; bp.parts = []; bp.joints = []; bp.wires = []; sel = null; changed(); }); } },
      coach, resize, restyle() { dirty = true; },
      destroy() { alive = false; cancelAnimationFrame(raf); ro.disconnect(); document.removeEventListener('keydown', onKey); MMD.SND.stopLoops(); MMD.clearParticles(); saveWS(); mmApi = null; }
    };
    GAMES.machines._dbg = { get bp() { return bp; }, get rt() { return rt; }, get ws() { return ws; }, set ws(v) { ws = v; }, get cam() { return cam; }, get sel() { return sel; }, get mode() { return mode; }, get tray() { return tray; }, get playing() { return playing; }, get won() { return won; },
      toScreen, toWorld, play, stop: () => stopRun(), select, openLevel, openShow, openBench, showMe, addFromShelf, rotateSel, wheelAct, buy, startExhibit, finishExhibit, fit, setScope: s => { scope = s; }, setTool: t => { tool = t; }, saveWS, partsList, openStore, slotsModal, factCard, propSheet: id => propSheet(byId(id)) };
    return api;

});
